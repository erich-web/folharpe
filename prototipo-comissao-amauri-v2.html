/* ============================ MOTOR DE CÁLCULO ============================ */
function calcular(){
  const P = PREMISSAS;
  const retencao = P.taxaTotal * P.retencaoPct/100;
  const distribuida = P.taxaTotal - retencao - P.extras;

  // 1) métricas por funcionário
  const rows = FUNC.map(f=>{
    const base = ptsDoCargo(f.cargo);
    const setor = setorDoCargo(f.cargo);
    const e = ESCALA[f.nome]||{};
    const falta=e.falta||0, atraso=e.atraso||0, adv=e.advertencia||0, dobra=e.dobra||0, extra=e.extra||0;
    // dias trabalhados p/ comissão (simplificado: período cheio menos faltas)
    const diasTrab = Math.max(0, P.diasPeriodo - falta);
    const Z = (diasTrab/P.diasPeriodo)*base;            // pontos qualificados
    let desc = Z*(falta*REGRAS.falta + atraso*REGRAS.atraso + adv*REGRAS.advertencia);
    desc = Math.min(desc, Z);                            // não passa do total
    let finais = Z - desc; if(finais>0 && finais<0.1) finais=0.1; if(diasTrab===0) finais=0;
    const recebeRepique = desc<=0;
    return {f, setor, base, falta, atraso, adv, dobra, extra, diasTrab, Z, desc, finais, recebeRepique};
  });

  // 2) R$/ponto por setor
  const somaZ = {}, somaDesc={}, somaFinaisQ={};
  SETORES.forEach(s=>{somaZ[s]=0;somaDesc[s]=0;somaFinaisQ[s]=0});
  rows.forEach(r=>{ somaZ[r.setor]+=r.Z; somaDesc[r.setor]+=r.desc; if(r.recebeRepique) somaFinaisQ[r.setor]+=r.finais; });
  const rsPonto={}, poolRepique={}, rsPontoRepique={};
  SETORES.forEach(s=>{
    const bucket = distribuida*(RATEIO[s]||0)/100;
    rsPonto[s] = somaZ[s]>0 ? bucket/somaZ[s] : 0;
    poolRepique[s] = somaDesc[s]*rsPonto[s];
    rsPontoRepique[s] = somaFinaisQ[s]>0 ? poolRepique[s]/somaFinaisQ[s] : 0;
  });

  // 3) ranking
  const bucketRanking = distribuida*(RATEIO['Ranking']||0)/100;
  const bonusRanking = {};
  RANKING_NOMES.forEach((n,i)=>{ bonusRanking[n]= bucketRanking*(RANKING_PCT[i]||0)/100; });

  // 4) totais por funcionário
  rows.forEach(r=>{
    r.comissao = r.finais * rsPonto[r.setor];
    r.repique = r.recebeRepique ? r.finais * rsPontoRepique[r.setor] : 0;
    r.ranking = bonusRanking[r.f.nome]||0;
    r.comTotal = r.comissao + r.repique + r.ranking;
    r.comDentro = r.comTotal*HOLERITE.dentro/100;   // comissão paga por dentro
    r.comFora = r.comTotal*HOLERITE.fora/100;        // comissão paga por fora
    const bruto = r.f.salario + r.comTotal + r.f.beneficios;
    r.complementoMin = Math.max(0, (r.f.minimo||0) - bruto);
    r.total = bruto + r.complementoMin;
    // Partição do total: holerite (oficial) vs fora
    r.pagoDentro = r.f.salario + r.f.beneficios + r.complementoMin + r.comDentro;
    r.pagoFora = r.comFora;
  });

  return {retencao, distribuida, rows, rsPonto, poolRepique, bucketRanking, bonusRanking,
          totalComissao: rows.reduce((a,r)=>a+r.comTotal,0),
          totalFolha: rows.reduce((a,r)=>a+r.total,0)};
}

const STATUS_OPTS = ['Normal','Falta','Atraso','Dobra','Folga','Advertência','Atestado','Extra','Férias','Afastamento'];
function stBadge(st){
  const m={'Normal':'bg-green-100 text-green-700','Folga':'bg-slate-100 text-slate-500','Atestado':'bg-amber-100 text-amber-700','Falta':'bg-red-100 text-red-700','Atraso':'bg-orange-100 text-orange-700','Dobra':'bg-purple-100 text-purple-700','Extra':'bg-blue-100 text-blue-700','Férias':'bg-teal-100 text-teal-700','Afastamento':'bg-slate-200 text-slate-600','Advertência':'bg-rose-100 text-rose-700'}[st]||'bg-slate-100';
  return `<span class="badge ${m}">${st}</span>`;
}
let verDetalhe=false;
// códigos curtos por status p/ a grade
const ST_ABBR={'Normal':['N','text-green-700'],'Falta':['F','bg-red-100 text-red-700 font-bold'],'Atraso':['A','bg-orange-100 text-orange-700 font-bold'],'Folga':['Fg','text-slate-400'],'Atestado':['At','bg-amber-100 text-amber-700 font-semibold'],'Dobra':['D','bg-purple-100 text-purple-700 font-bold'],'Extra':['E','bg-blue-100 text-blue-700 font-bold'],'Advertência':['Ad','bg-rose-100 text-rose-700 font-bold'],'Férias':['Fé','bg-teal-100 text-teal-700'],'Afastamento':['Af','bg-slate-200 text-slate-600']};
const DIAS16 = CARTAO.dias.slice(0,16); // 1ª quinzena do período do cartão (26/04 a 11/05)
let LIMITE_HE = 2; // horas extras/dia ACIMA disso = pagar; até esse limite = vai p/ banco
function sldToMin(s){ if(!s) return 0; const sig=s[0]==='-'?-1:1; const [h,m]=s.replace(/[+\-]/,'').split(':').map(Number); return sig*(h*60+m); }
function fmtMin(min){ const sig=min<0?'-':'+'; const a=Math.abs(Math.round(min)); return `${sig}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`; }
// Analisa banco x horas extras a pagar conforme a regra do limite diário
function analisaBanco(slds){
  let banco=0, pagar=0; const diasPagar=[];
  slds.forEach((s,i)=>{ const min=sldToMin(s); if(min===0) return;
    if(min > LIMITE_HE*60){ pagar+=min; diasPagar.push(i); }   // >2h no dia -> pagar
    else { banco+=min; }                                        // <=2h (ou débito) -> banco
  });
  return {banco, pagar, diasPagar};
}

// Escala por funcionário (16 dias). ALYFER = lido do arquivo real; demais = simulados.
function escalaDe(f){
  if(f.nome===CARTAO.func) return DIAS16.map(x=>x.st);
  const e=ESCALA[f.nome]||{};
  const arr=Array(16).fill('Normal');
  const off=f.nome.length%5;
  [3,10].forEach(b=>{arr[(b+off)%16]='Folga';});           // ~2 folgas
  let i=0; const put=(st,from,dir=1)=>{let j=from;while(j>=0&&j<16&&arr[j]!=='Normal')j+=dir; if(j>=0&&j<16)arr[j]=st;};
  for(let k=0;k<(e.falta||0);k++) put('Falta',0,1);
  for(let k=0;k<(e.atraso||0);k++) put('Atraso',15,-1);
  for(let k=0;k<(e.advertencia||0);k++) put('Advertência',8,1);
  for(let k=0;k<(e.dobra||0);k++) put('Dobra',5,1);
  return arr;
}

// Drill-down: como o cartão do ALYFER foi lido (batida a batida)
function viewCartaoDetalhe(){
  const d = CARTAO;
  const cnt={}; STATUS_OPTS.forEach(s=>cnt[s]=0); d.dias.forEach(x=>cnt[x.st]=(cnt[x.st]||0)+1);
  const totHoras = d.dias.reduce((a,x)=>a+(x.horas||0),0);
  const chips=Object.entries(cnt).filter(([,v])=>v>0).map(([k,v])=>`<span class="badge bg-slate-100 text-slate-700 mr-1">${k}: ${v}</span>`).join('');
  return `<div class="mt-5 animate-fade">`
  + `<div class="flex items-center gap-2 mb-3"><i data-feather="file-text" class="w-4 h-4 text-blue-600"></i><h3 class="font-bold text-slate-900">Leitura do cartão — ${d.func.split(' ').slice(0,2).join(' ')} <span class="font-normal text-slate-400 text-sm">(${d.funcao} · ${d.depto} · ${d.periodo})</span></h3></div>`

/* ---------- EXTRAS (calendário + aprovação) ---------- */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function ymd(a,m,d){return `${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function extrasDia(ds){return EXTRAS.filter(e=>e.data===ds);}
function mudarMes(delta){let m=extrasMes.mes+delta,a=extrasMes.ano; if(m<1){m=12;a--;} if(m>12){m=1;a++;} extrasMes={ano:a,mes:m}; render();}
function addExtra(){
  const g=id=>(document.getElementById(id)||{}).value;
  const data=g('ex_data'); if(!data){alert('Informe a data do extra.');return;}
  EXTRAS.push({data, setor:g('ex_setor'), funcao:g('ex_funcao')||'Extra', qtd:+g('ex_qtd')||1, diaria:+g('ex_diaria')||0, lider:g('ex_lider'), status:'Aprovado'});
  const d=new Date(data); extrasMes={ano:d.getFullYear(), mes:d.getMonth()+1}; render();
}
function setExtraStatus(i,s){EXTRAS[i].status=s;render();}
function viewExtras(){
  const {ano,mes}=extrasMes;
  const pref=`${ano}-${String(mes).padStart(2,'0')}`;
  const doMes=EXTRAS.map((e,i)=>({e,i})).filter(o=>o.e.data.startsWith(pref));
  const aprov=doMes.filter(o=>o.e.status==='Aprovado');
  const pend=doMes.filter(o=>o.e.status==='Pendente');
  const totalQtd=aprov.reduce((a,o)=>a+o.e.qtd,0);
  const custo=aprov.reduce((a,o)=>a+o.e.qtd*o.e.diaria,0);
  const diasComExtra=new Set(aprov.map(o=>o.e.data)).size;
  const kpis=[
    ['EXTRAS CONTRATADOS', totalQtd, `em ${diasComExtra} dias`, 'text-blue-600'],
    ['CUSTO TOTAL', money(custo), 'qtd × diária (aprovados)', 'text-slate-900'],
    ['PENDENTES DE APROVAÇÃO', pend.length, pend.length?'aguardando líder':'tudo aprovado', pend.length?'text-amber-600':'text-green-600'],
    ['MÉDIA POR DIA ATIVO', diasComExtra?(totalQtd/diasComExtra).toFixed(1):'0', 'extras/dia com movimento', 'text-slate-900'],
  ];

  // calendário
  const first=new Date(ano,mes-1,1); const startDow=first.getDay(); const dim=new Date(ano,mes,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++)cells.push(null); for(let d=1;d<=dim;d++)cells.push(d); while(cells.length%7)cells.push(null);
  const qtdDoDia=d=>extrasDia(ymd(ano,mes,d)).filter(e=>e.status==='Aprovado').reduce((a,e)=>a+e.qtd,0);
  const maxQ=Math.max(1,...Array.from({length:dim},(_,i)=>qtdDoDia(i+1)));
  const calendar = card(`<div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>${MESES[mes-1]} / ${ano}</h3>
        <div class="flex gap-1">
          <button onclick="mudarMes(-1)" class="p-2 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-left" class="w-4 h-4"></i></button>
          <button onclick="mudarMes(1)" class="p-2 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-right" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-1.5 mb-1">${DOW.map(d=>`<div class="text-center text-xs font-semibold ${['Dom','Sáb'].includes(d)?'text-blue-500':'text-slate-400'}">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1.5">${cells.map(d=>{
        if(!d) return `<div class="h-20 rounded bg-slate-50/50"></div>`;
        const ds=ymd(ano,mes,d); const itens=extrasDia(ds); const q=qtdDoDia(d);
        const cst=itens.filter(e=>e.status==='Aprovado').reduce((a,e)=>a+e.qtd*e.diaria,0);
        const hasPend=itens.some(e=>e.status==='Pendente');
        const ratio=q/maxQ; const bg = q===0?'bg-white':ratio>0.66?'bg-blue-600 text-white':ratio>0.33?'bg-blue-400 text-white':'bg-blue-100 text-blue-800';
        const tip = itens.length?`title="${itens.map(e=>e.qtd+'× '+e.funcao+' ('+e.setor+') — '+e.status).join('\\n')}"`:'';
        const claro = q && ratio>0.33;
        return `<div ${tip} class="h-20 rounded border border-slate-200 p-1.5 flex flex-col ${bg} ${q?'cursor-help':''}">
          <div class="flex justify-between items-start"><span class="text-xs font-semibold ${claro?'text-white':'text-slate-500'}">${d}</span>${hasPend?'<span class="w-2 h-2 rounded-full bg-amber-400" title="Há extra pendente"></span>':''}</div>
          ${q?`<div class="mt-auto"><div class="${claro?'text-white':'text-blue-700'} text-lg font-bold leading-none">${q}</div><div class="text-[9px] ${claro?'text-blue-100':'text-slate-400'}">${money(cst).replace('R$ ','R$ ')}</div></div>`:''}
        </div>`;
      }).join('')}</div>
      <p class="text-[11px] text-slate-400 mt-3">Intensidade da cor = quantidade de extras no dia. Ponto âmbar = há extra pendente de aprovação. Passe o mouse para detalhes.</p>
    </div>`);

  // formulário de aprovação
  const setoresOpt=SETORES.map(s=>`<option>${s}</option>`).join('');
  const lideres=['Marcio Roberto','Claudio Oliveira','Luiz Vieira','Naziel Lino','Thiago Azevedo'];
  const form = card(`<div class="p-5"><h3 class="font-bold text-slate-900 mb-1 flex items-center gap-2"><i data-feather="user-plus" class="w-4 h-4 text-blue-600"></i>Aprovar extra</h3>
      <p class="text-xs text-slate-500 mb-4">Formulário preenchido pelo líder ao contratar um extra.</p>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-slate-500 block mb-1">Data</label><input id="ex_data" type="date" value="${ano}-${String(mes).padStart(2,'0')}-15" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Setor</label><select id="ex_setor" class="w-full px-2 py-2 border border-slate-200 rounded text-sm">${setoresOpt}</select></div>
        <div><label class="text-xs text-slate-500 block mb-1">Função</label><input id="ex_funcao" placeholder="Garçom Extra" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Quantidade</label><input id="ex_qtd" type="number" min="1" value="1" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Diária (R$)</label><input id="ex_diaria" type="number" value="120" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Líder responsável</label><select id="ex_lider" class="w-full px-2 py-2 border border-slate-200 rounded text-sm">${lideres.map(l=>`<option>${l}</option>`).join('')}</select></div>
      </div>
      <button onclick="addExtra()" class="mt-4 w-full px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center justify-center gap-2"><i data-feather="check" class="w-4 h-4"></i>Registrar e aprovar extra</button>
    </div>`);

  // lista
  const lista = card(`<div class="p-5"><h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i data-feather="list" class="w-4 h-4 text-blue-600"></i>Extras do mês</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600"><tr><th class="px-2 py-2 text-left">Data</th><th class="px-2 py-2 text-left">Setor</th><th class="px-2 py-2 text-left">Função</th><th class="px-2 py-2 text-center">Qtd</th><th class="px-2 py-2 text-right">Diária</th><th class="px-2 py-2 text-right">Total</th><th class="px-2 py-2 text-left">Líder</th><th class="px-2 py-2 text-center">Status</th></tr></thead><tbody>
      ${doMes.sort((a,b)=>a.e.data.localeCompare(b.e.data)).map(o=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
        <td class="px-2 py-1.5 font-medium">${o.e.data.slice(8,10)}/${o.e.data.slice(5,7)}</td>
        <td class="px-2 py-1.5">${setorBadge(o.e.setor)}</td><td class="px-2 py-1.5 text-slate-600">${o.e.funcao}</td>
        <td class="px-2 py-1.5 text-center font-semibold">${o.e.qtd}</td><td class="px-2 py-1.5 text-right text-slate-500">${money(o.e.diaria)}</td>
        <td class="px-2 py-1.5 text-right font-semibold">${money(o.e.qtd*o.e.diaria)}</td><td class="px-2 py-1.5 text-slate-600">${o.e.lider}</td>
        <td class="px-2 py-1.5 text-center">${o.e.status==='Aprovado'?'<span class="badge bg-green-100 text-green-700">Aprovado</span>':`<button onclick="setExtraStatus(${o.i},'Aprovado')" class="badge bg-amber-100 text-amber-700 hover:bg-amber-200">Aprovar ✓</button>`}</td>
      </tr>`).join('')||'<tr><td colspan="8" class="text-center text-slate-400 py-6">Nenhum extra neste mês.</td></tr>'}
      </tbody></table></div>
      <div class="mt-3 text-[11px] text-slate-500 flex items-center gap-2"><i data-feather="link" class="w-3.5 h-3.5"></i>O custo total dos extras aprovados (${money(custo)}) alimenta o campo "Gasto com extras" na cascata da Comissão Quinzenal.</div>
    </div>`);

  return pageHeader('Extras','Calendário de extras contratados por dia — aprovados pelos líderes')
    + `<div class="grid grid-cols-4 gap-4 mb-5">${kpis.map(k=>card(`<div class="p-5"><p class="text-xs text-slate-500 font-semibold mb-2">${k[0]}</p><p class="text-2xl font-bold ${k[3]}">${k[1]}</p><p class="text-xs text-slate-400 mt-2">${k[2]}</p></div>`)).join('')}</div>`
    + `<div class="grid grid-cols-3 gap-4 mb-4"><div class="col-span-2">${calendar}</div><div>${form}</div></div>`
    + lista;
}

      <div><h3 class="font-bold mb-3 text-sm text-slate-600">Top vendedores (colar do TOTVS)</h3>
        <table class="w-full text-sm"><thead class="text-slate-500 text-xs"><tr><th class="text-left py-1">#</th><th class="text-left">Vendedor</th><th class="text-right">Bônus</th></tr></thead><tbody>
        ${RANKING_NOMES.map((n,i)=>`<tr class="border-b border-slate-100"><td class="py-2 font-bold text-slate-400">${i+1}º</td><td class="py-2">${n.split(' ').slice(0,2).join(' ')}</td><td class="py-2 text-right font-semibold text-amber-600">${money(c.bonusRanking[n])}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div></div>`);
}

/* ============================ RENDER ============================ */
function render(){
  renderNav();
  const v = {dashboard:viewDashboard,cadastro:viewCadastro,config:viewConfig,ponto:viewPonto,extras:viewExtras,comissao:viewComissao,ranking:viewRanking}[current];
  const el = document.getElementById('view');
  el.className = 'p-8 max-w-[1400px] mx-auto animate-fade';
  el.innerHTML = v();
  feather.replace();
}
render();
</script>
</body>
</html>
