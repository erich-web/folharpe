/* datas / ciclos */
const MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOWF=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function stripT(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function fmtData(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function fmtDM(d){ return `${String(d.getDate()).padStart(2,'0')}/${MES_ABR[d.getMonth()]}`; }
function nthBusinessDay(ano,mes,n){ let d=new Date(ano,mes-1,1),c=0; while(c<n){const w=d.getDay(); if(w!==0&&w!==6)c++; if(c<n)d.setDate(d.getDate()+1);} return d; }
function dataPagamento(c,ano,mes){ return c.pag_tipo==='util'?nthBusinessDay(ano,mes,c.pag_n):new Date(ano,mes-1,c.pag_dia); }
function janelaApur(c,ano,mes){ return {ini:new Date(ano,mes-1+c.apur_ini_off,c.apur_ini_dia), fim:new Date(ano,mes-1+c.apur_fim_off,c.apur_fim_dia)}; }
function proximoPagamento(hoje){
  const base=hoje.getFullYear()*12+hoje.getMonth(); const cands=[];
  for(let k=-1;k<=4;k++){const ym=base+k,ano=Math.floor(ym/12),mes=ym%12+1; S.ciclos.forEach(c=>cands.push({c,dp:dataPagamento(c,ano,mes),jan:janelaApur(c,ano,mes)}));}
  const h=stripT(hoje); return cands.filter(x=>stripT(x.dp)>=h).sort((a,b)=>a.dp-b.dp)[0];
}

  return m;
}

async function carregarDados(){
  S.loading=true; render();
  try{
    const r = await sb.from('restaurantes').select('*').order('id').limit(1).single();
    S.restaurante = r.data;
    const rid = S.restaurante?.id;
    const [cfg, set, car, fun, rat, rank, cic, per, ext, pag] = await Promise.all([
      sb.from('config_remuneracao').select('*').eq('restaurante_id',rid).single(),
      sb.from('setores').select('*').eq('restaurante_id',rid).order('ordem'),
      sb.from('cargos').select('*, setores(nome)').eq('restaurante_id',rid).order('pontos',{ascending:false}),
      sb.from('funcionarios').select('*, cargos(nome,pontos,setor_id,setores(nome))').eq('restaurante_id',rid).order('nome'),
      sb.from('config_rateio').select('*, setores(nome)').eq('restaurante_id',rid),
      sb.from('ranking_premio').select('*').eq('restaurante_id',rid).order('colocacao'),
      sb.from('ciclos_pagamento').select('*').eq('restaurante_id',rid).order('ordem'),
      sb.from('periodos').select('*, ciclos_pagamento(nome)').eq('restaurante_id',rid).order('data_inicio',{ascending:false}),
      sb.from('extras').select('*, setores(nome)').eq('restaurante_id',rid).order('data'),
      sb.from('pagamentos').select('*, periodos(data_inicio,data_fim,ano)').eq('restaurante_id',rid).order('data_pagamento',{ascending:false}),
    ]);
    S.config=cfg.data; S.setores=set.data||[]; S.cargos=car.data||[]; S.funcionarios=fun.data||[];
    S.rateio=rat.data||[]; S.ranking=rank.data||[]; S.ciclos=cic.data||[];
    S.periodos=per.data||[]; S.extras=ext.data||[]; S.pagamentos=pag.data||[];
    const prof=await sb.from('profiles').select('*').eq('id',S.session.user.id).single(); S.perfil=prof.data;
    if(S.perfil?.papel==='admin'){ const us=await sb.from('profiles').select('*').order('email'); S.usuarios=us.data||[]; }
    if(!S.periodoAtual && S.periodos.length) S.periodoAtual=S.periodos[0];
    if(S.periodoAtual) S.periodoAtual=S.periodos.find(p=>p.id===S.periodoAtual.id)||S.periodos[0]||null;
    await carregarPonto();
    S.erro=null;
  }catch(e){ S.erro='Erro ao carregar dados: '+(e.message||e); }
  S.loading=false;
}
async function carregarPonto(){
  S.adiantAnt={}; S.adiantAntPeriodo=null;
  if(!S.periodoAtual){ S.ponto=[]; S.rankingPeriodo=[]; return; }
  const [pt, rp] = await Promise.all([
    sb.from('controle_ponto').select('*').gte('data',S.periodoAtual.data_inicio).lte('data',S.periodoAtual.data_fim),
    sb.from('ranking_periodo').select('*').eq('periodo_id',S.periodoAtual.id),
  ]);
  S.ponto=pt.data||[]; S.rankingPeriodo=rp.data||[];
  // OFICIAL: puxa o último adiantamento do mês anterior (salário 40% + comissão guardados)
  if(S.periodoAtual.tipo_pagamento==='oficial'){
    const p=S.periodoAtual; const mesAnt=p.mes-1>0?p.mes-1:12; const anoAnt=p.mes-1>0?p.ano:p.ano-1;
    const ant=S.periodos.filter(x=>x.tipo_pagamento==='adiantamento' && x.mes===mesAnt && x.ano===anoAnt)
      .sort((a,b)=>b.data_inicio.localeCompare(a.data_inicio))[0]
      || S.periodos.filter(x=>x.tipo_pagamento==='adiantamento' && x.data_inicio<p.data_inicio).sort((a,b)=>b.data_inicio.localeCompare(a.data_inicio))[0];
    if(ant){ S.adiantAntPeriodo=ant;
      const { data }=await sb.from('comissao_resultado').select('funcionario_id,adiant_salario,comissao_total').eq('periodo_id',ant.id);
      (data||[]).forEach(r=>{ S.adiantAnt[r.funcionario_id]={ salario:Number(r.adiant_salario)||0, comissao:Number(r.comissao_total)||0 }; }); }
  }
}
async function selectPeriodo(id){
  S.periodoAtual=S.periodos.find(p=>p.id===+id)||null;
  await carregarPonto(); render();

function diasEntre(ini,fim){ return Math.round((stripT(new Date(fim+'T00:00:00'))-stripT(new Date(ini+'T00:00:00')))/86400000)+1; }
function ymdStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function mesesTrabalhados(dataAdm, ano){
  if(!dataAdm) return 12;
  const d=new Date(dataAdm+'T00:00:00'), ya=d.getFullYear();
  if(ya<ano) return 12; if(ya>ano) return 0;
  const conta = d.getDate()<=15 ? (12-d.getMonth()) : (12-d.getMonth()-1);
  return Math.max(0,Math.min(12,conta));
}
// datas padrão por mês de pagamento: oficial(5º útil) apura 10–25 do mês anterior; adiantamento(dia 20) apura 26 do anterior a 9
function datasPadraoMes(ano, mes, tipo){
  if(tipo==='oficial') return {ini:ymdStr(new Date(ano,mes-2,10)), fim:ymdStr(new Date(ano,mes-2,25))};
  return {ini:ymdStr(new Date(ano,mes-2,26)), fim:ymdStr(new Date(ano,mes-1,9))};
}
async function criarPeriodo(){
  const tipo=val('np_tipo')||'oficial', ini=val('np_inicio'), fim=val('np_fim');
  if(!ini||!fim){ alert('Informe as datas de início e fim da apuração.'); return; }
  if(fim<ini){ alert('A data fim não pode ser anterior ao início.'); return; }
  const funcId = tipo==='rescisao' ? (+val('np_func')||null) : null;
  if(tipo==='rescisao' && !funcId){ alert('Escolha o funcionário da rescisão.'); return; }
  // reaproveita período existente com mesmo tipo + datas (+ funcionário, p/ rescisão)
  const ex=S.periodos.find(p=>p.tipo_pagamento===tipo && p.data_inicio===ini && p.data_fim===fim && (tipo!=='rescisao'||p.funcionario_id===funcId));
  if(ex){ S.periodoAtual=ex; await carregarPonto(); render(); return; }
  const d=new Date(ini+'T00:00:00');
  const rec={ restaurante_id:S.restaurante.id, ciclo_id:null, tipo_pagamento:tipo, funcionario_id:funcId, ano:d.getFullYear(), mes:d.getMonth()+1,
    data_inicio:ini, data_fim:fim, dias_periodo:diasEntre(ini,fim),
    taxa_servico_total:0, retencao_pct:Number(S.config.retencao_casa_pct)||33, status:'aberto' };
  const { data, error }=await sb.from('periodos').insert(rec).select('*').single();
  if(error){ alert('Erro ao criar período: '+error.message); return; }
  S.periodoAtual=data; await carregarDados(); render();
}
window.abrirMes = async function(val){
  if(!val) return; const [tipo,mesS]=val.split('|'); const mes=+mesS;
  const d=datasPadraoMes(anoSel, mes, tipo);
  const ex=S.periodos.find(p=>p.tipo_pagamento===tipo && p.data_inicio===d.ini && p.data_fim===d.fim);
  if(ex){ S.periodoAtual=ex; await carregarPonto(); render(); return; }
  if(!podeEscrever('comissao')){ alert('Esse período ainda não foi criado.'); return; }
  const di=new Date(d.ini+'T00:00:00');
  const rec={ restaurante_id:S.restaurante.id, ciclo_id:null, tipo_pagamento:tipo, funcionario_id:null, ano:di.getFullYear(), mes:di.getMonth()+1,
    data_inicio:d.ini, data_fim:d.fim, dias_periodo:diasEntre(d.ini,d.fim), taxa_servico_total:0, retencao_pct:Number(S.config.retencao_casa_pct)||33, status:'aberto' };
  const { data, error }=await sb.from('periodos').insert(rec).select('*').single();
  if(error){ alert('Erro: '+error.message); return; }
  S.periodoAtual=data; await carregarDados(); render();
};
async function gerarPeriodosAno(){
  if(!confirm('Gerar os 24 períodos (adiantamento + oficial) de '+anoSel+'? Os que já existirem não serão duplicados.')) return;
  const novos=[];
  for(let m=1;m<=12;m++){
    // Adiantamento (dia 20 do mês m): apuração 26 do mês anterior → 9 do mês m
    const aIni=new Date(anoSel,m-2,26), aFim=new Date(anoSel,m-1,9);
    // Oficial (5º dia útil do mês m): apuração 10 → 25 do mês anterior
    const oIni=new Date(anoSel,m-2,10), oFim=new Date(anoSel,m-2,25);
    [['adiantamento',aIni,aFim],['oficial',oIni,oFim]].forEach(([tp,di,df])=>{
      const i=ymdStr(di), f=ymdStr(df);
      if(!S.periodos.some(p=>p.tipo_pagamento===tp&&p.data_inicio===i&&p.data_fim===f))
        novos.push({ restaurante_id:S.restaurante.id, ciclo_id:null, tipo_pagamento:tp, funcionario_id:null,
          ano:di.getFullYear(), mes:di.getMonth()+1, data_inicio:i, data_fim:f, dias_periodo:diasEntre(i,f),
          taxa_servico_total:0, retencao_pct:Number(S.config.retencao_casa_pct)||33, status:'aberto' });
    });
  }
  if(!novos.length){ alert('Todos os períodos do ano já existem.'); return; }
  const { error }=await sb.from('periodos').insert(novos);
  if(error){ alert('Erro: '+error.message); return; }
  await carregarDados(); render(); alert(novos.length+' períodos criados para '+anoSel+'.');
}
async function salvarCampoPeriodo(campo,valor){
  if(!S.periodoAtual) return;
  await sb.from('periodos').update({[campo]:valor}).eq('id',S.periodoAtual.id);
  S.periodoAtual[campo]=valor;
}

  const v=id=>+(document.getElementById(id)||{}).value||0;
  // config_remuneracao
  const dentro=v('cf_dentro');
  const upd={ desconto_falta_pct:v('cf_falta'), desconto_atraso_pct:v('cf_atraso'), desconto_advertencia_pct:v('cf_adv'),
    valor_dobra:v('cf_dobra'), valor_extra_diaria:v('cf_extra'), retencao_casa_pct:v('cf_retencao'),
    holerite_dentro_pct:dentro, holerite_fora_pct:100-dentro, desc_extras_pct:v('cf_descextras'), limite_he_dia_horas:v('cf_he'),
    horas_mes_base:v('cf_horasmes')||220, adicional_he_pct:v('cf_adiche'), adiantamento_pct:v('cf_adiantpct')||40, updated_at:new Date().toISOString() };
  let e1=(await sb.from('config_remuneracao').update(upd).eq('id',S.config.id)).error;

  const rk=S.rateio.find(x=>x.tipo==='ranking'); const rkv=v('cr_ranking');
  if(rk) await sb.from('config_rateio').update({percentual:rkv}).eq('id',rk.id);

<script>
/* ===================== COMISSÃO QUINZENAL (motor real) ===================== */
function agregaPonto(funcId){
  const cnt={Falta:0,Atraso:0,'Advertência':0,Dobra:0,Extra:0,Normal:0,Folga:0,Atestado:0};
  S.ponto.filter(p=>p.funcionario_id===funcId).forEach(p=>{ cnt[p.status]=(cnt[p.status]||0)+1; });
  return cnt;
}
function calcComissao(){
  const p=S.periodoAtual, cfg=S.config; if(!p||!cfg) return null;
  const dias=Number(p.dias_periodo)||16;
  const taxaTotal=Number(p.taxa_servico_total)||0;
  const retPct=Number(p.retencao_pct)||0;
  const retencao=taxaTotal*retPct/100;
  const extrasAprov=S.extras.filter(e=>e.status==='Aprovado' && e.periodo_id===p.id);
  const extrasTotal=extrasAprov.reduce((a,e)=>a+e.quantidade*Number(e.diaria),0);
  const extrasDesc=extrasTotal*Number(cfg.desc_extras_pct)/100;
  const distribuida=taxaTotal-retencao-extrasDesc;
  const ratePct={}; S.setores.forEach(s=>{const r=S.rateio.find(x=>x.tipo==='setor'&&x.setor_id===s.id);ratePct[s.nome]=Number(r?.percentual||0);});
  const rankingPct=Number((S.rateio.find(x=>x.tipo==='ranking')||{}).percentual||0);
  const rankBucket=distribuida*rankingPct/100;
  const bonusByFunc={}; S.rankingPeriodo.forEach(rp=>{ const prem=S.ranking.find(x=>x.colocacao===rp.colocacao); if(prem) bonusByFunc[rp.funcionario_id]=rankBucket*Number(prem.percentual)/100; });

  const rows=S.funcionarios.map(f=>{
    const cg=f.cargos||{}; const base=Number(cg.pontos||0); const setor=cg.setores?.nome||'Outros';
    const c=agregaPonto(f.id); const falta=c.Falta,atraso=c.Atraso,adv=c['Advertência'];
    const diasTrab=Math.max(0,dias-falta);
    const Z=(diasTrab/dias)*base;
    let desc=Z*(falta*Number(cfg.desconto_falta_pct)/100 + atraso*Number(cfg.desconto_atraso_pct)/100 + adv*Number(cfg.desconto_advertencia_pct)/100);
    desc=Math.min(desc,Z);
    let finais=Z-desc; if(finais>0&&finais<0.1)finais=0.1; if(diasTrab===0)finais=0;
    return {f,setor,base,falta,atraso,adv,Z,desc,finais,recebeRepique:desc<=0, heMin:bancoFunc(f.id).pagar};
  });
  const somaZ={},somaDesc={},somaFinQ={}; S.setores.forEach(s=>{somaZ[s.nome]=0;somaDesc[s.nome]=0;somaFinQ[s.nome]=0;});
  rows.forEach(r=>{somaZ[r.setor]+=r.Z;somaDesc[r.setor]+=r.desc;if(r.recebeRepique)somaFinQ[r.setor]+=r.finais;});
  const rsPonto={},pool={},rsRep={};
  S.setores.forEach(s=>{const b=distribuida*(ratePct[s.nome]||0)/100; rsPonto[s.nome]=somaZ[s.nome]>0?b/somaZ[s.nome]:0; pool[s.nome]=somaDesc[s.nome]*rsPonto[s.nome]; rsRep[s.nome]=somaFinQ[s.nome]>0?pool[s.nome]/somaFinQ[s.nome]:0;});
  const tipo=p.tipo_pagamento||'oficial';
  const adiantPct=Number(cfg.adiantamento_pct)||40;
  const dentroPct=Number(cfg.holerite_dentro_pct)/100, foraPct=Number(cfg.holerite_fora_pct)/100;
  const horasMes=Number(cfg.horas_mes_base)||220;
  rows.forEach(r=>{
    r.comissao=r.finais*rsPonto[r.setor];
    r.repique=r.recebeRepique?r.finais*rsRep[r.setor]:0;
    r.ranking=bonusByFunc[r.f.id]||0;
    r.comTotal=r.comissao+r.repique+r.ranking;                 // comissão DO PERÍODO
    const valorHora=horasMes>0?Number(r.f.salario)/horasMes:0;
    r.hePagar=(r.heMin/60)*valorHora*(1+Number(cfg.adicional_he_pct||0)/100);
    r.salario=Number(r.f.salario); r.benef=Number(r.f.beneficios||0);
    r.minComp=0; r.adiantSalario=0; r.adiantSalPago=0; r.adiantComPago=0;
    r.comissaoTotal=r.comTotal;

    if(tipo==='adiantamento'){
      r.adiantSalario=r.salario*adiantPct/100;
      r.holerite=r.adiantSalario+r.benef+r.hePagar;            // holerite dia 20 (sem comissão)
      r.totalPagar=r.adiantSalario+r.comTotal+r.benef+r.hePagar; // pago de fato no dia 20
    } else if(tipo==='oficial'){
      const ant=S.adiantAnt[r.f.id]||{salario:0,comissao:0};
      r.adiantSalPago=ant.salario; r.adiantComPago=ant.comissao;
      r.comissaoOficial=r.comTotal;
      r.comissaoTotal=r.comissaoOficial+r.adiantComPago;        // total das duas quinzenas
      r.minComp=Math.max(0,Number(r.f.minimo_garantido||0)-(r.salario+r.comissaoTotal)); // POR FORA
      r.proventos=r.salario+r.comissaoTotal+r.benef+r.hePagar;
      r.descontos=r.adiantSalPago+r.adiantComPago;
      r.holerite=r.proventos-r.descontos;                       // líquido do holerite
      r.totalPagar=r.holerite;
    } else if(tipo==='rescisao'){
      const diasTrab=Math.max(0,dias-r.falta);
      r.salarioProp=r.salario*Math.min(diasTrab,30)/30;         // saldo de salário (proporcional)
      r.diasTrab=diasTrab;
      r.holerite=r.salarioProp+r.comTotal+r.benef+r.hePagar;
      r.totalPagar=r.holerite;
    } else if(tipo==='decimo_terceiro_1' || tipo==='decimo_terceiro_2'){
      const anoRef=new Date(p.data_inicio+'T00:00:00').getFullYear();
      const meses=mesesTrabalhados(r.f.data_admissao, anoRef);
      r.meses13=meses; r.base13=r.salario*meses/12; const primeira=r.base13*0.5;
      r.comTotal=0; r.comissaoTotal=0;
      if(tipo==='decimo_terceiro_1'){ r.parcela13=1; r.inss13=0; r.irrf13=0; r.holerite=primeira; }
      else { r.parcela13=2; r.inss13=calcINSS(r.base13); r.irrf13=calcIRRF(r.base13-r.inss13); r.holerite=primeira-r.inss13-r.irrf13; }
      r.totalPagar=r.holerite;
    } else { // outro: folha cheia
      r.minComp=Math.max(0,Number(r.f.minimo_garantido||0)-(r.salario+r.comTotal));
      r.holerite=r.salario+r.comTotal+r.benef+r.hePagar;
      r.totalPagar=r.holerite;
    }
    r.comDentro=r.comissaoTotal*dentroPct;                      // vai pro holerite
    r.comFora=r.comissaoTotal*foraPct;                          // interno
  });
  let outRows=rows;
  if(tipo==='rescisao' && p.funcionario_id) outRows=rows.filter(r=>r.f.id===p.funcionario_id);
  return {tipo, dias,taxaTotal,retencao,retPct,extrasTotal,extrasDesc,distribuida,rows:outRows,rsPonto,
    bucketRanking:distribuida*rankingPct/100,
    totalComissao:outRows.reduce((a,r)=>a+r.comTotal,0),
    totalPagar:outRows.reduce((a,r)=>a+(r.totalPagar||0),0),
    totalHolerite:outRows.reduce((a,r)=>a+(r.holerite||0),0)};
}

const TIPO_PAG={oficial:'Oficial', adiantamento:'Adiantamento', outro:'Outro', rescisao:'Rescisão', decimo_terceiro_1:'13º 1ª parcela', decimo_terceiro_2:'13º 2ª parcela'};
const TIPO_BADGE={oficial:'bg-blue-100 text-blue-700', adiantamento:'bg-amber-100 text-amber-700', outro:'bg-slate-200 text-slate-700', rescisao:'bg-rose-100 text-rose-700', decimo_terceiro_1:'bg-emerald-100 text-emerald-700', decimo_terceiro_2:'bg-emerald-100 text-emerald-700'};
let anoSel=new Date().getFullYear();
function seletorPeriodo(){
  const p=S.periodoAtual, hoje=new Date();
  const tipoV=p?p.tipo_pagamento:'oficial';
  const ini=p?p.data_inicio:`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-10`;
  const fim=p?p.data_fim:ini;
  const opt=(v,l)=>`<option value="${v}" ${v===tipoV?'selected':''}>${l}</option>`;
  const tipoRes=tipoV==='rescisao';
  // acesso rápido: cada mês do ano × {Oficial, Adiantamento}, com as datas padrão
  const cy=new Date().getFullYear(); const anos=[...new Set([cy-1,cy,cy+1,...S.periodos.map(x=>x.ano),anoSel])].sort((a,b)=>a-b);
  const existe=(tp,m)=>{const d=datasPadraoMes(anoSel,m,tp); return S.periodos.some(x=>x.tipo_pagamento===tp&&x.data_inicio===d.ini&&x.data_fim===d.fim);};
  const mesOpts=[...Array(12)].map((_,i)=>{const m=i+1,nm=MESES_F[i];
      return `<option value="oficial|${m}">${nm} · Oficial${existe('oficial',m)?' ✓':''}</option><option value="adiantamento|${m}">${nm} · Adiantamento${existe('adiantamento',m)?' ✓':''}</option>`;}).join('');
  const quick=`<div class="flex items-center gap-2">
      <select onchange="anoSel=+this.value;render()" class="px-2 py-2 border border-slate-200 rounded text-sm">${anos.map(a=>`<option value="${a}" ${a===anoSel?'selected':''}>${a}</option>`).join('')}</select>
      <select onchange="abrirMes(this.value)" class="px-2 py-2 border border-slate-200 rounded text-sm max-w-[230px]">
        <option value="">Ir para o mês…</option>${mesOpts}
      </select>
    </div>`;
  const criar=podeEscrever('comissao')?`<div class="flex flex-wrap items-center gap-2">
      <span class="text-xs text-slate-500">Novo:</span>
      <select id="np_tipo" onchange="render()" class="px-2 py-2 border border-slate-200 rounded text-sm">${opt('oficial','Oficial')}${opt('adiantamento','Adiantamento')}${opt('decimo_terceiro_1','13º 1ª parcela')}${opt('decimo_terceiro_2','13º 2ª parcela')}${opt('rescisao','Rescisão')}${opt('outro','Outro')}</select>
      ${tipoRes?`<select id="np_func" class="px-2 py-2 border border-rose-300 bg-rose-50 rounded text-sm max-w-[180px]" title="funcionário da rescisão"><option value="">— funcionário —</option>${S.funcionarios.map(f=>`<option value="${f.id}" ${p&&p.funcionario_id===f.id?'selected':''}>${f.nome}</option>`).join('')}</select>`:''}
      <label class="text-xs text-slate-500">apuração</label>
      <input id="np_inicio" type="date" value="${ini}" class="px-2 py-2 border border-slate-200 rounded text-sm">
      <span class="text-slate-400 text-xs">a</span>
      <input id="np_fim" type="date" value="${fim}" class="px-2 py-2 border border-slate-200 rounded text-sm">
      <button onclick="criarPeriodo()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-1"><i data-feather="play" class="w-4 h-4"></i>Calcular</button>
    </div>`:'';
  return card(`<div class="p-4 flex flex-wrap items-center gap-3">
      <span class="text-sm font-semibold text-slate-700 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>Período</span>
      ${quick}<span class="text-slate-300 hidden md:inline">|</span>${criar}
    </div>`,'mb-4');
}

  const header = pageHeader('Cálculo da Comissão Quinzenal','Cascata da taxa, rateio por setor, repique e holerite — dados reais');

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        ${inp('Taxa de Serviço Total (R$)', c.taxaTotal, "salvarCampoPeriodo('taxa_servico_total',+this.value).then(()=>render())")}
        ${inp('Retenção da casa', c.retPct, "salvarCampoPeriodo('retencao_pct',+this.value).then(()=>render())",'%')}
        <div><label class="text-xs font-medium text-slate-500 block mb-1">Gasto com extras (R$)</label><div class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded text-sm text-right">${money(c.extrasDesc)}</div><p class="text-[10px] text-slate-400 mt-1">${num(S.config.desc_extras_pct,0)}% de ${money(c.extrasTotal)}</p></div>
        <div><label class="text-xs font-medium text-slate-500 block mb-1">Dias do período</label><div class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded text-sm text-right">${c.dias}</div></div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

        <div class="p-3 bg-blue-50 rounded"><p class="text-xs text-slate-500">Taxa Distribuída</p><p class="font-bold text-blue-700">${money(c.distribuida)}</p></div>
        <div class="p-3 bg-green-50 rounded"><p class="text-xs text-slate-500">Total em comissões</p><p class="font-bold text-green-700">${money(c.totalComissao)}</p></div>
      </div></div>`,'mb-4')
  + card(`<div class="p-6"><h3 class="font-bold mb-3 flex items-center gap-2"><i data-feather="hash" class="w-4 h-4 text-blue-600"></i>R$ por ponto, por setor</h3>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-7 gap-2 text-center text-sm">${S.setores.map(s=>`<div class="p-2 bg-slate-50 rounded"><p class="text-xs text-slate-500">${s.nome}</p><p class="font-bold text-slate-800">${money(c.rsPonto[s.nome])}</p></div>`).join('')}</div></div>`,'mb-4')
  + `<div class="flex justify-end gap-2 mb-3">
       <button onclick="exportComissaoCSV()" class="px-4 py-2 bg-green-600 text-white rounded text-sm font-medium hover:bg-green-700 flex items-center gap-2"><i data-feather="download" class="w-4 h-4"></i>Exportar CSV</button>
       ${podeEscrever('comissao')?`<button onclick="salvarResultadoComissao()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-2"><i data-feather="save" class="w-4 h-4"></i>Salvar fechamento</button>`:''}
     </div>`
  + tabelaComissao(c);
};
function tabelaComissao(c){
  const nome=r=>r.f.nome.split(' ').slice(0,2).join(' ');
  const pts=r=>`<td class="px-2 py-2 text-center">${num(r.base,2)}</td><td class="px-2 py-2 text-center">${num(r.Z,2)}</td>
    <td class="px-2 py-2 text-center ${r.desc>0?'text-red-600 font-semibold':'text-slate-300'}">${r.desc>0?'−'+num(r.desc,2):'—'}</td>
    <td class="px-2 py-2 text-center font-semibold">${num(r.finais,2)}</td>`;
  const headPts=`<th class="px-3 py-3 text-left">Funcionário</th><th class="px-2 py-3 text-left">Setor</th>
    <th class="px-2 py-3 text-center">Base</th><th class="px-2 py-3 text-center">Qual.</th><th class="px-2 py-3 text-center">Desc.</th><th class="px-2 py-3 text-center">Finais</th>`;
  const heCell=r=>`<td class="px-2 py-2 text-right ${r.hePagar>0?'text-red-600 font-semibold':'text-slate-300'}" title="${r.heMin?fmtMin(r.heMin)+' a pagar':''}">${r.hePagar>0?money(r.hePagar):'—'}</td>`;
  const wrap=(head,body,nota)=>card(`<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600 border-b border-slate-200"><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="p-3 text-[11px] text-slate-500 border-t border-slate-200">${nota}</div>`);

  if(c.tipo==='adiantamento'){
    const head=headPts+`<th class="px-2 py-3 text-right bg-amber-50">40% Salário</th><th class="px-2 py-3 text-right bg-green-50">Comissão</th><th class="px-2 py-3 text-right">Benef.</th><th class="px-2 py-3 text-right">HE (R$)</th><th class="px-3 py-3 text-right bg-blue-50">Pago no dia 20</th>`;
    const body=c.rows.map(r=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
      <td class="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">${nome(r)}</td><td class="px-2 py-2">${setorBadge(r.setor)}</td>${pts(r)}
      <td class="px-2 py-2 text-right font-semibold text-amber-700 bg-amber-50/40">${money(r.adiantSalario)}</td>
      <td class="px-2 py-2 text-right font-semibold text-green-700 bg-green-50/40">${money(r.comTotal)}</td>
      <td class="px-2 py-2 text-right ${r.benef?'':'text-slate-300'}">${r.benef?money(r.benef):'—'}</td>${heCell(r)}
      <td class="px-3 py-2 text-right font-bold text-blue-700 bg-blue-50/50">${money(r.totalPagar)}</td></tr>`).join('')
      +`<tr class="bg-slate-50 font-bold"><td class="px-3 py-2" colspan="6">TOTAIS</td><td class="px-2 py-2 text-right text-amber-700">${money(c.rows.reduce((a,r)=>a+r.adiantSalario,0))}</td><td class="px-2 py-2 text-right text-green-700">${money(c.totalComissao)}</td><td colspan="2"></td><td class="px-3 py-2 text-right text-blue-700">${money(c.totalPagar)}</td></tr>`;
    return wrap(head,body,`<strong>Holerite do dia 20</strong> mostra 40% do salário + benefícios + HE (a comissão NÃO aparece no holerite do adiantamento — ela é exibida no oficial). A comissão e os 40% ficam guardados para o oficial deduzir.`);
  }
  if(c.tipo==='oficial'){
    const head=headPts+`<th class="px-2 py-3 text-right">Com. período</th><th class="px-2 py-3 text-right">Com. adiant.</th><th class="px-2 py-3 text-right bg-blue-50">Comissão TOTAL</th>
      <th class="px-2 py-3 text-right">Salário</th><th class="px-2 py-3 text-right">Benef.</th><th class="px-2 py-3 text-right">HE</th>
      <th class="px-2 py-3 text-right bg-amber-50">− Adiant. salário</th><th class="px-2 py-3 text-right bg-amber-50">− Adiant. comissão</th>
      <th class="px-3 py-3 text-right bg-green-100">HOLERITE</th>
      <th class="px-2 py-3 text-right">Mín.Gar.(fora)</th><th class="px-2 py-3 text-right bg-indigo-50">Com.Dentro</th><th class="px-2 py-3 text-right bg-indigo-50">Com.Fora</th>`;
    const body=c.rows.map(r=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
      <td class="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">${nome(r)}</td><td class="px-2 py-2">${setorBadge(r.setor)}</td>${pts(r)}
      <td class="px-2 py-2 text-right">${money(r.comissaoOficial)}</td>
      <td class="px-2 py-2 text-right ${r.adiantComPago>0?'text-slate-600':'text-slate-300'}">${r.adiantComPago>0?money(r.adiantComPago):'—'}</td>
      <td class="px-2 py-2 text-right font-bold text-blue-700 bg-blue-50/50">${money(r.comissaoTotal)}</td>
      <td class="px-2 py-2 text-right text-slate-600">${money(r.salario)}</td>
      <td class="px-2 py-2 text-right ${r.benef?'':'text-slate-300'}">${r.benef?money(r.benef):'—'}</td>${heCell(r)}
      <td class="px-2 py-2 text-right ${r.adiantSalPago>0?'text-amber-700 bg-amber-50/40':'text-slate-300'}">${r.adiantSalPago>0?'−'+money(r.adiantSalPago):'—'}</td>
      <td class="px-2 py-2 text-right ${r.adiantComPago>0?'text-amber-700 bg-amber-50/40':'text-slate-300'}">${r.adiantComPago>0?'−'+money(r.adiantComPago):'—'}</td>
      <td class="px-3 py-2 text-right font-bold text-green-800 bg-green-100/60">${money(r.holerite)}</td>
      <td class="px-2 py-2 text-right ${r.minComp>0?'text-rose-600 font-semibold':'text-slate-300'}" title="diferença paga por fora">${r.minComp>0?'+'+money(r.minComp):'—'}</td>
      <td class="px-2 py-2 text-right text-indigo-700 bg-indigo-50/40">${money(r.comDentro)}</td>
      <td class="px-2 py-2 text-right text-indigo-700 bg-indigo-50/40">${money(r.comFora)}</td></tr>`).join('');
    return wrap(head,body,`<strong>HOLERITE</strong> = salário total + comissão total + benefícios + HE − (adiant. salário + adiant. comissão). <strong>Comissão total</strong> = período + adiantamento. <strong>Mín.Gar.</strong> = diferença paga <em>por fora</em> (não entra no holerite), comparando salário+comissão com o acordado. ${S.adiantAntPeriodo?'':'<span class="text-amber-600">⚠ Nenhum adiantamento anterior salvo — descontos zerados.</span>'}`);
  }
  if(c.tipo==='rescisao'){
    if(!c.rows.length) return card(`<div class="p-12 text-center text-slate-400"><i data-feather="user-x" class="w-10 h-10 mx-auto mb-3"></i><p class="text-sm">Escolha o funcionário da rescisão no seletor acima e clique em Calcular.</p></div>`);
    const head=headPts+`<th class="px-2 py-3 text-center">Dias trab.</th><th class="px-2 py-3 text-right bg-rose-50">Salário proporc.</th><th class="px-2 py-3 text-right bg-blue-50">Comissão</th><th class="px-2 py-3 text-right">Benef.</th><th class="px-2 py-3 text-right">HE</th><th class="px-3 py-3 text-right bg-green-100">TOTAL RESCISÃO</th>`;
    const body=c.rows.map(r=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
      <td class="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">${nome(r)}</td><td class="px-2 py-2">${setorBadge(r.setor)}</td>${pts(r)}
      <td class="px-2 py-2 text-center">${r.diasTrab}</td>
      <td class="px-2 py-2 text-right font-semibold text-rose-700 bg-rose-50/40">${money(r.salarioProp)}</td>
      <td class="px-2 py-2 text-right font-bold text-blue-700 bg-blue-50/50">${money(r.comTotal)}</td>
      <td class="px-2 py-2 text-right ${r.benef?'':'text-slate-300'}">${r.benef?money(r.benef):'—'}</td>${heCell(r)}
      <td class="px-3 py-2 text-right font-bold text-green-800 bg-green-100/60">${money(r.holerite)}</td></tr>`).join('');
    return wrap(head,body,`<strong>Rescisão</strong> = saldo de salário (proporcional: salário × dias trabalhados ÷ 30) + comissão do período + benefícios + HE. Verbas legais (férias, aviso, FGTS) ficam para depois. Ao salvar, o funcionário é marcado como <strong>inativo</strong>.`);
  }
  if(c.tipo==='decimo_terceiro_1'||c.tipo==='decimo_terceiro_2'){
    const seg=c.tipo==='decimo_terceiro_2';

    const body=c.rows.map(r=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
      <td class="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">${nome(r)}</td>
      <td class="px-2 py-2 text-center">${r.meses13}/12</td>
      <td class="px-2 py-2 text-right text-slate-600">${money(r.salario)}</td>
      <td class="px-2 py-2 text-right">${money(r.base13)}</td>
      <td class="px-2 py-2 text-right bg-emerald-50/40">${money(r.base13*0.5)}</td>
      ${seg?`<td class="px-2 py-2 text-right text-red-600">${r.inss13>0?'−'+money(r.inss13):'—'}</td><td class="px-2 py-2 text-right text-red-600">${r.irrf13>0?'−'+money(r.irrf13):'—'}</td>`:''}
      <td class="px-3 py-2 text-right font-bold text-green-800 bg-green-100/60">${money(r.holerite)}</td></tr>`).join('')
      +`<tr class="bg-slate-50 font-bold"><td class="px-3 py-2" colspan="${seg?6:4}">TOTAL</td><td class="px-3 py-2 text-right text-green-700">${money(c.totalPagar)}</td></tr>`;
    return wrap(head,body,`<strong>13º salário</strong> (só salário, sem comissão). Base = salário × meses trabalhados no ano ÷ 12 (admissão; mês com 15+ dias conta cheio). ${seg?'2ª parcela = 50% da base − INSS − IRRF.':'1ª parcela = 50% da base (sem descontos).'}`);
  }
  // outro: folha cheia
  const head=headPts+`<th class="px-2 py-3 text-right bg-blue-50">Comissão</th><th class="px-2 py-3 text-right">Salário</th><th class="px-2 py-3 text-right">Benef.</th><th class="px-2 py-3 text-right">HE</th><th class="px-2 py-3 text-right">Mín.Gar.(fora)</th><th class="px-3 py-3 text-right bg-green-50">TOTAL</th>`;
  const body=c.rows.map(r=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
    <td class="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">${nome(r)}</td><td class="px-2 py-2">${setorBadge(r.setor)}</td>${pts(r)}
    <td class="px-2 py-2 text-right font-bold text-blue-700 bg-blue-50/50">${money(r.comTotal)}</td>
    <td class="px-2 py-2 text-right text-slate-600">${money(r.salario)}</td>
    <td class="px-2 py-2 text-right ${r.benef?'':'text-slate-300'}">${r.benef?money(r.benef):'—'}</td>${heCell(r)}
    <td class="px-2 py-2 text-right ${r.minComp>0?'text-rose-600 font-semibold':'text-slate-300'}">${r.minComp>0?'+'+money(r.minComp):'—'}</td>
    <td class="px-3 py-2 text-right font-bold text-green-700 bg-green-50/50">${money(r.holerite)}</td></tr>`).join('');
  return wrap(head,body,`Tipo "Outro": folha cheia (salário + comissão + benefícios + HE), sem dedução de adiantamento.`);
}

window.exportComissaoCSV = function(){
  const c=calcComissao(); if(!c) return; const sep=';';
  const head=['Funcionário','Setor','Tipo','Base','Qualif.','Desc.','Finais','Comissão período','Comissão adiant.','Comissão TOTAL','40% Salário','Salário','Benefícios','HE','Adiant. salário pago','Adiant. comissão pago','HOLERITE','Mínimo (por fora)','Com.Dentro','Com.Fora'];
  const br=v=>typeof v==='number'?v.toFixed(2).replace('.',','):'"'+String(v).replace(/"/g,'""')+'"';
  const linhas=c.rows.map(r=>[r.f.nome,r.setor,TIPO_PAG[c.tipo]||c.tipo,r.base,r.Z,r.desc,r.finais,r.comTotal,r.adiantComPago||0,r.comissaoTotal,r.adiantSalario||0,r.salario,r.benef,r.hePagar,r.adiantSalPago||0,r.adiantComPago||0,r.holerite,r.minComp,r.comDentro,r.comFora].map(br).join(sep));
  const csv='﻿'+[head.join(sep),...linhas].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='comissao-'+(c.tipo||'periodo')+'-'+(S.periodoAtual?.data_inicio||'')+'.csv'; a.click(); URL.revokeObjectURL(a.href);
};

window.salvarResultadoComissao = async function(){
  const c=calcComissao(); const p=S.periodoAtual; if(!c||!p) return;
  await sb.from('comissao_resultado').delete().eq('periodo_id',p.id);
  const recs=c.rows.map(r=>({ funcionario_id:r.f.id, periodo_id:p.id, setor:r.setor,
    pontos_base:r.base, pontos_qualificados:r.Z, pontos_descontados:r.desc, pontos_finais:r.finais,
    comissao:r.comissao, repique:r.repique, ranking_bonus:r.ranking, comissao_total:r.comTotal,
    salario:r.salario, beneficios:r.benef, minimo_complemento:r.minComp, total:r.totalPagar,
    pago_dentro:r.comDentro, pago_fora:r.comFora, he_pagar_minutos:r.heMin||0, he_pagar_valor:r.hePagar||0,
    adiant_salario:r.adiantSalario||0, adiant_anterior:(r.adiantSalPago||0)+(r.adiantComPago||0), tipo_pagamento:c.tipo }));
  const { error }=await sb.from('comissao_resultado').insert(recs);
  if(error){ alert('Erro ao salvar: '+error.message); return; }
  await sb.from('pagamentos').delete().eq('periodo_id',p.id);
  await sb.from('pagamentos').insert({ restaurante_id:S.restaurante.id, periodo_id:p.id, ciclo:TIPO_PAG[c.tipo]||c.tipo,
    data_pagamento:p.data_pagamento, apuracao:`${fmtDM(new Date(p.data_inicio+'T00:00:00'))}–${fmtDM(new Date(p.data_fim+'T00:00:00'))}`,
    colaboradores:c.rows.length, total_comissao:c.totalComissao, total_folha:c.totalPagar, status:'Previsto' });
  // Rescisão: marca o funcionário como inativo (desligado)
  if(c.tipo==='rescisao' && p.funcionario_id){
    if(confirm('Marcar o funcionário como DESLIGADO (inativo)?')){
      await sb.from('funcionarios').update({ativo:false, status:'Processo de Desligamento'}).eq('id',p.funcionario_id);
      await carregarDados();
    }
  }
  alert('Fechamento ('+(TIPO_PAG[c.tipo]||c.tipo)+') salvo: '+c.rows.length+' colaborador(es) · a pagar '+money(c.totalPagar));
  render();
};

<script>
/* ===================== FOLHA DE PONTO (grade editável, grava no banco) ===================== */
const ST_PONTO=['Normal','Falta','Atraso','Dobra','Folga','Advertência','Atestado','Extra','Férias','Afastamento'];
const ST_AB={'Normal':['N','text-green-700'],'Falta':['F','bg-red-100 text-red-700 font-bold'],'Atraso':['A','bg-orange-100 text-orange-700 font-bold'],'Dobra':['D','bg-purple-100 text-purple-700 font-bold'],'Folga':['Fg','text-slate-400'],'Advertência':['Ad','bg-rose-100 text-rose-700 font-bold'],'Atestado':['At','bg-amber-100 text-amber-700'],'Extra':['E','bg-blue-100 text-blue-700 font-bold'],'Férias':['Fé','bg-teal-100 text-teal-700'],'Afastamento':['Af','bg-slate-200 text-slate-600']};
const DOW1=['D','S','T','Q','Q','S','S'];
function diasDoPeriodo(p){ const out=[]; let d=new Date(p.data_inicio+'T00:00:00'); const fim=new Date(p.data_fim+'T00:00:00'); let g=0; while(d<=fim && g<40){ out.push(new Date(d)); d.setDate(d.getDate()+1); g++; } return out; }
function statusDe(funcId, ds){ const r=S.ponto.find(p=>p.funcionario_id===funcId && p.data===ds); return r?r.status:'Normal'; }
function fmtMin(min){ const s=min<0?'-':'+'; const a=Math.abs(Math.round(min)); return `${s}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`; }
function bancoFunc(funcId){
  const limMin=(Number(S.config?.limite_he_dia_horas)||2)*60; let banco=0,pagar=0;
  S.ponto.filter(p=>p.funcionario_id===funcId).forEach(p=>{ const min=Number(p.banco_minutos)||0;
    if(min>limMin){ pagar+=min; } else { banco+=min; } });
  return { banco, pagar };
}
window.salvarLimiteHE = async function(v){ const val=+v||0; await sb.from('config_remuneracao').update({limite_he_dia_horas:val}).eq('id',S.config.id); S.config.limite_he_dia_horas=val; render(); };

let pontoRange=null, pontoEdit=null;
function diasRange(ini,fim){ const out=[]; let d=new Date(ini+'T00:00:00'); const f=new Date(fim+'T00:00:00'); let g=0; while(d<=f&&g<62){out.push(new Date(d));d.setDate(d.getDate()+1);g++;} return out; }
function periodoDaData(ds){ const ps=S.periodos.filter(p=>['oficial','adiantamento'].includes(p.tipo_pagamento)&&ds>=p.data_inicio&&ds<=p.data_fim).sort((a,b)=>a.tipo_pagamento.localeCompare(b.tipo_pagamento)); return ps[0]?ps[0].id:null; }
function pgRow(funcId,ds){ return S.pontoGrid.find(p=>p.funcionario_id===funcId&&p.data===ds)||null; }
function bancoGrid(funcId){ const lim=(Number(S.config?.limite_he_dia_horas)||2)*60; let banco=0,pagar=0; S.pontoGrid.filter(p=>p.funcionario_id===funcId).forEach(p=>{const min=Number(p.banco_minutos)||0; if(min>lim)pagar+=min; else banco+=min;}); return {banco,pagar}; }
async function carregarPontoGrid(){ if(!pontoRange){S.pontoGrid=[];return;} const {data}=await sb.from('controle_ponto').select('*').gte('data',pontoRange.ini).lte('data',pontoRange.fim); S.pontoGrid=data||[]; }
window.setPontoRange=async function(){ const ini=val('pr_ini'),fim=val('pr_fim'); if(!ini||!fim||fim<ini){alert('Datas inválidas.');return;} pontoRange={ini,fim}; await carregarPontoGrid(); render(); };

window._viewPonto = function(){
  const header=pageHeader('Folha de Ponto','Controle de ponto por intervalo de datas — importação, edição e banco de horas');
  if(!pontoRange){ const h=new Date(); pontoRange={ini:`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-01`, fim:ymdStr(new Date(h.getFullYear(),h.getMonth()+1,0))}; }
  const dias=diasRange(pontoRange.ini,pontoRange.fim);
  const limite=Number(S.config.limite_he_dia_horas)||2;
  const rangeBar=card(`<div class="p-4 flex flex-wrap items-center gap-3">
      <span class="text-sm font-semibold text-slate-700 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>Ver intervalo</span>
      <input id="pr_ini" type="date" value="${pontoRange.ini}" class="px-2 py-2 border border-slate-200 rounded text-sm">
      <span class="text-slate-400 text-xs">a</span>
      <input id="pr_fim" type="date" value="${pontoRange.fim}" class="px-2 py-2 border border-slate-200 rounded text-sm">
      <button onclick="setPontoRange()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-1"><i data-feather="search" class="w-4 h-4"></i>Ver</button>
      <span class="text-slate-300 hidden sm:inline">|</span>
      <input class="pl-3 pr-2 py-2 border border-slate-200 rounded text-sm w-44" placeholder="filtrar nome…" oninput="filtrarPonto(this.value)">
    </div>`,'mb-4');
  const head=`<tr><th class="px-3 py-2 text-left sticky left-0 bg-slate-50 z-10">Funcionário</th>${
      dias.map(d=>`<th class="px-1 py-2 text-[10px] font-medium ${[0,6].includes(d.getDay())?'text-blue-500':'text-slate-500'}">${String(d.getDate()).padStart(2,'0')}<br>${DOW1[d.getDay()]}</th>`).join('')
    }<th class="px-2 py-2 bg-slate-100">Falt</th><th class="px-2 py-2 bg-slate-100">Atr</th><th class="px-2 py-2 bg-slate-100">Banco</th><th class="px-2 py-2 bg-slate-100">HE pagar</th></tr>`;
  const body=S.funcionarios.map(f=>{ let fal=0,atr=0;
    const cells=dias.map(d=>{ const ds=ymdStr(d); const r=pgRow(f.id,ds); const st=r?r.status:'Normal'; if(st==='Falta')fal++; if(st==='Atraso')atr++;
      const [ab,cl]=ST_AB[st]||['?','']; const tip=r?`${r.entrada_1||''}${r.saida_1?'-'+r.saida_1:''} ${r.horas_trabalhadas?Number(r.horas_trabalhadas).toFixed(1)+'h':''}`.trim():'';
      return `<td class="text-center p-0"><button onclick="editarDia(${f.id},'${ds}')" class="w-7 h-6 text-[11px] rounded ${cl} hover:ring-2 hover:ring-blue-300" title="${(tip||st)} — clique p/ editar">${ab}</button></td>`;
    }).join('');
    const b=bancoGrid(f.id);
    return `<tr class="border-b border-slate-100 hover:bg-blue-50/30 pntrow" data-n="${(f.nome||'').toLowerCase()}"><td class="px-3 py-1.5 font-medium text-slate-800 sticky left-0 bg-white whitespace-nowrap">${f.nome.split(' ').slice(0,2).join(' ')}</td>${cells}
      <td class="text-center bg-slate-50 font-semibold ${fal?'text-red-600':'text-slate-300'}">${fal||'0'}</td>
      <td class="text-center bg-slate-50 font-semibold ${atr?'text-orange-600':'text-slate-300'}">${atr||'0'}</td>
      <td class="text-center bg-slate-50 font-semibold ${b.banco?(b.banco>=0?'text-green-600':'text-red-600'):'text-slate-300'}">${b.banco?fmtMin(b.banco):'—'}</td>
      <td class="text-center bg-slate-50 font-bold ${b.pagar>0?'text-red-600':'text-slate-300'}">${b.pagar>0?fmtMin(b.pagar):'—'}</td></tr>`;
  }).join('');
  return header + rangeBar
  + `<div class="mb-3 flex items-center gap-2 text-sm text-slate-600"><i data-feather="clock" class="w-4 h-4 text-blue-600"></i>HE: acima de <input type="number" step="0.5" min="0" value="${limite}" onchange="salvarLimiteHE(this.value)" class="w-16 px-2 py-1 border border-slate-200 rounded text-right">h/dia → <span class="badge bg-red-100 text-red-700">pagar</span>; até o limite → <span class="badge bg-green-100 text-green-700">banco</span>.</div>`
  + `<div class="p-4 mb-4 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3"><i data-feather="upload-cloud" class="w-5 h-5 text-blue-600"></i>
        <div><p class="text-sm font-medium text-slate-900">Importar Cartão de Ponto (Secullum PDF mensal · várias folhas)</p><p class="text-xs text-slate-600">Lê todas as páginas, casa cada funcionário pelo nome e atualiza o ponto. Você revisa antes.</p></div></div>
      <label class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 cursor-pointer flex items-center gap-2"><i data-feather="upload-cloud" class="w-4 h-4"></i>Selecionar PDF<input type="file" accept="application/pdf" class="hidden" onchange="onSecullumFile(this)"></label>
    </div>`
  + (pontoImport ? viewImportPreview() : '')
  + card(`<div class="overflow-x-auto"><table class="w-full text-xs" style="border-collapse:collapse"><thead class="bg-slate-50 text-slate-600">${head}</thead><tbody>${body}</tbody></table></div>
      <div class="p-3 text-[11px] text-slate-500 border-t border-slate-200">Clique numa célula para <strong>editar o dia</strong> (status, entrada/saída, horas, banco). ${Object.entries(ST_AB).map(([k,[ab,cl]])=>`<span class="inline-block px-1 rounded ${cl}">${ab}</span>=${k}`).join(' · ')}.</div>`)
  + (pontoEdit ? viewPontoEditor() : '');
};
window.filtrarPonto=function(q){ q=(q||'').toLowerCase(); document.querySelectorAll('.pntrow').forEach(r=>{r.style.display=r.dataset.n.includes(q)?'':'none';}); };
window.editarDia=function(funcId, ds){ const r=pgRow(funcId,ds); pontoEdit={funcId, ds, id:r?r.id:null, status:r?r.status:'Normal', ent:r?(r.entrada_1||''):'', sai:r?(r.saida_1||''):'', horas:r?(r.horas_trabalhadas||0):0, banco:r?(r.banco_minutos||0):0}; render(); };
window.fecharEditorDia=function(){ pontoEdit=null; render(); };
function viewPontoEditor(){
  const e=pontoEdit, f=S.funcionarios.find(x=>x.id===e.funcId);

    <div class="bg-white rounded-xl shadow-xl w-full max-w-md">

        <div><label class="text-xs text-slate-500 block mb-1">Entrada</label><input id="ed_ent" type="time" value="${e.ent}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Saída</label><input id="ed_sai" type="time" value="${e.sai}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Horas trabalhadas</label><input id="ed_horas" type="number" step="0.01" value="${e.horas}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm"></div>

window.salvarDia=async function(){
  const e=pontoEdit, v=id=>(document.getElementById(id)||{}).value;

};

<script>
/* ===================== EXTRAS (calendário + aprovação, grava no banco) ===================== */
const MESES_F=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
let extrasMes={ano:new Date().getFullYear(), mes:new Date().getMonth()+1};
function extrasDoDia(ds){ return S.extras.filter(e=>e.data===ds); }
async function reloadExtras(){ const {data}=await sb.from('extras').select('*, setores(nome)').eq('restaurante_id',S.restaurante.id).order('data'); S.extras=data||[]; }
window.mudarMesExtras=function(delta){ let m=extrasMes.mes+delta,a=extrasMes.ano; if(m<1){m=12;a--;} if(m>12){m=1;a++;} extrasMes={ano:a,mes:m}; render(); };
window.addExtra=async function(){
  const ds=val('ex_data'); if(!ds){ alert('Informe a data.'); return; }
  const per=S.periodos.find(p=> ds>=p.data_inicio && ds<=p.data_fim);
  const rec={ restaurante_id:S.restaurante.id, periodo_id:per?per.id:null, data:ds, setor_id:+val('ex_setor')||null,
    funcao:val('ex_funcao')||'Extra', quantidade:+val('ex_qtd')||1, diaria:+val('ex_diaria')||0, lider:val('ex_lider')||'', status:'Aprovado' };
  const { error }=await sb.from('extras').insert(rec); if(error){ alert('Erro: '+error.message); return; }
  const d=new Date(ds+'T00:00:00'); extrasMes={ano:d.getFullYear(), mes:d.getMonth()+1};
  await reloadExtras(); render();
};
window.setExtraStatus=async function(id,status){ await sb.from('extras').update({status}).eq('id',id); await reloadExtras(); render(); };
window.excluirExtra=async function(id){ if(!confirm('Excluir este extra?'))return; await sb.from('extras').delete().eq('id',id); await reloadExtras(); render(); };

window._viewExtras=function(){

  const doMes=S.extras.filter(e=>e.data.startsWith(pref));

        <td class="px-2 py-1.5 font-medium">${e.data.slice(8,10)}/${e.data.slice(5,7)}</td><td class="px-2 py-1.5">${setorBadge(e.setores?.nome)}</td><td class="px-2 py-1.5 text-slate-600">${e.funcao}</td>
        <td class="px-2 py-1.5 text-center font-semibold">${e.quantidade}</td><td class="px-2 py-1.5 text-right text-slate-500">${money(e.diaria)}</td><td class="px-2 py-1.5 text-right font-semibold">${money(e.quantidade*Number(e.diaria))}</td><td class="px-2 py-1.5 text-slate-600">${e.lider||'—'}</td>
        <td class="px-2 py-1.5 text-center">${e.status==='Aprovado'?'<span class="badge bg-green-100 text-green-700">Aprovado</span>':`<button onclick="setExtraStatus(${e.id},'Aprovado')" class="badge bg-amber-100 text-amber-700 hover:bg-amber-200">Aprovar ✓</button>`}</td>
        <td class="px-2 py-1.5 text-center"><button onclick="excluirExtra(${e.id})" class="text-red-400 hover:text-red-600"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button></td>

  return pageHeader('Extras','Calendário de extras contratados — aprovados pelos líderes')

    + `<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4"><div class="col-span-2">${calendar}</div><div>${form}</div></div>` + lista;
};

  else { const ex=S.rankingPeriodo.find(r=>r.colocacao===coloc);

};

};

<script>
/* ===================== IMPORTAÇÃO CARTÃO SECULLUM (PDF via pdf.js) ===================== */
let pontoImport=null;   // {funcId, funcNomePDF, dias:[...], periodoTxt}
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function _tomin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function extrairLinhasPDF(tc){
  const ln={};
  tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (ln[y]=ln[y]||[]).push(it); });
  return Object.keys(ln).map(Number).sort((a,b)=>b-a)
    .map(y=> ln[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str).join(' ').replace(/\s+/g,' ').trim())
    .filter(Boolean).join('\n');
}
function parseSecullum(text){
  const linhas=text.split('\n'); const dias=[]; let periodoTxt='';
  linhas.forEach(l=>{
    const mp=l.match(/Per[ií]odo:\s*(\d{2}\/\d{2}\/\d{4}).*?(\d{2}\/\d{2}\/\d{4})/i); if(mp) periodoTxt=mp[1]+' a '+mp[2];
    const dm=l.match(/(\d{2})\/(\d{2})\/(\d{4})\s*-\s*(\S{3,4})\s+(.*)/);
    if(!dm) return;
    const dd=dm[1],mm=dm[2],yy=dm[3],wd=dm[4],rest=dm[5];
    let full=null; const r=rest.trim();
    if(/^Folga/i.test(r))full='Folga'; else if(/^Atestad/i.test(r))full='Atestado';
    else if(/^F[ée]ria/i.test(r))full='Férias'; else if(/^Afasta/i.test(r))full='Afastamento'; else if(/^Falta/i.test(r))full='Falta';
    const toks=(rest.match(/\d{2}:\d{2}/g)||[]); const punches=toks.slice(0,4);
    const saldos=(rest.match(/[+\-]\d{2}:\d{2}/g)||[]);
    let horas=0; for(let i=0;i+1<punches.length;i+=2){ let a=_tomin(punches[i]),b=_tomin(punches[i+1]); if(b<a)b+=1440; horas+=b-a; }
    const status = full || (punches.length?'Normal':'Falta');
    const turno = punches.length ? (_tomin(punches[0])<720?'Almoço':(_tomin(punches[0])>=840?'Jantar':'Misto')) : '';
    const sld = saldos.length?saldos[saldos.length-1]:'';
    const banco = sld ? (sld[0]==='-'?-1:1)*_tomin(sld.replace(/[+\-]/,'')) : 0;
    dias.push({ data:`${yy}-${mm}-${dd}`, dataBR:`${dd}/${mm}`, wd, status,
      ent:punches[0]||'', sai:punches.length>=2?punches[punches.length-1]:'', horas:+(horas/60).toFixed(2), turno, banco, sld });
  });
  return { dias, periodoTxt };
}
function normNome(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim(); }
function matchFuncPagina(pageText){ const up=normNome(pageText); return S.funcionarios.find(f=>{const d=normNome(f.nome); return d.length>=8 && up.includes(d.slice(0,18)); })||null; }
function nomeDaPagina(text){ const ls=text.split('\n'); for(let i=0;i<ls.length;i++){ if(/NOME:/i.test(ls[i])){ const nl=ls[i+1]||''; const m=nl.match(/([A-Za-zÀ-ÿ ]{6,}?)\s+\S*\d/); if(m) return m[1].trim(); return nl.slice(0,30).trim(); } } return ''; }
window.onSecullumFile = async function(input){
  const file=input.files&&input.files[0]; if(!file) return; input.value='';
  if(!window.pdfjsLib){ alert('Biblioteca de PDF não carregou. Recarregue a página e tente de novo.'); return; }
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    const funcs=[]; let periodoTxt='';
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const text=extrairLinhasPDF(await pg.getTextContent());
      const parsed=parseSecullum(text); if(!parsed.dias.length) continue; if(parsed.periodoTxt) periodoTxt=parsed.periodoTxt;
      const f=matchFuncPagina(text);
      funcs.push({ pagina:i, nomePDF:(f?f.nome:(nomeDaPagina(text)||('Página '+i))), funcId:f?f.id:null, dias:parsed.dias });
    }
    if(!funcs.length){ alert('Não identifiquei folhas de ponto no PDF.'); return; }
    pontoImport={ periodoTxt, funcs }; current='ponto'; render();
  }catch(e){ alert('Erro ao ler o PDF: '+(e.message||e)); }
};
window.cancelarImport=function(){ pontoImport=null; render(); };
window.setImportFuncRow=function(i,id){ pontoImport.funcs[i].funcId=+id||null; render(); };

function viewImportPreview(){
  const imp=pontoImport; const casados=imp.funcs.filter(x=>x.funcId).length;
  return card(`<div class="p-5 mb-4 border-2 border-blue-200">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="file-text" class="w-4 h-4 text-blue-600"></i>Prévia da importação — ${imp.funcs.length} folhas ${imp.periodoTxt?`<span class="font-normal text-slate-400 text-sm">(${imp.periodoTxt})</span>`:''}</h3>
        <button onclick="cancelarImport()" class="text-slate-400 hover:text-slate-700"><i data-feather="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-sm mb-3"><span class="badge bg-green-100 text-green-700">${casados} casados</span> ${imp.funcs.length-casados>0?`<span class="badge bg-amber-100 text-amber-700">${imp.funcs.length-casados} não identificados</span>`:''} <span class="text-slate-400 text-xs ml-2">Cada dia será gravado no período correto pela data. Só funcionários casados são aplicados.</span></p>
      <div class="overflow-x-auto max-h-80 overflow-y-auto border border-slate-100 rounded"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600 sticky top-0"><tr><th class="px-2 py-1.5 text-left">Folha (nome no PDF)</th><th class="px-2 py-1.5 text-left">Funcionário no sistema</th><th class="px-2 py-1.5 text-center">Dias</th><th class="px-2 py-1.5 text-center">Faltas</th><th class="px-2 py-1.5 text-right">Banco</th></tr></thead><tbody>
        ${imp.funcs.map((x,i)=>{ const fal=x.dias.filter(d=>d.status==='Falta').length; const banco=x.dias.reduce((a,d)=>a+d.banco,0);
          return `<tr class="border-b border-slate-100 ${x.funcId?'':'bg-amber-50/50'}">
            <td class="px-2 py-1 text-slate-600">${x.nomePDF}</td>
            <td class="px-2 py-1"><select onchange="setImportFuncRow(${i},this.value)" class="px-2 py-1 border ${x.funcId?'border-slate-200':'border-amber-300 bg-amber-50'} rounded text-xs w-56"><option value="">— não importar —</option>${S.funcionarios.map(f=>`<option value="${f.id}" ${f.id===x.funcId?'selected':''}>${f.nome}</option>`).join('')}</select></td>
            <td class="px-2 py-1 text-center">${x.dias.length}</td>
            <td class="px-2 py-1 text-center ${fal?'text-red-600 font-semibold':'text-slate-300'}">${fal||'—'}</td>

window.aplicarImport = async function(){
  const imp=pontoImport; const alvos=imp.funcs.filter(x=>x.funcId);
  if(!alvos.length){ alert('Nenhum funcionário casado para importar.'); return; }
  let recs=[];
  alvos.forEach(x=>{ x.dias.forEach(d=>{ recs.push({ funcionario_id:x.funcId, periodo_id:periodoDaData(d.data), data:d.data, status:d.status,
    horas_trabalhadas:d.horas||0, banco_minutos:d.banco||0, turno:d.turno||null, entrada_1:d.ent||null, saida_1:d.sai||null, origem:'upload', validado:true }); }); });
  // upsert em lotes
  const chunk=500; let erro=null;
  for(let i=0;i<recs.length;i+=chunk){ const { error }=await sb.from('controle_ponto').upsert(recs.slice(i,i+chunk),{onConflict:'funcionario_id,data'}); if(error){erro=error;break;} }
  if(erro){ alert('Erro ao gravar: '+erro.message); return; }
  pontoImport=null; await carregarPontoGrid(); if(S.periodoAtual) await carregarPonto(); render();
  alert('Importado: '+alvos.length+' funcionários · '+recs.length+' dias.');
};

<script>
/* ===================== HOLERITE (BETA — estimativa) ===================== */
// Tabelas de referência (estimativa — confira/atualize conforme a legislação vigente)
function calcINSS(base){
  const faixas=[[1518.00,0.075],[2793.88,0.09],[4190.83,0.12],[8157.41,0.14]];
  let prev=0,t=0;
  for(const [lim,al] of faixas){ if(base>prev){ t+=(Math.min(base,lim)-prev)*al; prev=lim; } else break; }
  return t;
}
function calcIRRF(base){
  let v=0;
  if(base<=2259.20) v=0;
  else if(base<=2826.65) v=base*0.075-169.44;
  else if(base<=3751.05) v=base*0.15-381.44;
  else if(base<=4664.68) v=base*0.225-662.77;
  else v=base*0.275-896.00;
  return Math.max(0,v);
}
const EMPRESA={ nome:'BTS EVENTOS LTDA', endereco:'RUA AMAURI, 35 — CEP 01448-000 — SÃO PAULO/SP', cnpj:'46.237.187/0001-42' };
const TIPO_RECIBO={oficial:'RECIBO DE PAGAMENTO DE SALÁRIO', adiantamento:'RECIBO DE ADIANTAMENTO', outro:'RECIBO DE PAGAMENTO', rescisao:'RECIBO DE RESCISÃO', decimo_terceiro_1:'13º SALÁRIO — 1ª PARCELA', decimo_terceiro_2:'13º SALÁRIO — 2ª PARCELA'};
function holeriteLinhas(){
  const c=calcComissao(); if(!c) return {tipo:null, rows:[]};
  const cfg=S.config, dentroPct=Number(cfg.holerite_dentro_pct)/100, tipo=c.tipo;
  const rows=c.rows.map(r=>{
    const comDentro=r.comDentro||0, benef=r.benef||0, he=r.hePagar||0;
    let prov=[], base=0, desc=[], inss=0, irrf=0;
    if(tipo==='adiantamento'){
      prov=[['Adiantamento 40% do salário','',r.adiantSalario]]; if(he)prov.push(['Horas extras','',he]); if(benef)prov.push(['Benefícios','',benef]);
    } else if(tipo==='decimo_terceiro_1'){
      prov=[['13º salário - 1ª parcela','',r.base13*0.5]];
    } else if(tipo==='decimo_terceiro_2'){
      prov=[['13º salário - 2ª parcela','',r.base13*0.5]]; base=r.base13; inss=r.inss13||0; irrf=r.irrf13||0;
      desc=[['INSS 13º','',inss],['IRRF 13º','',irrf]];
    } else {
      const salP = tipo==='rescisao' ? (r.salarioProp||0) : r.salario;
      prov=[[tipo==='rescisao'?'Saldo de salário':'Salário mensalista','',salP],['Taxa de serviço (comissão)','',comDentro]];
      if(he)prov.push(['Horas extras','',he]); if(benef)prov.push(['Benefícios','',benef]);
      base=salP+comDentro+he; inss=calcINSS(base); irrf=calcIRRF(base-inss);
      desc=[['INSS','',inss],['IRRF','',irrf]];
      if(tipo==='oficial'){ const adC=(r.adiantComPago||0)*dentroPct;
        desc.push(['Adiant. de salário','',r.adiantSalPago||0]); desc.push(['Adiant. de comissão','',adC]); }
    }
    const totProv=prov.reduce((a,x)=>a+x[2],0), totDesc=desc.reduce((a,x)=>a+x[2],0);
    return {r, tipo, prov, desc:desc.filter(x=>x[2]>0), base, inss, irrf,
      outros:totDesc-inss-irrf, totProv, totDesc, liquido:totProv-totDesc, comFora:r.comFora||0};
  });
  return {tipo, rows};
}
function drawRecibo(doc, x, mesRef, periodoTxt){
  const fmt=v=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const r=x.r, L=12, R=198; let y=16;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(EMPRESA.nome,L,y); doc.text(TIPO_RECIBO[x.tipo]||'RECIBO DE PAGAMENTO',R,y,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(7); y+=4;
  doc.text(EMPRESA.endereco,L,y); doc.text('Referente: '+mesRef,R,y,{align:'right'}); y+=3.6;
  doc.text('CNPJ: '+EMPRESA.cnpj,L,y); if(periodoTxt) doc.text('Apuração: '+periodoTxt,R,y,{align:'right'}); y+=5.5;
  doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text(`${String(r.f.id).padStart(6,'0')}  ${r.f.nome}`,L,y);
  doc.setFont('helvetica','normal'); doc.text('Admissão: '+(r.f.data_admissao?r.f.data_admissao.split('-').reverse().join('/'):'—'),R,y,{align:'right'}); y+=4.5;
  doc.setFontSize(6.8); doc.text(`Função: ${r.f.cargos?.nome||'—'}      CPF: ${r.f.cpf||'—'}`,L,y); y+=3.5;
  doc.setDrawColor(160); doc.line(L,y,R,y); y+=3.4;
  doc.setFont('helvetica','bold'); doc.setFontSize(6.8);
  doc.text('DESCRIÇÃO',L+2,y); doc.text('PROVENTOS',162,y,{align:'right'}); doc.text('DESCONTOS',R-2,y,{align:'right'}); y+=1.5;
  doc.line(L,y,R,y); y+=3.6; doc.setFont('helvetica','normal');
  const prov=x.prov, desc=x.desc, n=Math.max(prov.length,desc.length);
  for(let i=0;i<n;i++){ if(prov[i]){ doc.text(prov[i][0],L+2,y); doc.text(fmt(prov[i][2]),162,y,{align:'right'}); }
    if(desc[i]){ doc.text(desc[i][0],110,y); doc.text(fmt(desc[i][2]),R-2,y,{align:'right'}); } y+=3.6; }
  y+=1; doc.line(L,y,R,y); y+=3.6; doc.setFont('helvetica','bold');
  doc.text('Totais',L+2,y); doc.text(fmt(x.totProv),162,y,{align:'right'}); doc.text(fmt(x.totDesc),R-2,y,{align:'right'}); y+=6;
  doc.setFontSize(10); doc.text('LÍQUIDO A RECEBER    R$ '+fmt(x.liquido),R,y,{align:'right'}); y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(6.3);
  const bw=(R-L)/4, bases=[['Salário base',r.f.salario],['Base INSS/IRRF',x.base],['Base IRRF',Math.max(0,x.base-x.inss)],['Comissão por fora',x.comFora]];
  doc.rect(L,y,R-L,9);
  bases.forEach((b,i)=>{ const bx=L+i*bw; if(i>0)doc.line(bx,y,bx,y+9); doc.text(b[0],bx+2,y+3.5); doc.setFont('helvetica','bold'); doc.text(fmt(b[1]),bx+bw-2,y+7,{align:'right'}); doc.setFont('helvetica','normal'); });
  y+=14; doc.setFontSize(6.5);
  doc.text('Declaro ter recebido o valor líquido deste recibo.',L,y); y+=7;
  doc.text('____/____/______        Assinatura do colaborador: __________________________________',L,y); y+=8;
  doc.setTextColor(150); doc.setFontSize(6);
  doc.text('Documento gerado pelo sistema (BETA) — INSS/IRRF estimados, não substituem a folha oficial.',L,y); doc.setTextColor(0);
}
window.gerarHoleritePDF = function(funcId){
  if(!window.jspdf){ alert('Biblioteca de PDF não carregou. Recarregue a página.'); return; }
  const H=holeriteLinhas(); let linhas=H.rows; if(funcId) linhas=linhas.filter(x=>x.r.f.id===funcId);
  if(!linhas.length){ alert('Sem dados para gerar.'); return; }
  const p=S.periodoAtual, mesRef=(TIPO_PAG[H.tipo]||'')+' · '+(MESES_F[p.mes-1]||'')+'/'+p.ano;
  const periodoTxt=`${fmtDM(new Date(p.data_inicio+'T00:00:00'))}–${fmtDM(new Date(p.data_fim+'T00:00:00'))}`;
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  linhas.forEach((x,i)=>{ if(i>0) doc.addPage(); drawRecibo(doc,x,mesRef,periodoTxt); });
  doc.save(funcId?('holerite-'+linhas[0].r.f.nome.split(' ')[0].toLowerCase()+'.pdf'):('holerites-'+(H.tipo||'')+'-'+(p.data_inicio||'')+'.pdf'));
};
window._viewHolerite = function(){
  const header = `<div class="mb-6"><h1 class="text-3xl font-bold text-slate-900 mb-1 flex items-center gap-3">Holerite <span class="badge bg-purple-100 text-purple-700">BETA</span></h1><p class="text-slate-500 text-sm">Recibo de pagamento por colaborador — segue o tipo do período selecionado</p></div>`;
  const aviso = `<div class="mb-4 p-3 bg-purple-50 border border-purple-200 rounded-lg text-sm text-purple-800 flex items-start gap-2"><i data-feather="alert-triangle" class="w-4 h-4 mt-0.5"></i><div><strong>Recurso em beta.</strong> INSS e IRRF são <strong>estimativas</strong> (tabelas de referência) e não substituem a folha oficial. Base de imposto = salário + comissão <em>por dentro</em> + HE (comissão por fora não tributa). Benefícios entram no líquido sem tributar. Verbas de rescisão (férias, aviso, FGTS) ainda não incluídas.</div></div>`;

  const H=holeriteLinhas(); const rows=H.rows; const tot=k=>rows.reduce((a,x)=>a+(x[k]||0),0);
  return header + aviso + seletorPeriodo()
  + `<div class="flex items-center justify-between mb-3">

     </div>`
  + card(`<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600 border-b border-slate-200"><tr>
      <th class="px-3 py-3 text-left">Funcionário</th>

      <th class="px-2 py-3 text-right text-red-600">INSS</th><th class="px-2 py-3 text-right text-red-600">IRRF</th><th class="px-2 py-3 text-right text-red-600">Outros desc.</th>
      <th class="px-3 py-3 text-right bg-green-50">LÍQUIDO</th><th class="px-2 py-3 text-right bg-indigo-50">Com. fora</th><th class="px-2 py-3"></th></tr></thead><tbody>
      ${rows.map(x=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
        <td class="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">${x.r.f.nome.split(' ').slice(0,2).join(' ')}</td>
        <td class="px-2 py-2 text-right">${money(x.totProv)}</td>
        <td class="px-2 py-2 text-right bg-slate-50 ${x.base?'':'text-slate-300'}">${x.base?money(x.base):'—'}</td>
        <td class="px-2 py-2 text-right text-red-600">${x.inss>0?'−'+money(x.inss):'—'}</td>
        <td class="px-2 py-2 text-right text-red-600">${x.irrf>0?'−'+money(x.irrf):'—'}</td>
        <td class="px-2 py-2 text-right text-red-600">${x.outros>0?'−'+money(x.outros):'—'}</td>
        <td class="px-3 py-2 text-right font-bold text-green-700 bg-green-50/50">${money(x.liquido)}</td>
        <td class="px-2 py-2 text-right text-indigo-700 bg-indigo-50/40">${x.comFora>0?money(x.comFora):'—'}</td>
        <td class="px-2 py-2 text-center"><button onclick="gerarHoleritePDF(${x.r.f.id})" class="text-purple-600 hover:underline text-xs flex items-center gap-1 mx-auto" title="Baixar recibo"><i data-feather="download" class="w-3 h-3"></i>PDF</button></td>
      </tr>`).join('')}
      <tr class="bg-slate-50 font-bold text-slate-800"><td class="px-3 py-2">TOTAL</td><td class="px-2 py-2 text-right">${money(tot('totProv'))}</td><td class="px-2 py-2 text-right bg-slate-100">${money(tot('base'))}</td><td class="px-2 py-2 text-right text-red-600">−${money(tot('inss'))}</td><td class="px-2 py-2 text-right text-red-600">−${money(tot('irrf'))}</td><td class="px-2 py-2 text-right text-red-600">−${money(tot('outros'))}</td><td class="px-3 py-2 text-right text-green-700 bg-green-100">${money(tot('liquido'))}</td><td class="px-2 py-2 text-right bg-indigo-100 text-indigo-700">${money(tot('comFora'))}</td><td></td></tr>
      </tbody></table></div>

};
