<script>
/* ===================== EXTRAS (calendário + aprovação, grava no banco) ===================== */
const MESES_F=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
let extrasMes={ano:new Date().getFullYear(), mes:new Date().getMonth()+1};
let atribForm=null;
let extrasRelPeriodoId=null;

/* ---- helpers de valor/período (globais; usados também no cálculo da comissão) ---- */
const PERIODO_LBL={almoco:'Almoço',jantar:'Jantar',ambos:'Almoço e Jantar'};
function valorPorPeriodo(tipo){ return tipo==='dobra'?Number(S.config?.valor_dobra||0):Number(S.config?.valor_extra_diaria||0); }
function periodosUnit(s){ return s.periodo==='ambos'?2:1; }
function custoUnit(s){ return (s.valor!=null&&s.valor!=='')?Number(s.valor):periodosUnit(s)*valorPorPeriodo(s.tipo); }
function pessoaUnit(s){ return s.tipo_pessoa==='funcionario'?(s.funcionarios?.nome||'Funcionário'):s.tipo_pessoa==='freelancer'?(s.nome_freelancer||'Freelancer'):'— a definir —'; }
function extraFuncPeriodo(fid,p){ let v=0; (S.solicitacoes||[]).forEach(s=>{ if(s.provisionado && s.tipo_pessoa==='funcionario' && s.funcionario_id===fid && s.data>=p.data_inicio && s.data<=p.data_fim) v+=custoUnit(s); }); return v; }

async function reloadSolic(){ const {data}=await sb.from('solicitacoes_extra').select('*, setores(nome), funcionarios(nome)').eq('restaurante_id',S.restaurante.id).order('data',{ascending:false}); S.solicitacoes=data||[]; }
window.mudarMesExtras=function(delta){ let m=extrasMes.mes+delta,a=extrasMes.ano; if(m<1){m=12;a--;} if(m>12){m=1;a++;} extrasMes={ano:a,mes:m}; render(); };

/* ---- atribuir pessoa a uma unidade de extra/dobra (funcionário OU freelancer) ---- */
window.abrirAtribuir=function(id){ const s=S.solicitacoes.find(x=>x.id===id); if(!s)return; atribForm={id, tipo:s.tipo_pessoa||'funcionario', funcionario_id:s.funcionario_id||null, nome:s.nome_freelancer||'', cpf:s.cpf_freelancer||''}; paintModals(); };
window.fecharAtribuir=function(){ atribForm=null; paintModals(); };
window.atribTipo=function(v){ atribForm.tipo=v; atribForm.funcionario_id=null; paintModals(); };
window.salvarAtribuir=async function(){
  const a=atribForm; let upd;
  if(a.tipo==='funcionario'){ const fid=+val('atb_func')||null; if(!fid){ alert('Escolha o funcionário.'); return; } upd={tipo_pessoa:'funcionario', funcionario_id:fid, nome_freelancer:null, cpf_freelancer:null}; }
  else if(a.tipo==='freelancer'){ const nome=(val('atb_nome')||'').trim(); if(!nome){ alert('Informe o nome do freelancer.'); return; } upd={tipo_pessoa:'freelancer', funcionario_id:null, nome_freelancer:nome, cpf_freelancer:(val('atb_cpf')||'').trim()||null}; }
  else { upd={tipo_pessoa:null, funcionario_id:null, nome_freelancer:null, cpf_freelancer:null}; }
  const { error }=await sb.from('solicitacoes_extra').update(upd).eq('id',a.id); if(error){ alert('Erro: '+error.message); return; }
  atribForm=null; await reloadSolic(); render();
};
function atribModalHTML(){ if(!atribForm) return ''; const a=atribForm; const s=S.solicitacoes.find(x=>x.id===a.id)||{};
  const opt=(v,l)=>`<button onclick="atribTipo('${v}')" class="px-3 py-1.5 rounded text-sm border ${a.tipo===v?'bg-blue-600 text-white border-blue-600':'border-slate-200 text-slate-600 hover:bg-slate-100'}">${l}</button>`;
  return `<div class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4" onclick="if(event.target===this)fecharAtribuir()">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
      <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200"><h3 class="font-bold text-slate-900">Atribuir pessoa · ${s.data?s.data.slice(8,10)+'/'+s.data.slice(5,7):''} ${tipoBadgeED(s.tipo)}</h3><button onclick="fecharAtribuir()" class="text-slate-400 hover:text-slate-700"><i data-feather="x" class="w-5 h-5"></i></button></div>
      <div class="p-5">
        <label class="text-xs text-slate-500 block mb-1">Quem vai receber?</label>
        <div class="flex gap-2 mb-4">${opt('funcionario','Funcionário')}${opt('freelancer','Freelancer')}${opt('','A definir')}</div>
        ${a.tipo==='funcionario'?`<label class="text-xs text-slate-500 block mb-1">Funcionário</label><select id="atb_func" class="w-full px-3 py-2 border border-slate-200 rounded text-sm"><option value="">— escolher —</option>${S.funcionarios.map(f=>`<option value="${f.id}" ${f.id===a.funcionario_id?'selected':''}>${f.nome}</option>`).join('')}</select><p class="text-[11px] text-slate-400 mt-2">Funcionários entram na <strong>comissão quinzenal</strong> (pago por fora).</p>`:''}
        ${a.tipo==='freelancer'?`<div class="grid grid-cols-1 gap-3"><div><label class="text-xs text-slate-500 block mb-1">Nome do freelancer</label><input id="atb_nome" value="${(a.nome||'').replace(/"/g,'&quot;')}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm" placeholder="Nome completo"></div><div><label class="text-xs text-slate-500 block mb-1">CPF</label><input id="atb_cpf" value="${(a.cpf||'').replace(/"/g,'&quot;')}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm" placeholder="000.000.000-00"></div></div><p class="text-[11px] text-slate-400 mt-2">Freelancers são <strong>pagos direto</strong> e entram no relatório de extras e dobras a pagar.</p>`:''}
        ${a.tipo===''?`<p class="text-sm text-slate-400">A unidade ficará <strong>sem pessoa definida</strong>.</p>`:''}
      </div>
      <div class="flex justify-end gap-2 px-5 py-3 border-t border-slate-200"><button onclick="fecharAtribuir()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded text-sm hover:bg-slate-100">Cancelar</button><button onclick="salvarAtribuir()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700">Salvar</button></div>
    </div></div>`;
}

/* ---- badges ---- */
function tipoBadgeED(t){ return t==='dobra'?'<span class="badge bg-purple-100 text-purple-700">Dobra</span>':'<span class="badge bg-blue-100 text-blue-700">Extra</span>'; }
function periodoBadge(p){ return `<span class="badge bg-slate-100 text-slate-600">${PERIODO_LBL[p]||p}</span>`; }
function ggBadge(s){ return s.status_gg==='aprovado'?'<span class="badge bg-green-100 text-green-700">GG ✓</span>':s.status_gg==='reprovado'?'<span class="badge bg-rose-100 text-rose-700">GG ✗</span>':'<span class="badge bg-slate-100 text-slate-500">GG pend.</span>'; }
function rhBadge(s){ return s.status_rh==='aprovado'?'<span class="badge bg-green-100 text-green-700">RH ✓</span>':s.status_rh==='reprovado'?'<span class="badge bg-rose-100 text-rose-700">RH ✗</span>':'<span class="badge bg-slate-100 text-slate-500">RH pend.</span>'; }

/* ---- aprovação RH (individual por unidade) → provisão quando GG e RH aprovam ---- */
function mergeFinal(g,r){ if(g==='reprovado'||r==='reprovado') return {status_final:'reprovado',provisionado:false}; if(g==='aprovado'&&r==='aprovado') return {status_final:'provisionado',provisionado:true}; return {status_final:'pendente',provisionado:false}; }
window.aprovarRH=async function(id,ok){
  const s=S.solicitacoes.find(x=>x.id===id); if(!s)return;
  let motivo=null; if(!ok) motivo=prompt('Motivo da reprovação (opcional):')||'';
  const upd={ status_rh: ok?'aprovado':'reprovado', aprovado_rh_por:S.perfil?.nome||S.session?.user?.email||'RH', aprovado_rh_em:new Date().toISOString() };
  if(!ok) upd.motivo_recusa=motivo;
  const m=mergeFinal(s.status_gg, upd.status_rh); upd.status_final=m.status_final; upd.provisionado=m.provisionado;
  const { error }=await sb.from('solicitacoes_extra').update(upd).eq('id',id); if(error){ alert('Erro: '+error.message); return; }
  await reloadSolic(); render();
};
window.excluirSolic=async function(id){ if(!confirm('Excluir esta unidade de extra/dobra? Esta ação é definitiva.'))return; await sb.from('solicitacoes_extra').delete().eq('id',id); await reloadSolic(); render(); };
window.setExtrasRelPeriodo=function(v){ extrasRelPeriodoId=+v||null; render(); };
window.salvarRelatorioExtras=async function(){
  const pid=extrasRelPeriodoId||S.periodoAtual?.id; const p=S.periodos.find(x=>x.id===+pid);
  if(!p){ alert('Selecione um período para o relatório.'); return; }
  const prov=S.solicitacoes.filter(s=>s.provisionado && s.data>=p.data_inicio && s.data<=p.data_fim);
  if(!prov.length && !confirm('Não há extras/dobras provisionados neste período. Salvar mesmo assim (relatório zerado)?')) return;
  const total=prov.reduce((a,s)=>a+custoUnit(s),0);
  const apur=`${fmtDM(new Date(p.data_inicio+'T00:00:00'))}–${fmtDM(new Date(p.data_fim+'T00:00:00'))}`;
  await sb.from('pagamentos').delete().eq('periodo_id',p.id).eq('ciclo','Extras e Dobras');
  const { error }=await sb.from('pagamentos').insert({ restaurante_id:S.restaurante.id, periodo_id:p.id, ciclo:'Extras e Dobras', data_pagamento:p.data_pagamento, apuracao:apur, colaboradores:prov.length, total_comissao:0, total_folha:total, status:'Previsto' });
  if(error){ alert('Erro ao salvar: '+error.message); return; }
  await carregarDados(); render(); alert('Relatório de extras e dobras salvo na página Relatórios ('+apur+' · '+money(total)+').');
};
window.excluirRelatorio=async function(id){ if(!confirm('Excluir este relatório do histórico? Remove só o registro em Relatórios — não apaga os dados de comissão, ponto ou extras.'))return; await sb.from('pagamentos').delete().eq('id',id); await carregarDados(); render(); };

/* ===================== EXTRAS (RH: calendário, custo, provisão) ===================== */
window._viewExtras=function(){
  const {ano,mes}=extrasMes; const pref=`${ano}-${String(mes).padStart(2,'0')}`;
  const ativos=s=>s.status_gg!=='reprovado'&&s.status_rh!=='reprovado';
  const doMes=S.solicitacoes.filter(s=>s.data.startsWith(pref));
  const doMesAtivos=doMes.filter(ativos);
  const qtdExtra=doMesAtivos.filter(s=>s.tipo==='extra').length;
  const qtdDobra=doMesAtivos.filter(s=>s.tipo==='dobra').length;
  const provMes=doMes.filter(s=>s.provisionado);
  const custoMes=provMes.reduce((a,s)=>a+custoUnit(s),0);
  const byMonth={}; S.solicitacoes.filter(s=>s.provisionado).forEach(s=>{ const k=s.data.slice(0,7); byMonth[k]=(byMonth[k]||0)+custoUnit(s); });
  const meses=Object.keys(byMonth); const media=meses.length?meses.reduce((a,k)=>a+byMonth[k],0)/meses.length:0;
  const diffPct=media>0?((custoMes-media)/media*100):0; const acima=custoMes>media;
  const vsMediaTxt=media>0?`${acima?'+':''}${diffPct.toFixed(0)}% vs média`:'sem histórico';
  const pendRH=doMes.filter(s=>s.status_rh==='pendente'&&s.status_gg==='aprovado').length;
  const kpis=[
    ['EXTRAS NO MÊS',qtdExtra,`${new Set(doMesAtivos.filter(s=>s.tipo==='extra').map(s=>s.data)).size} dias`,'text-blue-600'],
    ['DOBRAS NO MÊS',qtdDobra,`${new Set(doMesAtivos.filter(s=>s.tipo==='dobra').map(s=>s.data)).size} dias`,'text-purple-600'],
    ['CUSTO PROVISIONADO',money(custoMes),`${provMes.length} unidades`,'text-slate-900'],
    ['VS. MÉDIA MENSAL',vsMediaTxt,`média ${money(media)}`,acima?'text-rose-600':'text-green-600'],
  ];
  const first=new Date(ano,mes-1,1); const startDow=first.getDay(); const dim=new Date(ano,mes,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++)cells.push(null); for(let d=1;d<=dim;d++)cells.push(d); while(cells.length%7)cells.push(null);
  const doDia=d=>doMesAtivos.filter(s=>s.data===`${pref}-${String(d).padStart(2,'0')}`);
  const maxQ=Math.max(1,...Array.from({length:dim},(_,i)=>doDia(i+1).length));
  const calendar=card(`<div class="p-5">
      <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>${MESES_F[mes-1]} / ${ano}</h3>
        <div class="flex gap-1"><button onclick="mudarMesExtras(-1)" class="p-2 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-left" class="w-4 h-4"></i></button><button onclick="mudarMesExtras(1)" class="p-2 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-right" class="w-4 h-4"></i></button></div></div>
      <div class="grid grid-cols-7 gap-1.5 mb-1">${DOW3.map(d=>`<div class="text-center text-xs font-semibold ${['Dom','Sáb'].includes(d)?'text-blue-500':'text-slate-400'}">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1.5">${cells.map(d=>{ if(!d) return `<div class="h-20 rounded bg-slate-50/50"></div>`;
        const itens=doDia(d); const q=itens.length;
        const ex=itens.filter(s=>s.tipo==='extra').length; const db=itens.filter(s=>s.tipo==='dobra').length;
        const cst=itens.filter(s=>s.provisionado).reduce((a,s)=>a+custoUnit(s),0);
        const hasPend=itens.some(s=>!s.provisionado); const ratio=q/maxQ; const claro=q&&ratio>0.33;
        const bg=q===0?'bg-white':ratio>0.66?'bg-blue-600':ratio>0.33?'bg-blue-400':'bg-blue-100';
        return `<div class="h-20 rounded border border-slate-200 p-1.5 flex flex-col ${bg}">
          <div class="flex justify-between items-start"><span class="text-xs font-semibold ${claro?'text-white':'text-slate-500'}">${d}</span>${hasPend?'<span class="w-2 h-2 rounded-full bg-amber-400" title="pendente"></span>':''}</div>
          ${q?`<div class="mt-auto leading-none"><div class="${claro?'text-white':'text-blue-700'} text-sm font-bold">${ex?ex+'E':''}${ex&&db?' ':''}${db?db+'D':''}</div><div class="text-[9px] ${claro?'text-blue-100':'text-slate-400'}">${money(cst)}</div></div>`:''}
        </div>`;}).join('')}</div>
      <p class="text-[11px] text-slate-400 mt-3"><strong>E</strong> = extras · <strong>D</strong> = dobras (unidades) · valor = provisionado. Ponto âmbar = ainda pendente.</p></div>`);
  const lista=card(`<div class="p-5"><h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i data-feather="check-square" class="w-4 h-4 text-blue-600"></i>Unidades do mês — aprovação do RH ${pendRH?`<span class="badge bg-amber-100 text-amber-700">${pendRH} aguardando RH</span>`:''}</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600"><tr><th class="px-2 py-2 text-left">Data</th><th class="px-2 py-2 text-left">Tipo</th><th class="px-2 py-2 text-left">Período</th><th class="px-2 py-2 text-left">Setor</th><th class="px-2 py-2 text-left">Pessoa</th><th class="px-2 py-2 text-right">Custo</th><th class="px-2 py-2 text-center">GG</th><th class="px-2 py-2 text-center">RH</th><th class="px-2 py-2 text-center">Ação</th></tr></thead><tbody>
      ${doMes.length?doMes.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(s=>{
        const podeRH=s.status_rh==='pendente'&&s.status_gg!=='reprovado';
        const acao=s.provisionado?'<span class="badge bg-emerald-100 text-emerald-700">Provisionado</span>'
          :(s.status_gg==='reprovado'||s.status_rh==='reprovado')?`<span class="badge bg-rose-100 text-rose-700">Reprovado</span>`
          :podeRH?`<div class="flex gap-1 justify-center"><button onclick="aprovarRH(${s.id},true)" class="badge bg-green-100 text-green-700 hover:bg-green-200" ${s.status_gg!=='aprovado'?'title="Provisiona só após o GG aprovar"':''}>Aprovar ✓</button><button onclick="aprovarRH(${s.id},false)" class="badge bg-rose-100 text-rose-700 hover:bg-rose-200">✗</button></div>`
          :'<span class="badge bg-amber-100 text-amber-700">Aguardando</span>';
        return `<tr class="border-b border-slate-100 hover:bg-blue-50/40">
          <td class="px-2 py-1.5 font-medium">${s.data.slice(8,10)}/${s.data.slice(5,7)}</td>
          <td class="px-2 py-1.5">${tipoBadgeED(s.tipo)}</td>
          <td class="px-2 py-1.5">${periodoBadge(s.periodo)}</td>
          <td class="px-2 py-1.5">${setorBadge(s.setores?.nome)}</td>
          <td class="px-2 py-1.5 text-slate-600">${s.tipo_pessoa?pessoaUnit(s):'<span class="text-amber-600 font-medium">— a definir —</span>'} <button onclick="abrirAtribuir(${s.id})" class="text-blue-400 hover:text-blue-600 align-middle" title="atribuir/editar pessoa"><i data-feather="edit-2" class="w-3 h-3 inline"></i></button></td>
          <td class="px-2 py-1.5 text-right font-semibold">${money(custoUnit(s))}</td>
          <td class="px-2 py-1.5 text-center">${ggBadge(s)}</td>
          <td class="px-2 py-1.5 text-center">${rhBadge(s)}</td>
          <td class="px-2 py-1.5 text-center"><div class="flex items-center justify-center gap-2">${acao}${podeEscrever('extras')?`<button onclick="excluirSolic(${s.id})" class="text-slate-300 hover:text-red-500" title="excluir esta unidade"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button>`:''}</div></td>
        </tr>`;}).join(''):'<tr><td colspan="9" class="text-center text-slate-400 py-6">Nenhuma solicitação neste mês.</td></tr>'}
      </tbody></table></div>
      <div class="mt-3 text-[11px] text-slate-500 flex items-center gap-2"><i data-feather="link" class="w-3.5 h-3.5"></i>Provisão acontece quando <strong>GG</strong> e <strong>RH</strong> aprovam a unidade. Custo provisionado (${money(custoMes)}) alimenta "Gasto com extras" na Comissão.</div></div>`);
  const relP=S.periodos.find(x=>x.id===(extrasRelPeriodoId||S.periodoAtual?.id))||S.periodos[0]||null;
  const labelPeriodo=p=>`${TIPO_PAG[p.tipo_pagamento]||p.tipo_pagamento} · ${fmtDM(new Date(p.data_inicio+'T00:00:00'))}–${fmtDM(new Date(p.data_fim+'T00:00:00'))}`;
  const aPagar=relP?S.solicitacoes.filter(s=>s.provisionado && s.data>=relP.data_inicio && s.data<=relP.data_fim).sort((a,b)=>a.data.localeCompare(b.data)||a.tipo.localeCompare(b.tipo)):[];
  const totFreel=aPagar.filter(s=>s.tipo_pessoa==='freelancer').reduce((a,s)=>a+custoUnit(s),0);
  const totFunc=aPagar.filter(s=>s.tipo_pessoa==='funcionario').reduce((a,s)=>a+custoUnit(s),0);
  const totDef=aPagar.filter(s=>!s.tipo_pessoa).reduce((a,s)=>a+custoUnit(s),0);
  const totAll=totFreel+totFunc+totDef;
  const pessoaBadge=s=>s.tipo_pessoa==='funcionario'?'<span class="badge bg-blue-50 text-blue-600">Funcionário</span>':s.tipo_pessoa==='freelancer'?'<span class="badge bg-amber-50 text-amber-700">Freelancer</span>':'<span class="badge bg-slate-100 text-slate-400">A definir</span>';
  const podeED=podeEscrever('extras');
  const relPeriodoSel=`<select onchange="setExtrasRelPeriodo(this.value)" class="px-2 py-1.5 border border-slate-200 rounded text-sm">${S.periodos.map(p=>`<option value="${p.id}" ${relP&&p.id===relP.id?'selected':''}>${labelPeriodo(p)}</option>`).join('')||'<option>sem períodos</option>'}</select>`;
  const relES=card(`<div class="p-5"><div class="flex items-center justify-between mb-3 flex-wrap gap-2"><h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="dollar-sign" class="w-4 h-4 text-amber-600"></i>Extras e dobras a pagar — por período</h3>
        <div class="flex items-center gap-2 flex-wrap">${relPeriodoSel}
          ${podeED?`<button onclick="salvarRelatorioExtras()" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-medium hover:bg-emerald-700 flex items-center gap-1"><i data-feather="save" class="w-3.5 h-3.5"></i>Salvar em Relatórios</button>`:''}
          <button onclick="window.print()" class="px-3 py-1.5 border border-slate-200 rounded text-xs hover:bg-slate-100 flex items-center gap-1"><i data-feather="printer" class="w-3.5 h-3.5"></i>Imprimir</button></div></div>
      <p class="text-xs text-slate-500 mb-3">${relP?`Provisionados de <strong>${labelPeriodo(relP)}</strong>`:'Selecione um período'}. "Salvar em Relatórios" gera um registro no histórico (como adiantamento/oficial/rescisão), com PDF.</p>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600"><tr><th class="px-2 py-2 text-left">Data</th><th class="px-2 py-2 text-left">Tipo</th><th class="px-2 py-2 text-left">Quem recebe</th><th class="px-2 py-2 text-left">Nome</th><th class="px-2 py-2 text-left">CPF</th><th class="px-2 py-2 text-left">Período</th><th class="px-2 py-2 text-left">Setor</th><th class="px-2 py-2 text-right">Valor</th>${podeED?'<th class="px-2 py-2 text-center"></th>':''}</tr></thead><tbody>
      ${aPagar.length?aPagar.map(s=>`<tr class="border-b border-slate-100"><td class="px-2 py-1.5">${s.data.slice(8,10)}/${s.data.slice(5,7)}</td><td class="px-2 py-1.5">${tipoBadgeED(s.tipo)}</td><td class="px-2 py-1.5">${pessoaBadge(s)}</td><td class="px-2 py-1.5 font-medium text-slate-700">${pessoaUnit(s)}</td><td class="px-2 py-1.5 text-slate-500">${s.tipo_pessoa==='freelancer'?(s.cpf_freelancer||'—'):'—'}</td><td class="px-2 py-1.5">${periodoBadge(s.periodo)}</td><td class="px-2 py-1.5">${setorBadge(s.setores?.nome)}</td><td class="px-2 py-1.5 text-right font-semibold">${money(custoUnit(s))}</td>${podeED?`<td class="px-2 py-1.5 text-center"><button onclick="excluirSolic(${s.id})" class="text-slate-300 hover:text-red-500" title="excluir esta unidade"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button></td>`:''}</tr>`).join(''):`<tr><td colspan="${podeED?9:8}" class="text-center text-slate-400 py-5">Nenhuma extra ou dobra provisionada neste período.</td></tr>`}
      </tbody>${aPagar.length?`<tfoot><tr class="bg-slate-50 font-bold"><td colspan="7" class="px-2 py-2 text-right">Total a pagar</td><td class="px-2 py-2 text-right text-amber-700">${money(totAll)}</td>${podeED?'<td></td>':''}</tr></tfoot>`:''}</table></div>
      ${aPagar.length?`<p class="text-[11px] text-slate-500 mt-3 flex items-center gap-2"><i data-feather="info" class="w-3.5 h-3.5"></i>Funcionários (${money(totFunc)}) entram na <strong>comissão quinzenal</strong> (pago por fora); freelancers (${money(totFreel)}) são pagos direto.${totDef>0?` <span class="text-amber-600">${money(totDef)} ainda sem pessoa definida — atribua na lista acima.</span>`:''}</p>`:''}
      </div>`);
  return pageHeader('Extras (RH)','Calendário, custo provisionado e provisão de pagamento')
    + `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">${kpis.map(k=>card(`<div class="p-5"><p class="text-xs text-slate-500 font-semibold mb-2">${k[0]}</p><p class="text-2xl font-bold ${k[3]}">${k[1]}</p><p class="text-xs text-slate-400 mt-2">${k[2]}</p></div>`)).join('')}</div>`
    + calendar + `<div class="mt-4"></div>` + lista + `<div class="mt-4"></div>` + relES;
};
</script>
<script>
/* ===================== RANKING (atribui bônus por colocação) ===================== */
window.setRankingColoc = async function(coloc, funcId){
  const pid=S.periodoAtual.id;
  if(!funcId){ await sb.from('ranking_periodo').delete().eq('periodo_id',pid).eq('colocacao',coloc); S.rankingPeriodo=S.rankingPeriodo.filter(r=>r.colocacao!==coloc); }
  else { const ex=S.rankingPeriodo.find(r=>r.colocacao===coloc);
    if(ex){ await sb.from('ranking_periodo').update({funcionario_id:+funcId}).eq('id',ex.id); ex.funcionario_id=+funcId; }
    else { const {data}=await sb.from('ranking_periodo').insert({periodo_id:pid,colocacao:coloc,funcionario_id:+funcId}).select().single(); if(data)S.rankingPeriodo.push(data); } }
  render();
};
window._viewRanking = function(){
  const header=pageHeader('Ranking de Vendedores','Premiação por colocação — bônus calculado sobre a fatia de ranking');
  if(!S.periodoAtual) return header + seletorPeriodo() + card(`<div class="p-12 text-center text-slate-400"><i data-feather="award" class="w-10 h-10 mx-auto mb-3"></i><p class="text-sm">Selecione um período.</p></div>`);
  const c=calcComissao(); const bucket=c.bucketRanking;
  const selSel=(coloc)=>{ const cur=(S.rankingPeriodo.find(r=>r.colocacao===coloc)||{}).funcionario_id||'';
    return `<select onchange="setRankingColoc(${coloc},this.value)" class="px-2 py-1 border border-slate-200 rounded text-sm w-64"><option value="">— escolher vendedor —</option>${S.funcionarios.map(f=>`<option value="${f.id}" ${f.id===cur?'selected':''}>${f.nome}</option>`).join('')}</select>`; };
  return header + seletorPeriodo()
  + card(`<div class="p-6"><div class="flex items-center justify-between mb-4"><h3 class="font-bold flex items-center gap-2"><i data-feather="award" class="w-4 h-4 text-amber-600"></i>Colocações</h3><div class="text-sm text-slate-500">Bolo do ranking: <strong class="text-slate-800">${money(bucket)}</strong></div></div>
      <table class="w-full text-sm"><thead class="text-slate-500 text-xs border-b border-slate-200"><tr><th class="text-left py-2 w-16">Posição</th><th class="text-left">Vendedor</th><th class="text-center w-20">%</th><th class="text-right w-32">Bônus</th></tr></thead><tbody>
      ${S.ranking.map(r=>`<tr class="border-b border-slate-100"><td class="py-2 font-bold text-slate-400">${r.colocacao}º</td><td class="py-2">${selSel(r.colocacao)}</td><td class="py-2 text-center text-slate-600">${num(r.percentual,0)}%</td><td class="py-2 text-right font-semibold text-amber-600">${money(bucket*Number(r.percentual)/100)}</td></tr>`).join('')}
      </tbody></table>
      <p class="text-[11px] text-slate-400 mt-3">Escolha o vendedor de cada posição (extraído do TOTVS). O bônus entra automaticamente na Comissão Total da pessoa.</p></div>`);
};

/* ===================== RELATÓRIOS (histórico de pagamentos) ===================== */
window._viewRelatorios = function(){
  const pagos=S.pagamentos.filter(h=>h.status==='Pago');
  const totalFolha=pagos.reduce((a,h)=>a+Number(h.total_folha||0),0);
  const comTotal=pagos.reduce((a,h)=>a+Number(h.total_comissao||0),0);
  const prev=S.pagamentos.find(h=>h.status==='Previsto');
  const kpis=[['PAGAMENTOS REGISTRADOS',S.pagamentos.length,'no histórico','text-slate-900'],['TOTAL PAGO (FOLHA)',money(totalFolha),'pagamentos concluídos','text-slate-900'],['EM COMISSÕES',money(comTotal),'distribuído','text-green-600'],['PRÓXIMO/PREVISTO',prev?fmtData(new Date(prev.data_pagamento+'T00:00:00')):'—','aguardando','text-blue-600']];
  return pageHeader('Relatórios','Histórico de fechamentos e pagamentos')
    + `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">${kpis.map(k=>card(`<div class="p-5"><p class="text-xs text-slate-500 font-semibold mb-2">${k[0]}</p><p class="text-2xl font-bold ${k[3]}">${k[1]}</p><p class="text-xs text-slate-400 mt-2">${k[2]}</p></div>`)).join('')}</div>`
    + card(`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-600 border-b border-slate-200"><tr><th class="px-4 py-3 text-left">Data Pagamento</th><th class="px-4 py-3 text-left">Ciclo</th><th class="px-4 py-3 text-left">Apuração</th><th class="px-4 py-3 text-center">Colab.</th><th class="px-4 py-3 text-right">Comissões</th><th class="px-4 py-3 text-right">Folha Total</th><th class="px-4 py-3 text-center">Status</th><th class="px-4 py-3 text-center">Ação</th></tr></thead><tbody>
      ${S.pagamentos.map(h=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
        <td class="px-4 py-3 font-medium">${h.data_pagamento?fmtData(new Date(h.data_pagamento+'T00:00:00')):'—'}</td>
        <td class="px-4 py-3 text-slate-600">${h.ciclo||'—'}</td><td class="px-4 py-3 text-slate-600">${h.apuracao||'—'}</td>
        <td class="px-4 py-3 text-center">${h.colaboradores||'—'}</td>
        <td class="px-4 py-3 text-right">${money(h.total_comissao)}</td><td class="px-4 py-3 text-right font-semibold">${money(h.total_folha)}</td>
        <td class="px-4 py-3 text-center">${h.status==='Pago'?'<span class="badge bg-green-100 text-green-700">Pago</span>':(podeEscrever('relatorios')?`<button onclick="marcarPago(${h.id})" class="badge bg-amber-100 text-amber-700 hover:bg-amber-200">Marcar pago</button>`:'<span class="badge bg-amber-100 text-amber-700">Previsto</span>')}</td>
        <td class="px-4 py-3 text-center"><div class="flex items-center justify-center gap-3">
          <button onclick="abrirRelatorioPeriodo(${h.periodo_id})" class="text-blue-600 hover:underline text-xs" title="abrir o período na Comissão">Abrir</button>
          <button onclick="gerarRelatorioPDF(${h.id})" class="text-purple-600 hover:underline text-xs inline-flex items-center gap-1" title="baixar o relatório do período em PDF"><i data-feather="download" class="w-3 h-3"></i>PDF</button>
          ${podeEscrever('relatorios')?`<button onclick="excluirRelatorio(${h.id})" class="text-slate-300 hover:text-red-500" title="excluir relatório do histórico"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button>`:''}
        </div></td>
      </tr>`).join('')||'<tr><td colspan="8" class="text-center text-slate-400 py-8">Nenhum fechamento salvo ainda. Salve um na Comissão Quinzenal.</td></tr>'}
      </tbody></table></div>`);
};
window.marcarPago = async function(id){ await sb.from('pagamentos').update({status:'Pago',fechado_em:new Date().toISOString()}).eq('id',id); await carregarDados(); render(); };
window.abrirRelatorioPeriodo = async function(periodoId){ if(!periodoId){ alert('Este pagamento não tem período vinculado.'); return; } const p=S.periodos.find(x=>x.id===+periodoId); if(!p){ alert('Período não encontrado.'); return; } await selectPeriodo(periodoId); go('comissao'); };
window.gerarRelatorioPDF = async function(pagId){
  if(!window.jspdf){ alert('Biblioteca de PDF não carregou. Recarregue a página.'); return; }
  const h=S.pagamentos.find(x=>x.id===pagId); if(!h){ alert('Pagamento não encontrado.'); return; }
  if(String(h.ciclo||'').toLowerCase().includes('extra')) return gerarExtrasPDF(h);
  const { data, error }=await sb.from('comissao_resultado').select('*, funcionarios(nome)').eq('periodo_id',h.periodo_id);
  if(error){ alert('Erro ao carregar o relatório: '+error.message); return; }
  const rows=(data||[]).slice().sort((a,b)=>(a.setor||'').localeCompare(b.setor||'')||((Number(b.total)||0)-(Number(a.total)||0)));
  if(!rows.length){ alert('Este pagamento não tem detalhamento por colaborador salvo (fechamento antigo). Reabra o período na Comissão e salve de novo para gerar o PDF detalhado.'); return; }
  const nomeDe=r=>(r.funcionarios&&r.funcionarios.nome)||((S.funcionarios.find(f=>f.id===r.funcionario_id)||{}).nome)||('#'+r.funcionario_id);
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
  const fmt=v=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const L=12, R=285; let y=14;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(EMPRESA.nome,L,y);
  doc.setFontSize(11); doc.text('RELATÓRIO DE FECHAMENTO',R,y,{align:'right'}); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(`Ciclo: ${h.ciclo||'—'}    Apuração: ${h.apuracao||'—'}`,L,y);
  doc.text(`Pagamento: ${h.data_pagamento?h.data_pagamento.split('-').reverse().join('/'):'—'}    Status: ${h.status||'—'}`,R,y,{align:'right'}); y+=4;
  doc.text(`Colaboradores: ${rows.length}    Comissões: R$ ${fmt(h.total_comissao)}    Folha total: R$ ${fmt(h.total_folha)}`,L,y); y+=4;
  doc.setDrawColor(150); doc.line(L,y,R,y); y+=4.5;
  const cols=[ {x:L,label:'Funcionário',get:r=>nomeDe(r),align:'left',w:54},{x:68,label:'Setor',get:r=>r.setor||'—',align:'left',w:38},
    {x:112,label:'Pts fin.',get:r=>fmt(r.pontos_finais),align:'right'},{x:136,label:'Comissão',get:r=>fmt(r.comissao),align:'right'},
    {x:159,label:'Repique',get:r=>fmt(r.repique),align:'right'},{x:183,label:'Salário',get:r=>fmt(r.salario),align:'right'},
    {x:205,label:'HE',get:r=>fmt(r.he_pagar_valor),align:'right'},{x:230,label:'Ad.Not',get:r=>fmt(r.adic_noturno_valor),align:'right'},{x:R,label:'Total',get:r=>fmt(r.total),align:'right'} ];
  function cabecalho(){ doc.setFont('helvetica','bold'); doc.setFontSize(7.5); cols.forEach(c=>doc.text(c.label,c.x,y,c.align==='right'?{align:'right'}:undefined)); y+=1.6; doc.line(L,y,R,y); y+=3.6; doc.setFont('helvetica','normal'); doc.setFontSize(7.5); }
  cabecalho();
  rows.forEach(r=>{ if(y>196){ doc.addPage(); y=14; cabecalho(); }
    cols.forEach(c=>{ let t=String(c.get(r)); if(c.align==='left'&&c.w){ while(doc.getTextWidth(t)>c.w && t.length>3){ t=t.slice(0,-2); } } doc.text(t,c.x,y,c.align==='right'?{align:'right'}:undefined); });
    y+=4.2; });
  y+=1; doc.setDrawColor(150); doc.line(L,y,R,y); y+=4.2; doc.setFont('helvetica','bold'); doc.setFontSize(8);
  const sum=k=>rows.reduce((a,r)=>a+(Number(r[k])||0),0);
  doc.text('TOTAIS',L,y);
  doc.text(fmt(sum('comissao')),136,y,{align:'right'}); doc.text(fmt(sum('repique')),159,y,{align:'right'});
  doc.text(fmt(sum('salario')),183,y,{align:'right'}); doc.text(fmt(sum('he_pagar_valor')),205,y,{align:'right'});
  doc.text(fmt(sum('adic_noturno_valor')),230,y,{align:'right'}); doc.text(fmt(sum('total')),R,y,{align:'right'});
  doc.save('relatorio-'+String(h.ciclo||'').toLowerCase().replace(/\s+/g,'-')+'-'+(h.data_pagamento||'')+'.pdf');
};
async function gerarExtrasPDF(h){
  const p=S.periodos.find(x=>x.id===h.periodo_id);
  const ini=p?p.data_inicio:null, fim=p?p.data_fim:null;
  let q=sb.from('solicitacoes_extra').select('*, setores(nome), funcionarios(nome)').eq('provisionado',true);
  if(ini&&fim) q=q.gte('data',ini).lte('data',fim);
  const { data, error }=await q;
  if(error){ alert('Erro ao carregar: '+error.message); return; }
  const rows=(data||[]).slice().sort((a,b)=>a.data.localeCompare(b.data)||(a.tipo||'').localeCompare(b.tipo||''));
  if(!rows.length){ alert('Não há extras/dobras provisionados neste período para gerar o PDF.'); return; }
  const nomeDe=s=>s.tipo_pessoa==='funcionario'?(s.funcionarios?.nome||'Funcionário'):s.tipo_pessoa==='freelancer'?(s.nome_freelancer||'Freelancer'):'— a definir —';
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const fmt=v=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const L=12, R=198; let y=14;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(EMPRESA.nome,L,y);
  doc.setFontSize(10); doc.text('EXTRAS E DOBRAS A PAGAR',R,y,{align:'right'}); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(`Período: ${h.apuracao||'—'}`,L,y); doc.text(`Pagamento: ${h.data_pagamento?h.data_pagamento.split('-').reverse().join('/'):'—'}`,R,y,{align:'right'}); y+=4;
  const tFunc=rows.filter(s=>s.tipo_pessoa==='funcionario').reduce((a,s)=>a+custoUnit(s),0);
  const tFree=rows.filter(s=>s.tipo_pessoa==='freelancer').reduce((a,s)=>a+custoUnit(s),0);
  doc.text(`Unidades: ${rows.length}    Funcionários: R$ ${fmt(tFunc)} (vão p/ comissão)    Freelancers: R$ ${fmt(tFree)} (pagto direto)`,L,y); y+=4;
  doc.setDrawColor(150); doc.line(L,y,R,y); y+=4.5;
  const cols=[ {x:L,label:'Data',get:s=>s.data.slice(8,10)+'/'+s.data.slice(5,7),align:'left'},{x:28,label:'Tipo',get:s=>s.tipo==='dobra'?'Dobra':'Extra',align:'left'},
    {x:46,label:'Recebe',get:s=>s.tipo_pessoa==='funcionario'?'Func.':s.tipo_pessoa==='freelancer'?'Freela':'—',align:'left'},
    {x:66,label:'Nome',get:s=>nomeDe(s),align:'left',w:42},{x:112,label:'CPF',get:s=>s.tipo_pessoa==='freelancer'?(s.cpf_freelancer||'—'):'—',align:'left',w:28},
    {x:144,label:'Período',get:s=>(PERIODO_LBL[s.periodo]||s.periodo||'').slice(0,8),align:'left'},{x:168,label:'Setor',get:s=>(s.setores?.nome||'—').slice(0,10),align:'left'},{x:R,label:'Valor',get:s=>fmt(custoUnit(s)),align:'right'} ];
  function cab(){ doc.setFont('helvetica','bold'); doc.setFontSize(7.5); cols.forEach(c=>doc.text(c.label,c.x,y,c.align==='right'?{align:'right'}:undefined)); y+=1.6; doc.line(L,y,R,y); y+=3.6; doc.setFont('helvetica','normal'); doc.setFontSize(7.5); }

function _ovlp(a,b,s,e){ return Math.max(0, Math.min(b,e)-Math.max(a,s)); }

function _noturnoMin(a,b){ return _ovlp(a,b,0,300)+_ovlp(a,b,1320,1740); }
function extrairLinhasPDF(tc){
  const ln={};
  tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (ln[y]=ln[y]||[]).push(it); });
  return Object.keys(ln).map(Number).sort((a,b)=>b-a)
    .map(y=> ln[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str).join(' ').replace(/\s+/g,' ').trim())

function parseSecullum(text){
  const linhas=text.split('\n'); const dias=[]; let periodoTxt='';

    const dm=l.match(/(\d{2})\/(\d{2})\/(\d{4})\s*-\s*(\S{3,4})\s+(.*)/);

// Tabelas de referência (estimativa — confira/atualize conforme a legislação vigente)
function calcINSS(base){
  const faixas=[[1518.00,0.075],[2793.88,0.09],[4190.83,0.12],[8157.41,0.14]];
  let prev=0,t=0;
  for(const [lim,al] of faixas){ if(base>prev){ t+=(Math.min(base,lim)-prev)*al; prev=lim; } else break; }
  return t;
}
function calcIRRF(base){
  let v=0;
  if(base<=2259.20) v=0;
  else if(base<=2826.65) v=base*0.075-169.44;
  else if(base<=3751.05) v=base*0.15-381.44;
  else if(base<=4664.68) v=base*0.225-662.77;
  else v=base*0.275-896.00;
  return Math.max(0,v);
}

<script>

let escSetor=1, escAno=2026, escMes=6, escSemanaIdx=0, escEdit=null, escMetaDow=6;

const addDias=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
async function carregarEscala(){
  const MM=String(escMes).padStart(2,'0'); const ini=`${escAno}-${MM}-01`;
  const fimD=new Date(escAno,escMes,0); const fim=`${escAno}-${MM}-${String(fimD.getDate()).padStart(2,'0')}`;
  const [e,m,mh,env]=await Promise.all([
    sb.from('escala').select('*').eq('setor_id',escSetor).gte('data',addDias(ini,-7)).lte('data',addDias(fim,7)).order('data'),
    sb.from('escala_minimo').select('*').eq('setor_id',escSetor),
    sb.from('escala_meta_hora').select('*'),
    sb.from('escala_envio').select('*, setores(nome)').eq('status','pendente').order('enviado_em',{ascending:true}),
  ]);
  S.escala=e.data||[]; S.escalaMin=m.data||[]; S.escalaMetaHora=mh.data||[];
  S.escalaEnvios=env.data||[];
  if(S.escalaEnvios.length){
    const semanas=[...new Set(S.escalaEnvios.map(x=>x.semana_inicio))];
    const setoresP=[...new Set(S.escalaEnvios.map(x=>x.setor_id))];
    const rr=await sb.from('escala_rascunho').select('setor_id,semana_inicio,nome,data,status,periodo').in('semana_inicio',semanas).in('setor_id',setoresP);
    S.escalaRascunhoPend=rr.data||[];

window.aceitarEscala = async function(envioId){
  const env=(S.escalaEnvios||[]).find(x=>x.id===envioId); if(!env) return;
  if(!confirm(`Aceitar a escala de ${env.setores?.nome||'setor'} da semana de ${env.semana_inicio.slice(8,10)}/${env.semana_inicio.slice(5,7)}? Ela substitui a escala publicada desta semana.`)) return;

  if(e0){ alert('Erro ao ler rascunho: '+e0.message); return; }

  const { error:e1 }=await sb.from('escala').delete().eq('setor_id',env.setor_id).gte('data',ini).lte('data',fim);
  if(e1){ alert('Erro ao limpar escala: '+e1.message); return; }

/* ---- estrutura por hora ---- */
const hToNum=t=>{ if(!t)return null; const[a,b]=String(t).split(':'); return (+a)+((+b||0)/60); };
function horasOperacao(){ let minS=24,maxE=0,any=false;
  (S.escala||[]).forEach(r=>{ if(r.status==='trabalha'&&r.entrada&&r.saida){ any=true; let s=hToNum(r.entrada),e=hToNum(r.saida); if(e<=s)e+=24; minS=Math.min(minS,Math.floor(s)); maxE=Math.max(maxE,Math.ceil(e)); }});
  if(!any){ minS=11; maxE=24; } if(maxE-minS>24)maxE=minS+24;
  const hrs=[]; for(let h=minS;h<maxE;h++) hrs.push(((h%24)+24)%24); return hrs; }
function coversHora(r,h){ if(r.status!=='trabalha'||!r.entrada||!r.saida)return false; let s=hToNum(r.entrada),e=hToNum(r.saida); if(e<=s)e+=24; return (h>=s&&h<e)||(h+24>=s&&h+24<e); }
function contaHora(data,h){ return (S.escala||[]).filter(r=>r.data===data&&coversHora(r,h)).length; }
function metaHora(setor,dow,h){ const m=(S.escalaMetaHora||[]).find(x=>x.setor_id===setor&&x.dow===dow&&x.hora===h); return m?Number(m.meta):0; }
window.escSalvarMetaHora=async function(setor,dow,h,v){ v=+v||0; const ex=(S.escalaMetaHora||[]).find(x=>x.setor_id===setor&&x.dow===dow&&x.hora===h);
  if(ex){ await sb.from('escala_meta_hora').update({meta:v}).eq('id',ex.id); S.escalaMetaHora=S.escalaMetaHora.map(x=>x.id===ex.id?{...x,meta:v}:x); }
  else { const {data}=await sb.from('escala_meta_hora').insert({restaurante_id:1,setor_id:setor,dow,hora:h,meta:v}).select('*').single(); if(data){S.escalaMetaHora=S.escalaMetaHora||[];S.escalaMetaHora.push(data);} }
  render();
};
window.escSetMetaDow=function(v){ escMetaDow=+v; render(); };
function semanasMes(){ const first=new Date(escAno,escMes-1,1),last=new Date(escAno,escMes,0);
  let d=new Date(first); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); const ws=[];
  while(d<=last){ ws.push([...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(x.getDate()+i);return x.toISOString().slice(0,10);})); d.setDate(d.getDate()+7);} return ws; }
function pessoasEsc(){ const m={}; (S.escala||[]).forEach(r=>{ if(r.nome&&!m[r.nome]) m[r.nome]={nome:r.nome,funcionario_id:r.funcionario_id,cargo:r.cargo}; });
  return Object.values(m).sort((a,b)=>(a.cargo||'').localeCompare(b.cargo||'')||a.nome.localeCompare(b.nome)); }
function celEsc(nome,data){ return (S.escala||[]).find(r=>r.nome===nome&&r.data===data); }
function contaPer(data,per){ return (S.escala||[]).filter(r=>r.data===data&&r.status==='trabalha'&&(r.periodo===per||r.periodo==='ambos')).length; }
function minPer(dow,per){ const m=(S.escalaMin||[]).find(x=>x.dow===dow&&x.periodo===per); return m?Number(m.minimo):0; }

window.escSetSetor=function(v){ escSetor=+v; escSemanaIdx=0; carregarEscala().then(render); };
window.escMudaMes=function(delta){ let m=escMes+delta,a=escAno; if(m<1){m=12;a--;} if(m>12){m=1;a++;} escMes=m;escAno=a;escSemanaIdx=0; carregarEscala().then(render); };
window.escSemana=function(i){ const ws=semanasMes(); escSemanaIdx=Math.max(0,Math.min(ws.length-1,i)); render(); };
window.escEditar=function(nome,data){ const p=pessoasEsc().find(x=>x.nome===nome)||{}; const c=celEsc(nome,data)||{}; escEdit={nome,data,funcionario_id:p.funcionario_id,cargo:p.cargo,status:c.status||'trabalha',entrada:c.entrada||'',saida:c.saida||'',periodo:c.periodo||'almoco'}; paintModals(); };
window.escFechar=function(){ escEdit=null; paintModals(); };
window.escSalvar=async function(){
  const e=escEdit; const status=val('ec_status');
  const rec={status, entrada:status==='trabalha'?(val('ec_ent')||null):null, saida:status==='trabalha'?(val('ec_sai')||null):null, periodo:status==='trabalha'?(val('ec_per')||null):null, updated_at:new Date().toISOString()};
  const ex=celEsc(e.nome,e.data);
  if(ex){ await sb.from('escala').update(rec).eq('id',ex.id); }
  else { await sb.from('escala').insert({restaurante_id:1,setor_id:escSetor,nome:e.nome,funcionario_id:e.funcionario_id||null,cargo:e.cargo||null,data:e.data,...rec}); }
  escEdit=null; await carregarEscala(); render();
};
window.escAddPessoa=async function(){
  const fid=val('ep_func'); const f=fid?S.funcionarios.find(x=>String(x.id)===fid):null;
  const nome=f?f.nome:(val('ep_nome')||'').trim(); if(!nome){ alert('Escolha um funcionário ou digite um nome.'); return; }
  if(pessoasEsc().some(p=>p.nome.toUpperCase()===nome.toUpperCase())){ alert('Essa pessoa já está na escala.'); return; }
  const dias=semanasMes()[escSemanaIdx]||[];
  const rows=dias.map(d=>({restaurante_id:1,setor_id:escSetor,nome,funcionario_id:f?f.id:null,cargo:f?(f.cargos&&f.cargos.nome||null):null,data:d,status:'folga'}));
  await sb.from('escala').insert(rows); await carregarEscala(); render();
};
window.escRemovePessoa=async function(nome){ if(!confirm('Remover '+nome+' desta semana?'))return; const dias=semanasMes()[escSemanaIdx]||[]; await sb.from('escala').delete().eq('setor_id',escSetor).eq('nome',nome).in('data',dias); await carregarEscala(); render(); };
window.escSalvarMin=async function(dow,per,v){ v=+v||0; const ex=(S.escalaMin||[]).find(x=>x.dow===dow&&x.periodo===per);
  if(ex){ await sb.from('escala_minimo').update({minimo:v}).eq('id',ex.id); S.escalaMin=S.escalaMin.map(x=>x.id===ex.id?{...x,minimo:v}:x); }
  else { const {data}=await sb.from('escala_minimo').insert({restaurante_id:1,setor_id:escSetor,dow,periodo:per,minimo:v}).select('*').single(); if(data){S.escalaMin=S.escalaMin||[];S.escalaMin.push(data);} }
  render();
};

function escEditorHTML(){ if(!escEdit)return ''; const e=escEdit; const so=(v,l)=>`<option value="${v}" ${e.status===v?'selected':''}>${l}</option>`; const po=(v,l)=>`<option value="${v}" ${e.periodo===v?'selected':''}>${l}</option>`;
  const d=new Date(e.data+'T00:00:00');
  return `<div onclick="escFechar()" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4"><div onclick="event.stopPropagation()" class="bg-white rounded-xl shadow-xl w-full max-w-sm p-5">

    ${e.status==='trabalha'?`<div class="grid grid-cols-2 gap-2 mb-3"><div><label class="text-xs text-slate-500 block mb-1">Entrada</label><input id="ec_ent" type="time" value="${e.entrada}" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div><div><label class="text-xs text-slate-500 block mb-1">Saída</label><input id="ec_sai" type="time" value="${e.saida}" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div></div>
    <label class="text-xs text-slate-500 block mb-1">Período</label><select id="ec_per" class="w-full px-2 py-2 border border-slate-200 rounded text-sm mb-3">${po('almoco','Almoço')}${po('jantar','Jantar')}${po('ambos','Almoço e Jantar')}</select>`:''}

  </div></div>`;

  const aprovBox = envios.length ? card(`<div class="p-4 border-2 border-amber-300 bg-amber-50/50">
      <div class="flex items-center gap-2 mb-2"><i data-feather="inbox" class="w-5 h-5 text-amber-600"></i><h3 class="font-bold text-amber-800">Escalas enviadas pelos líderes — aprovação <span class="badge bg-amber-200 text-amber-800 ml-1">${envios.length}</span></h3></div>
      <div class="space-y-2">${envios.map(en=>{ const cells=rpend.filter(r=>r.setor_id===en.setor_id&&r.semana_inicio===en.semana_inicio); const np=new Set(cells.map(c=>c.nome)).size; const nt=cells.filter(c=>c.status==='trabalha').length; const dom=addDias(en.semana_inicio,6);
        return `<div class="flex items-center justify-between gap-2 p-2 bg-white border border-amber-200 rounded flex-wrap">
          <div class="text-sm"><strong>${en.setores?.nome||('Setor '+en.setor_id)}</strong> · semana ${en.semana_inicio.slice(8,10)}/${en.semana_inicio.slice(5,7)}–${dom.slice(8,10)}/${dom.slice(5,7)} <span class="text-slate-400">· ${np} pessoas · ${nt} turnos</span><br><span class="text-[11px] text-slate-400">enviado por ${en.enviado_por||'—'}${en.enviado_em?' · '+new Date(en.enviado_em).toLocaleDateString('pt-BR'):''}</span></div>
          ${podeAceitar?`<div class="flex gap-2"><button onclick="aceitarEscala(${en.id})" class="px-3 py-1.5 bg-green-600 text-white rounded text-xs font-medium hover:bg-green-700 flex items-center gap-1"><i data-feather="check" class="w-3.5 h-3.5"></i>Aceitar</button><button onclick="rejeitarEscala(${en.id})" class="px-3 py-1.5 bg-rose-100 text-rose-700 rounded text-xs font-medium hover:bg-rose-200">Rejeitar</button></div>`:'<span class="badge bg-amber-100 text-amber-700">aguardando GG</span>'}
        </div>`;}).join('')}</div>
      <p class="text-[11px] text-amber-700 mt-2">Aceitar <strong>substitui</strong> a escala publicada daquela semana/setor pela versão enviada pelo líder (na página externa "Montar Escala").</p></div>`,'mb-4') : '';
  return pageHeader('Escala','Monte e otimize a escala por setor, semana e período · BETA')+aprovBox+nav+addBox+grid
    +`<div class="mt-4">${estruturaBox}</div>`
    +`<div class="mt-4">${metaBox}</div>`
    +`<div class="mt-4">${sugBox}</div>`
    +`<div class="mt-4">${folgBox}</div>`;
};
</script>
</body>
