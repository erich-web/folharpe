function setorBadge(s){
  const c={'Salão':'bg-blue-100 text-blue-700','Cozinha':'bg-orange-100 text-orange-700','Bar':'bg-purple-100 text-purple-700','Porta':'bg-teal-100 text-teal-700','Escritório':'bg-slate-200 text-slate-700','Liderança':'bg-amber-100 text-amber-700','Outros':'bg-slate-100 text-slate-600'}[s]||'bg-slate-100 text-slate-600';
  return `<span class="badge ${c}">${s||'—'}</span>`;
}
function card(inner, cls=''){ return `<div class="bg-white rounded-lg border border-slate-200 ${cls}">${inner}</div>`; }
function pageHeader(t, s){ return `<div class="mb-6"><h1 class="text-3xl font-bold text-slate-900 mb-1">${t}</h1><p class="text-slate-500 text-sm">${s||''}</p></div>`; }

/* datas / ciclos */
const MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOWF=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function stripT(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function fmtData(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function fmtDM(d){ return `${String(d.getDate()).padStart(2,'0')}/${MES_ABR[d.getMonth()]}`; }
function nthBusinessDay(ano,mes,n){ let d=new Date(ano,mes-1,1),c=0; while(c<n){const w=d.getDay(); if(w!==0&&w!==6)c++; if(c<n)d.setDate(d.getDate()+1);} return d; }
function dataPagamento(c,ano,mes){ return c.pag_tipo==='util'?nthBusinessDay(ano,mes,c.pag_n):new Date(ano,mes-1,c.pag_dia); }
function janelaApur(c,ano,mes){ return {ini:new Date(ano,mes-1+c.apur_ini_off,c.apur_ini_dia), fim:new Date(ano,mes-1+c.apur_fim_off,c.apur_fim_dia)}; }
function proximoPagamento(hoje){
  const base=hoje.getFullYear()*12+hoje.getMonth(); const cands=[];
  for(let k=-1;k<=4;k++){const ym=base+k,ano=Math.floor(ym/12),mes=ym%12+1; S.ciclos.forEach(c=>cands.push({c,dp:dataPagamento(c,ano,mes),jan:janelaApur(c,ano,mes)}));}
  const h=stripT(hoje); return cands.filter(x=>stripT(x.dp)>=h).sort((a,b)=>a.dp-b.dp)[0];
}

sb.auth.onAuthStateChange((_e, session)=>{ S.session=session; if(session){ carregarDados().then(render); } else { render(); } });

async function entrar(){

  const email=val('login_email'), senha=val('login_senha');
  const { error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error){ S.erro=traduzErro(error.message); render(); }
}
async function cadastrarUsuario(){
  S.erro=null;
  const email=val('login_email'), senha=val('login_senha');
  const { error } = await sb.auth.signUp({ email, password:senha });
  if(error){ S.erro=traduzErro(error.message); } else { S.erro='Conta criada. Se pedir confirmação por e-mail, confirme e faça login (ou desative a confirmação no painel do Supabase).'; }
  render();
}
async function sair(){ await sb.auth.signOut(); S.restaurante=null; }
function traduzErro(m){
  if(/Invalid login/i.test(m)) return 'E-mail ou senha inválidos.';
  if(/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Confirme pelo link enviado ou desative a confirmação no painel do Supabase.';
  if(/already registered/i.test(m)) return 'Esse e-mail já tem conta. Faça login.';
  return m;
}

/* ===================== CARREGAR DADOS ===================== */
async function carregarDados(){
  S.loading=true; render();
  try{
    const r = await sb.from('restaurantes').select('*').order('id').limit(1).single();
    S.restaurante = r.data;
    const rid = S.restaurante?.id;
    const [cfg, set, car, fun, rat, rank, cic, per, ext, pag] = await Promise.all([
      sb.from('config_remuneracao').select('*').eq('restaurante_id',rid).single(),
      sb.from('setores').select('*').eq('restaurante_id',rid).order('ordem'),
      sb.from('cargos').select('*, setores(nome)').eq('restaurante_id',rid).order('pontos',{ascending:false}),
      sb.from('funcionarios').select('*, cargos(nome,pontos,setor_id,setores(nome))').eq('restaurante_id',rid).order('nome'),
      sb.from('config_rateio').select('*, setores(nome)').eq('restaurante_id',rid),
      sb.from('ranking_premio').select('*').eq('restaurante_id',rid).order('colocacao'),
      sb.from('ciclos_pagamento').select('*').eq('restaurante_id',rid).order('ordem'),
      sb.from('periodos').select('*, ciclos_pagamento(nome)').eq('restaurante_id',rid).order('data_inicio',{ascending:false}),
      sb.from('extras').select('*, setores(nome)').eq('restaurante_id',rid).order('data'),
      sb.from('pagamentos').select('*, periodos(data_inicio,data_fim,ano)').eq('restaurante_id',rid).order('data_pagamento',{ascending:false}),
    ]);
    S.config=cfg.data; S.setores=set.data||[]; S.cargos=car.data||[]; S.funcionarios=fun.data||[];
    S.rateio=rat.data||[]; S.ranking=rank.data||[]; S.ciclos=cic.data||[];
    S.periodos=per.data||[]; S.extras=ext.data||[]; S.pagamentos=pag.data||[];
    const prof=await sb.from('profiles').select('*').eq('id',S.session.user.id).single(); S.perfil=prof.data;
    if(S.perfil?.papel==='admin'){ const us=await sb.from('profiles').select('*').order('email'); S.usuarios=us.data||[]; }
    if(!S.periodoAtual && S.periodos.length) S.periodoAtual=S.periodos[0];
    if(S.periodoAtual) S.periodoAtual=S.periodos.find(p=>p.id===S.periodoAtual.id)||S.periodos[0]||null;
    await carregarPonto();
    S.erro=null;
  }catch(e){ S.erro='Erro ao carregar dados: '+(e.message||e); }
  S.loading=false;
}
async function carregarPonto(){
  if(!S.periodoAtual){ S.ponto=[]; S.rankingPeriodo=[]; return; }
  const [pt, rp] = await Promise.all([
    sb.from('controle_ponto').select('*').eq('periodo_id',S.periodoAtual.id),
    sb.from('ranking_periodo').select('*').eq('periodo_id',S.periodoAtual.id),
  ]);
  S.ponto=pt.data||[]; S.rankingPeriodo=rp.data||[];
}
async function selectPeriodo(id){
  S.periodoAtual=S.periodos.find(p=>p.id===+id)||null;
  await carregarPonto(); render();
}
function diasEntre(ini,fim){ return Math.round((stripT(new Date(fim+'T00:00:00'))-stripT(new Date(ini+'T00:00:00')))/86400000)+1; }
function ymdStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
async function criarPeriodo(){
  const cicloId=+val('np_ciclo'), ano=+val('np_ano'), mes=+val('np_mes');
  const c=S.ciclos.find(x=>x.id===cicloId); if(!c){ alert('Escolha um ciclo.'); return; }
  const jan=janelaApur(c,ano,mes); const dp=dataPagamento(c,ano,mes);
  const ini=ymdStr(jan.ini), fim=ymdStr(jan.fim);
  const rec={ restaurante_id:S.restaurante.id, ciclo_id:cicloId, ano, mes, data_inicio:ini, data_fim:fim,
    data_pagamento:ymdStr(dp), dias_periodo:diasEntre(ini,fim), taxa_servico_total:0, retencao_pct:Number(S.config.retencao_casa_pct)||33, status:'aberto' };
  const { data, error }=await sb.from('periodos').insert(rec).select('*, ciclos_pagamento(nome)').single();
  if(error){ alert('Erro ao criar período: '+error.message); return; }
  S.periodoAtual=data; await carregarDados(); render();
}
async function salvarCampoPeriodo(campo,valor){
  if(!S.periodoAtual) return;
  await sb.from('periodos').update({[campo]:valor}).eq('id',S.periodoAtual.id);
  S.periodoAtual[campo]=valor;
}

function viewDashboard(){
  const px = S.ciclos.length ? proximoPagamento(new Date()) : null;
  const dias = px ? Math.round((stripT(px.dp)-stripT(new Date()))/86400000) : 0;
  const proximo = px ? card(`<div class="p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white">
      <div class="flex items-start justify-between">
        <div><p class="text-xs font-semibold text-blue-100 mb-1 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4"></i>PRÓXIMO PAGAMENTO · ${px.c.nome}</p>
          <p class="text-3xl font-bold">${fmtData(px.dp)}</p>
          <p class="text-sm text-blue-100 mt-1 capitalize">${DOWF[px.dp.getDay()]} · ${dias===0?'hoje':dias===1?'amanhã':'em '+dias+' dias'}</p></div>
        <div class="text-right"><p class="text-xs text-blue-100">Período de apuração</p><p class="text-lg font-bold">${fmtDM(px.jan.ini)} a ${fmtDM(px.jan.fim)}</p></div>
      </div></div>`,'mb-6 border-0 overflow-hidden') : '';
  const kpis=[
    ['COLABORADORES', S.funcionarios.length, 'cadastrados ativos','text-slate-900'],
    ['SETORES', S.setores.length, 'configurados','text-blue-600'],
    ['CARGOS', S.cargos.length, 'na tabela de pontos','text-slate-900'],
    ['CICLOS DE PAGAMENTO', S.ciclos.length, 'configurados','text-green-600'],
  ];
  return pageHeader('Dashboard', `Bem-vindo · ${S.restaurante?.nome||''}`)
    + proximo
    + `<div class="grid grid-cols-4 gap-4">${kpis.map(k=>card(`<div class="p-6"><p class="text-xs text-slate-500 font-semibold mb-2">${k[0]}</p><p class="text-2xl font-bold ${k[3]}">${k[1]}</p><p class="text-xs text-slate-400 mt-2">${k[2]}</p></div>`)).join('')}</div>`
    + `<div class="mt-4">${card(`<div class="p-6"><h3 class="font-bold mb-3 flex items-center gap-2"><i data-feather="info" class="w-4 h-4 text-blue-600"></i>Status do sistema</h3>

}

}
function fecharModal(){ modalCad=null; render(); }
async function salvarCadastro(){
  const d={ nome:val('cad_nome').trim(), cargo_id:+val('cad_cargo'), status:val('cad_status'), regime:val('cad_regime'),
    salario:+val('cad_salario')||0, minimo_garantido:+val('cad_minimo')||0, adiantamento:val('cad_adiantamento')==='sim', beneficios:+val('cad_beneficios')||0,
    restaurante_id:S.restaurante.id };
  if(!d.nome){ alert('Informe o nome.'); return; }
  let err;
  if(modalCad.id==null){ ({error:err}=await sb.from('funcionarios').insert(d)); }

        <div class="text-slate-500">pagamento: ${c.pag_tipo==='util'?c.pag_n+'º dia útil':'dia '+c.pag_dia}</div>

window.salvarConfig = async function(){
  const v=id=>+(document.getElementById(id)||{}).value||0;
  // config_remuneracao
  const dentro=v('cf_dentro');
  const upd={ desconto_falta_pct:v('cf_falta'), desconto_atraso_pct:v('cf_atraso'), desconto_advertencia_pct:v('cf_adv'),
    valor_dobra:v('cf_dobra'), valor_extra_diaria:v('cf_extra'), retencao_casa_pct:v('cf_retencao'),
    holerite_dentro_pct:dentro, holerite_fora_pct:100-dentro, desc_extras_pct:v('cf_descextras'), limite_he_dia_horas:v('cf_he'), updated_at:new Date().toISOString() };
  let e1=(await sb.from('config_remuneracao').update(upd).eq('id',S.config.id)).error;
  // rateio por setor
  for(const s of S.setores){ const r=S.rateio.find(x=>x.tipo==='setor'&&x.setor_id===s.id); const pct=v('cr_'+s.id);
    if(r) await sb.from('config_rateio').update({percentual:pct}).eq('id',r.id);
    else await sb.from('config_rateio').insert({restaurante_id:S.restaurante.id,tipo:'setor',setor_id:s.id,percentual:pct}); }
  const rk=S.rateio.find(x=>x.tipo==='ranking'); const rkv=v('cr_ranking');
  if(rk) await sb.from('config_rateio').update({percentual:rkv}).eq('id',rk.id);

<script>
/* ===================== COMISSÃO QUINZENAL (motor real) ===================== */
function agregaPonto(funcId){
  const cnt={Falta:0,Atraso:0,'Advertência':0,Dobra:0,Extra:0,Normal:0,Folga:0,Atestado:0};
  S.ponto.filter(p=>p.funcionario_id===funcId).forEach(p=>{ cnt[p.status]=(cnt[p.status]||0)+1; });
  return cnt;
}
function calcComissao(){
  const p=S.periodoAtual, cfg=S.config; if(!p||!cfg) return null;
  const dias=Number(p.dias_periodo)||16;
  const taxaTotal=Number(p.taxa_servico_total)||0;
  const retPct=Number(p.retencao_pct)||0;
  const retencao=taxaTotal*retPct/100;
  const extrasAprov=S.extras.filter(e=>e.status==='Aprovado' && e.periodo_id===p.id);
  const extrasTotal=extrasAprov.reduce((a,e)=>a+e.quantidade*Number(e.diaria),0);
  const extrasDesc=extrasTotal*Number(cfg.desc_extras_pct)/100;
  const distribuida=taxaTotal-retencao-extrasDesc;
  const ratePct={}; S.setores.forEach(s=>{const r=S.rateio.find(x=>x.tipo==='setor'&&x.setor_id===s.id);ratePct[s.nome]=Number(r?.percentual||0);});
  const rankingPct=Number((S.rateio.find(x=>x.tipo==='ranking')||{}).percentual||0);
  const rankBucket=distribuida*rankingPct/100;
  const bonusByFunc={}; S.rankingPeriodo.forEach(rp=>{ const prem=S.ranking.find(x=>x.colocacao===rp.colocacao); if(prem) bonusByFunc[rp.funcionario_id]=rankBucket*Number(prem.percentual)/100; });

  const rows=S.funcionarios.map(f=>{
    const cg=f.cargos||{}; const base=Number(cg.pontos||0); const setor=cg.setores?.nome||'Outros';
    const c=agregaPonto(f.id); const falta=c.Falta,atraso=c.Atraso,adv=c['Advertência'];
    const diasTrab=Math.max(0,dias-falta);
    const Z=(diasTrab/dias)*base;
    let desc=Z*(falta*Number(cfg.desconto_falta_pct)/100 + atraso*Number(cfg.desconto_atraso_pct)/100 + adv*Number(cfg.desconto_advertencia_pct)/100);
    desc=Math.min(desc,Z);
    let finais=Z-desc; if(finais>0&&finais<0.1)finais=0.1; if(diasTrab===0)finais=0;
    return {f,setor,base,falta,atraso,adv,Z,desc,finais,recebeRepique:desc<=0};
  });
  const somaZ={},somaDesc={},somaFinQ={}; S.setores.forEach(s=>{somaZ[s.nome]=0;somaDesc[s.nome]=0;somaFinQ[s.nome]=0;});
  rows.forEach(r=>{somaZ[r.setor]+=r.Z;somaDesc[r.setor]+=r.desc;if(r.recebeRepique)somaFinQ[r.setor]+=r.finais;});
  const rsPonto={},pool={},rsRep={};
  S.setores.forEach(s=>{const b=distribuida*(ratePct[s.nome]||0)/100; rsPonto[s.nome]=somaZ[s.nome]>0?b/somaZ[s.nome]:0; pool[s.nome]=somaDesc[s.nome]*rsPonto[s.nome]; rsRep[s.nome]=somaFinQ[s.nome]>0?pool[s.nome]/somaFinQ[s.nome]:0;});
  rows.forEach(r=>{
    r.comissao=r.finais*rsPonto[r.setor];
    r.repique=r.recebeRepique?r.finais*rsRep[r.setor]:0;
    r.ranking=bonusByFunc[r.f.id]||0;
    r.comTotal=r.comissao+r.repique+r.ranking;
    const bruto=Number(r.f.salario)+r.comTotal+Number(r.f.beneficios||0);
    r.minComp=Math.max(0,Number(r.f.minimo_garantido||0)-bruto);
    r.total=bruto+r.minComp;
    r.pagoDentro=Number(r.f.salario)+Number(r.f.beneficios||0)+r.minComp+r.comTotal*Number(cfg.holerite_dentro_pct)/100;
    r.pagoFora=r.comTotal*Number(cfg.holerite_fora_pct)/100;
  });
  return {dias,taxaTotal,retencao,retPct,extrasTotal,extrasDesc,distribuida,rows,rsPonto,
    bucketRanking:distribuida*rankingPct/100,
    totalComissao:rows.reduce((a,r)=>a+r.comTotal,0), totalFolha:rows.reduce((a,r)=>a+r.total,0)};
}

function seletorPeriodo(){
  const anoAtual=new Date().getFullYear();
  const opts=S.periodos.map(p=>`<option value="${p.id}" ${S.periodoAtual&&p.id===S.periodoAtual.id?'selected':''}>${p.ciclos_pagamento?.nome||'Período'} · ${fmtDM(new Date(p.data_inicio+'T00:00:00'))}–${fmtDM(new Date(p.data_fim+'T00:00:00'))}/${p.ano}</option>`).join('');
  return card(`<div class="p-4 flex flex-wrap items-center gap-3">
      <span class="text-sm font-semibold text-slate-700 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>Período</span>
      ${S.periodos.length?`<select onchange="selectPeriodo(this.value)" class="px-3 py-2 border border-slate-200 rounded text-sm">${opts}</select>`:'<span class="text-sm text-slate-400">nenhum período criado</span>'}

      <span class="text-xs text-slate-500">Novo:</span>
      <select id="np_ciclo" class="px-2 py-2 border border-slate-200 rounded text-sm">${S.ciclos.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select>
      <input id="np_mes" type="number" min="1" max="12" value="${new Date().getMonth()+1}" class="w-16 px-2 py-2 border border-slate-200 rounded text-sm" title="mês">
      <input id="np_ano" type="number" value="${anoAtual}" class="w-24 px-2 py-2 border border-slate-200 rounded text-sm" title="ano">
      <button onclick="criarPeriodo()" class="px-3 py-2 bg-slate-700 text-white rounded text-sm hover:bg-slate-800 flex items-center gap-1"><i data-feather="plus" class="w-4 h-4"></i>Criar período</button>`:''}
    </div>`,'mb-4');
}

window._viewComissao = function(){
  const header = pageHeader('Cálculo da Comissão Quinzenal','Cascata da taxa, rateio por setor, repique e holerite — dados reais');
  if(!S.periodoAtual){

  const inp=(lb,val,onch,suf='')=>`<div><label class="text-xs font-medium text-slate-500 block mb-1">${lb}</label><div class="flex items-center gap-1"><input type="number" step="0.01" value="${val}" onchange="${onch}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm text-right">${suf?`<span class="text-slate-400 text-sm">${suf}</span>`:''}</div></div>`;

      <div class="grid grid-cols-4 gap-4 mb-4">
        ${inp('Taxa de Serviço Total (R$)', c.taxaTotal, "salvarCampoPeriodo('taxa_servico_total',+this.value).then(()=>render())")}
        ${inp('Retenção da casa', c.retPct, "salvarCampoPeriodo('retencao_pct',+this.value).then(()=>render())",'%')}
        <div><label class="text-xs font-medium text-slate-500 block mb-1">Gasto com extras (R$)</label><div class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded text-sm text-right">${money(c.extrasDesc)}</div><p class="text-[10px] text-slate-400 mt-1">${num(S.config.desc_extras_pct,0)}% de ${money(c.extrasTotal)}</p></div>
        <div><label class="text-xs font-medium text-slate-500 block mb-1">Dias do período</label><div class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded text-sm text-right">${c.dias}</div></div>
      </div>
      <div class="grid grid-cols-3 gap-4">
        <div class="p-3 bg-slate-50 rounded"><p class="text-xs text-slate-500">Retenção</p><p class="font-bold text-slate-700">${money(c.retencao)}</p></div>
        <div class="p-3 bg-blue-50 rounded"><p class="text-xs text-slate-500">Taxa Distribuída</p><p class="font-bold text-blue-700">${money(c.distribuida)}</p></div>
        <div class="p-3 bg-green-50 rounded"><p class="text-xs text-slate-500">Total em comissões</p><p class="font-bold text-green-700">${money(c.totalComissao)}</p></div>
      </div></div>`,'mb-4')
  + card(`<div class="p-6"><h3 class="font-bold mb-3 flex items-center gap-2"><i data-feather="hash" class="w-4 h-4 text-blue-600"></i>R$ por ponto, por setor</h3>
      <div class="grid grid-cols-7 gap-2 text-center text-sm">${S.setores.map(s=>`<div class="p-2 bg-slate-50 rounded"><p class="text-xs text-slate-500">${s.nome}</p><p class="font-bold text-slate-800">${money(c.rsPonto[s.nome])}</p></div>`).join('')}</div></div>`,'mb-4')
  + `<div class="flex justify-end gap-2 mb-3">
       <button onclick="exportComissaoCSV()" class="px-4 py-2 bg-green-600 text-white rounded text-sm font-medium hover:bg-green-700 flex items-center gap-2"><i data-feather="download" class="w-4 h-4"></i>Exportar CSV</button>
       ${podeEscrever('comissao')?`<button onclick="salvarResultadoComissao()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-2"><i data-feather="save" class="w-4 h-4"></i>Salvar fechamento</button>`:''}
     </div>`
  + card(`<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600 border-b border-slate-200"><tr>

<script>
/* ===================== FOLHA DE PONTO (grade editável, grava no banco) ===================== */
const ST_PONTO=['Normal','Falta','Atraso','Dobra','Folga','Advertência','Atestado','Extra','Férias','Afastamento'];
const ST_AB={'Normal':['N','text-green-700'],'Falta':['F','bg-red-100 text-red-700 font-bold'],'Atraso':['A','bg-orange-100 text-orange-700 font-bold'],'Dobra':['D','bg-purple-100 text-purple-700 font-bold'],'Folga':['Fg','text-slate-400'],'Advertência':['Ad','bg-rose-100 text-rose-700 font-bold'],'Atestado':['At','bg-amber-100 text-amber-700'],'Extra':['E','bg-blue-100 text-blue-700 font-bold'],'Férias':['Fé','bg-teal-100 text-teal-700'],'Afastamento':['Af','bg-slate-200 text-slate-600']};
const DOW1=['D','S','T','Q','Q','S','S'];
function diasDoPeriodo(p){ const out=[]; let d=new Date(p.data_inicio+'T00:00:00'); const fim=new Date(p.data_fim+'T00:00:00'); let g=0; while(d<=fim && g<40){ out.push(new Date(d)); d.setDate(d.getDate()+1); g++; } return out; }
function statusDe(funcId, ds){ const r=S.ponto.find(p=>p.funcionario_id===funcId && p.data===ds); return r?r.status:'Normal'; }
function fmtMin(min){ const s=min<0?'-':'+'; const a=Math.abs(Math.round(min)); return `${s}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`; }
function bancoFunc(funcId){
  const limMin=(Number(S.config?.limite_he_dia_horas)||2)*60; let banco=0,pagar=0;
  S.ponto.filter(p=>p.funcionario_id===funcId).forEach(p=>{ const min=Number(p.banco_minutos)||0;
    if(min>limMin){ pagar+=min; } else { banco+=min; } });
  return { banco, pagar };
}
window.salvarLimiteHE = async function(v){ const val=+v||0; await sb.from('config_remuneracao').update({limite_he_dia_horas:val}).eq('id',S.config.id); S.config.limite_he_dia_horas=val; render(); };

window._viewPonto = function(){
  const header=pageHeader('Folha de Ponto','Grade da equipe por período — status dia a dia (grava no banco)');
  if(!S.periodoAtual) return header + seletorPeriodo() + card(`<div class="p-12 text-center text-slate-400"><i data-feather="calendar" class="w-10 h-10 mx-auto mb-3"></i><p class="text-sm">Crie/selecione um período para lançar o ponto.</p></div>`);
  const p=S.periodoAtual; const dias=diasDoPeriodo(p);
  const opts=ST_PONTO.map(s=>`<option value="${s}">${s}</option>`).join('');
  const head=`<tr><th class="px-3 py-2 text-left sticky left-0 bg-slate-50 z-10">Funcionário</th>${
      dias.map(d=>`<th class="px-1 py-2 text-[10px] font-medium ${[0,6].includes(d.getDay())?'text-blue-500':'text-slate-500'}">${String(d.getDate()).padStart(2,'0')}<br>${DOW1[d.getDay()]}</th>`).join('')
    }<th class="px-2 py-2 bg-slate-100">Falt</th><th class="px-2 py-2 bg-slate-100">Atr</th><th class="px-2 py-2 bg-slate-100">Banco</th><th class="px-2 py-2 bg-slate-100">HE pagar</th></tr>`;
  const body=S.funcionarios.map(f=>{
    let fal=0,atr=0;
    const cells=dias.map(d=>{ const ds=ymdStr(d); const st=statusDe(f.id,ds); if(st==='Falta')fal++; if(st==='Atraso')atr++;
      const [ab,cl]=ST_AB[st]||['?',''];
      return `<td class="text-center p-0"><select onchange="setPonto(${f.id},'${ds}',this.value)" class="w-9 text-[11px] rounded border-0 bg-transparent text-center ${cl} cursor-pointer appearance-none" title="${st}">${ST_PONTO.map(s=>`<option value="${s}" ${s===st?'selected':''}>${ST_AB[s][0]}</option>`).join('')}</select></td>`;
    }).join('');
    const b=bancoFunc(f.id);
    return `<tr class="border-b border-slate-100 hover:bg-blue-50/30"><td class="px-3 py-1.5 font-medium text-slate-800 sticky left-0 bg-white whitespace-nowrap">${f.nome.split(' ').slice(0,2).join(' ')}</td>${cells}
      <td class="text-center bg-slate-50 font-semibold ${fal?'text-red-600':'text-slate-300'}">${fal||'0'}</td>
      <td class="text-center bg-slate-50 font-semibold ${atr?'text-orange-600':'text-slate-300'}">${atr||'0'}</td>
      <td class="text-center bg-slate-50 font-semibold ${b.banco?(b.banco>=0?'text-green-600':'text-red-600'):'text-slate-300'}">${b.banco?fmtMin(b.banco):'—'}</td>
      <td class="text-center bg-slate-50 font-bold ${b.pagar>0?'text-red-600':'text-slate-300'}">${b.pagar>0?fmtMin(b.pagar):'—'}</td></tr>`;
  }).join('');
  const limite=Number(S.config.limite_he_dia_horas)||2;
  return header + seletorPeriodo()
  + `<div class="mb-3 flex items-center gap-2 text-sm text-slate-600"><i data-feather="clock" class="w-4 h-4 text-blue-600"></i>Horas extras: acima de <input type="number" step="0.5" min="0" value="${limite}" onchange="salvarLimiteHE(this.value)" class="w-16 px-2 py-1 border border-slate-200 rounded text-right">h/dia → <span class="badge bg-red-100 text-red-700">pagar</span>; até o limite → <span class="badge bg-green-100 text-green-700">banco</span>. <span class="text-slate-400 text-xs">(banco vem da importação do cartão)</span></div>`
  + `<div class="p-4 mb-4 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between">
      <div class="flex items-center gap-3"><i data-feather="upload-cloud" class="w-5 h-5 text-blue-600"></i>
        <div><p class="text-sm font-medium text-slate-900">Importar Cartão de Ponto (Secullum PDF)</p><p class="text-xs text-slate-600">O sistema lê as batidas e sugere a escala. Você revisa antes de aplicar.</p></div></div>
      <label class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 cursor-pointer flex items-center gap-2"><i data-feather="upload-cloud" class="w-4 h-4"></i>Selecionar PDF<input type="file" accept="application/pdf" class="hidden" onchange="onSecullumFile(this)"></label>
    </div>`
  + (pontoImport ? viewImportPreview() : '')
  + card(`<div class="overflow-x-auto"><table class="w-full text-xs" style="border-collapse:collapse"><thead class="bg-slate-50 text-slate-600">${head}</thead><tbody>${body}</tbody></table></div>
      <div class="p-3 text-[11px] text-slate-500 border-t border-slate-200">Mude a letra de cada dia: ${Object.entries(ST_AB).map(([k,[ab,cl]])=>`<span class="inline-block px-1 rounded ${cl}">${ab}</span>=${k}`).join(' · ')}. As alterações gravam na hora e já entram no cálculo da Comissão.</div>`);
};
window.setPonto = async function(funcId, ds, status){
  const pid=S.periodoAtual.id;
  if(status==='Normal'){
    await sb.from('controle_ponto').delete().eq('funcionario_id',funcId).eq('periodo_id',pid).eq('data',ds);
    S.ponto=S.ponto.filter(p=>!(p.funcionario_id===funcId&&p.data===ds));
  } else {
    const ex=S.ponto.find(p=>p.funcionario_id===funcId&&p.data===ds);
    if(ex){ await sb.from('controle_ponto').update({status}).eq('id',ex.id); ex.status=status; }
    else { const {data,error}=await sb.from('controle_ponto').insert({funcionario_id:funcId,periodo_id:pid,data:ds,status,origem:'manual'}).select().single(); if(!error&&data) S.ponto.push(data); }
  }
  render();
};
</script>
<script>
/* ===================== EXTRAS (calendário + aprovação, grava no banco) ===================== */
const MESES_F=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
let extrasMes={ano:new Date().getFullYear(), mes:new Date().getMonth()+1};
function extrasDoDia(ds){ return S.extras.filter(e=>e.data===ds); }
async function reloadExtras(){ const {data}=await sb.from('extras').select('*, setores(nome)').eq('restaurante_id',S.restaurante.id).order('data'); S.extras=data||[]; }
window.mudarMesExtras=function(delta){ let m=extrasMes.mes+delta,a=extrasMes.ano; if(m<1){m=12;a--;} if(m>12){m=1;a++;} extrasMes={ano:a,mes:m}; render(); };
window.addExtra=async function(){
  const ds=val('ex_data'); if(!ds){ alert('Informe a data.'); return; }
  const per=S.periodos.find(p=> ds>=p.data_inicio && ds<=p.data_fim);
  const rec={ restaurante_id:S.restaurante.id, periodo_id:per?per.id:null, data:ds, setor_id:+val('ex_setor')||null,
    funcao:val('ex_funcao')||'Extra', quantidade:+val('ex_qtd')||1, diaria:+val('ex_diaria')||0, lider:val('ex_lider')||'', status:'Aprovado' };
  const { error }=await sb.from('extras').insert(rec); if(error){ alert('Erro: '+error.message); return; }
  const d=new Date(ds+'T00:00:00'); extrasMes={ano:d.getFullYear(), mes:d.getMonth()+1};
  await reloadExtras(); render();
};
window.setExtraStatus=async function(id,status){ await sb.from('extras').update({status}).eq('id',id); await reloadExtras(); render(); };
window.excluirExtra=async function(id){ if(!confirm('Excluir este extra?'))return; await sb.from('extras').delete().eq('id',id); await reloadExtras(); render(); };

window._viewExtras=function(){
  const {ano,mes}=extrasMes; const pref=`${ano}-${String(mes).padStart(2,'0')}`;
  const doMes=S.extras.filter(e=>e.data.startsWith(pref));
  const aprov=doMes.filter(e=>e.status==='Aprovado'); const pend=doMes.filter(e=>e.status==='Pendente');
  const totalQtd=aprov.reduce((a,e)=>a+e.quantidade,0); const custo=aprov.reduce((a,e)=>a+e.quantidade*Number(e.diaria),0);
  const diasComExtra=new Set(aprov.map(e=>e.data)).size;
  const kpis=[['EXTRAS CONTRATADOS',totalQtd,`em ${diasComExtra} dias`,'text-blue-600'],['CUSTO TOTAL',money(custo),'qtd × diária (aprovados)','text-slate-900'],['PENDENTES',pend.length,pend.length?'aguardando líder':'tudo aprovado',pend.length?'text-amber-600':'text-green-600'],['MÉDIA/DIA ATIVO',diasComExtra?(totalQtd/diasComExtra).toFixed(1):'0','extras/dia','text-slate-900']];
  const first=new Date(ano,mes-1,1); const startDow=first.getDay(); const dim=new Date(ano,mes,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++)cells.push(null); for(let d=1;d<=dim;d++)cells.push(d); while(cells.length%7)cells.push(null);
  const qtdDia=d=>extrasDoDia(`${pref}-${String(d).padStart(2,'0')}`).filter(e=>e.status==='Aprovado').reduce((a,e)=>a+e.quantidade,0);
  const maxQ=Math.max(1,...Array.from({length:dim},(_,i)=>qtdDia(i+1)));
  const calendar=card(`<div class="p-5">
      <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>${MESES_F[mes-1]} / ${ano}</h3>
        <div class="flex gap-1"><button onclick="mudarMesExtras(-1)" class="p-2 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-left" class="w-4 h-4"></i></button><button onclick="mudarMesExtras(1)" class="p-2 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-right" class="w-4 h-4"></i></button></div></div>
      <div class="grid grid-cols-7 gap-1.5 mb-1">${DOW3.map(d=>`<div class="text-center text-xs font-semibold ${['Dom','Sáb'].includes(d)?'text-blue-500':'text-slate-400'}">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1.5">${cells.map(d=>{ if(!d) return `<div class="h-20 rounded bg-slate-50/50"></div>`;
        const ds=`${pref}-${String(d).padStart(2,'0')}`; const itens=extrasDoDia(ds); const q=qtdDia(d);
        const cst=itens.filter(e=>e.status==='Aprovado').reduce((a,e)=>a+e.quantidade*Number(e.diaria),0);
        const hasPend=itens.some(e=>e.status==='Pendente'); const ratio=q/maxQ; const claro=q&&ratio>0.33;
        const bg=q===0?'bg-white':ratio>0.66?'bg-blue-600':ratio>0.33?'bg-blue-400':'bg-blue-100';
        const tip=itens.length?`title="${itens.map(e=>e.quantidade+'× '+e.funcao+' ('+(e.setores?.nome||'')+') — '+e.status).join('\\n').replace(/"/g,'')}"`:'';
        return `<div ${tip} class="h-20 rounded border border-slate-200 p-1.5 flex flex-col ${bg} ${q?'cursor-help':''}">
          <div class="flex justify-between items-start"><span class="text-xs font-semibold ${claro?'text-white':'text-slate-500'}">${d}</span>${hasPend?'<span class="w-2 h-2 rounded-full bg-amber-400"></span>':''}</div>
          ${q?`<div class="mt-auto"><div class="${claro?'text-white':'text-blue-700'} text-lg font-bold leading-none">${q}</div><div class="text-[9px] ${claro?'text-blue-100':'text-slate-400'}">${money(cst)}</div></div>`:''}
        </div>`;}).join('')}</div>
      <p class="text-[11px] text-slate-400 mt-3">Cor = quantidade de extras. Ponto âmbar = há pendência. Passe o mouse para detalhes.</p></div>`);
  const form=card(`<div class="p-5"><h3 class="font-bold text-slate-900 mb-1 flex items-center gap-2"><i data-feather="user-plus" class="w-4 h-4 text-blue-600"></i>Aprovar extra</h3>
      <p class="text-xs text-slate-500 mb-4">Lançamento do líder ao contratar um extra.</p>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-slate-500 block mb-1">Data</label><input id="ex_data" type="date" value="${ano}-${String(mes).padStart(2,'0')}-15" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Setor</label><select id="ex_setor" class="w-full px-2 py-2 border border-slate-200 rounded text-sm">${S.setores.map(s=>`<option value="${s.id}">${s.nome}</option>`).join('')}</select></div>
        <div><label class="text-xs text-slate-500 block mb-1">Função</label><input id="ex_funcao" placeholder="Garçom Extra" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Quantidade</label><input id="ex_qtd" type="number" min="1" value="1" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Diária (R$)</label><input id="ex_diaria" type="number" value="120" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
        <div><label class="text-xs text-slate-500 block mb-1">Líder</label><input id="ex_lider" placeholder="Nome do líder" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
      </div>
      <button onclick="addExtra()" class="mt-4 w-full px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center justify-center gap-2"><i data-feather="check" class="w-4 h-4"></i>Registrar e aprovar</button></div>`);
  const lista=card(`<div class="p-5"><h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i data-feather="list" class="w-4 h-4 text-blue-600"></i>Extras do mês</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600"><tr><th class="px-2 py-2 text-left">Data</th><th class="px-2 py-2 text-left">Setor</th><th class="px-2 py-2 text-left">Função</th><th class="px-2 py-2 text-center">Qtd</th><th class="px-2 py-2 text-right">Diária</th><th class="px-2 py-2 text-right">Total</th><th class="px-2 py-2 text-left">Líder</th><th class="px-2 py-2 text-center">Status</th><th class="px-2 py-2"></th></tr></thead><tbody>
      ${doMes.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(e=>`<tr class="border-b border-slate-100 hover:bg-blue-50/40">
        <td class="px-2 py-1.5 font-medium">${e.data.slice(8,10)}/${e.data.slice(5,7)}</td><td class="px-2 py-1.5">${setorBadge(e.setores?.nome)}</td><td class="px-2 py-1.5 text-slate-600">${e.funcao}</td>

        <td class="px-2 py-1.5 text-center">${e.status==='Aprovado'?'<span class="badge bg-green-100 text-green-700">Aprovado</span>':`<button onclick="setExtraStatus(${e.id},'Aprovado')" class="badge bg-amber-100 text-amber-700 hover:bg-amber-200">Aprovar ✓</button>`}</td>
        <td class="px-2 py-1.5 text-center"><button onclick="excluirExtra(${e.id})" class="text-red-400 hover:text-red-600"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button></td>
      </tr>`).join('')||'<tr><td colspan="9" class="text-center text-slate-400 py-6">Nenhum extra neste mês.</td></tr>'}
      </tbody></table></div>
      <div class="mt-3 text-[11px] text-slate-500 flex items-center gap-2"><i data-feather="link" class="w-3.5 h-3.5"></i>Custo dos aprovados (${money(custo)}) alimenta "Gasto com extras" na Comissão.</div></div>`);
  return pageHeader('Extras','Calendário de extras contratados — aprovados pelos líderes')
    + `<div class="grid grid-cols-4 gap-4 mb-5">${kpis.map(k=>card(`<div class="p-5"><p class="text-xs text-slate-500 font-semibold mb-2">${k[0]}</p><p class="text-2xl font-bold ${k[3]}">${k[1]}</p><p class="text-xs text-slate-400 mt-2">${k[2]}</p></div>`)).join('')}</div>`
    + `<div class="grid grid-cols-3 gap-4 mb-4"><div class="col-span-2">${calendar}</div><div>${form}</div></div>` + lista;
};

<script>
/* ===================== IMPORTAÇÃO CARTÃO SECULLUM (PDF via pdf.js) ===================== */
let pontoImport=null;   // {funcId, funcNomePDF, dias:[...], periodoTxt}
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function _tomin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function extrairLinhasPDF(tc){
  const ln={};
  tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (ln[y]=ln[y]||[]).push(it); });
  return Object.keys(ln).map(Number).sort((a,b)=>b-a)
    .map(y=> ln[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str).join(' ').replace(/\s+/g,' ').trim())
    .filter(Boolean).join('\n');
}
function parseSecullum(text){
  const linhas=text.split('\n'); const dias=[]; let periodoTxt='';
  linhas.forEach(l=>{
    const mp=l.match(/Per[ií]odo:\s*(\d{2}\/\d{2}\/\d{4}).*?(\d{2}\/\d{2}\/\d{4})/i); if(mp) periodoTxt=mp[1]+' a '+mp[2];
    const dm=l.match(/(\d{2})\/(\d{2})\/(\d{4})\s*-\s*(\S{3,4})\s+(.*)/);
    if(!dm) return;
    const dd=dm[1],mm=dm[2],yy=dm[3],wd=dm[4],rest=dm[5];
    let full=null; const r=rest.trim();
    if(/^Folga/i.test(r))full='Folga'; else if(/^Atestad/i.test(r))full='Atestado';
    else if(/^F[ée]ria/i.test(r))full='Férias'; else if(/^Afasta/i.test(r))full='Afastamento'; else if(/^Falta/i.test(r))full='Falta';
    const toks=(rest.match(/\d{2}:\d{2}/g)||[]); const punches=toks.slice(0,4);
    const saldos=(rest.match(/[+\-]\d{2}:\d{2}/g)||[]);
    let horas=0; for(let i=0;i+1<punches.length;i+=2){ let a=_tomin(punches[i]),b=_tomin(punches[i+1]); if(b<a)b+=1440; horas+=b-a; }
    const status = full || (punches.length?'Normal':'Falta');
    const turno = punches.length ? (_tomin(punches[0])<720?'Almoço':(_tomin(punches[0])>=840?'Jantar':'Misto')) : '';
    const sld = saldos.length?saldos[saldos.length-1]:'';
    const banco = sld ? (sld[0]==='-'?-1:1)*_tomin(sld.replace(/[+\-]/,'')) : 0;
    dias.push({ data:`${yy}-${mm}-${dd}`, dataBR:`${dd}/${mm}`, wd, status,
      ent:punches[0]||'', sai:punches.length>=2?punches[punches.length-1]:'', horas:+(horas/60).toFixed(2), turno, banco, sld });
  });
  return { dias, periodoTxt };
}
window.onSecullumFile = async function(input){
  const file=input.files&&input.files[0]; if(!file) return; input.value='';
  if(!window.pdfjsLib){ alert('Biblioteca de PDF não carregou. Recarregue a página e tente de novo.'); return; }
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); text+=extrairLinhasPDF(await pg.getTextContent())+'\n'; }
    const parsed=parseSecullum(text);
    if(!parsed.dias.length){ alert('Não consegui identificar os dias no PDF. É um cartão Secullum?'); return; }
    const up=text.toUpperCase();
    const f=S.funcionarios.find(x=> up.includes((x.nome||'').toUpperCase().slice(0,18)));
    pontoImport={ funcId:f?f.id:null, funcNomePDF:f?f.nome:'(não identificado)', dias:parsed.dias, periodoTxt:parsed.periodoTxt };
    current='ponto'; render();
  }catch(e){ alert('Erro ao ler o PDF: '+(e.message||e)); }
};
window.cancelarImport=function(){ pontoImport=null; render(); };
window.setImportFunc=function(id){ pontoImport.funcId=+id||null; render(); };
window.setImportStatus=function(i,st){ pontoImport.dias[i].status=st; render(); };

function viewImportPreview(){
  const p=S.periodoAtual, imp=pontoImport;
  const dentro=imp.dias.filter(d=> p && d.data>=p.data_inicio && d.data<=p.data_fim);
  const cnt={}; dentro.forEach(d=>cnt[d.status]=(cnt[d.status]||0)+1);
  const chips=Object.entries(cnt).map(([k,v])=>`<span class="badge bg-slate-100 text-slate-700 mr-1">${k}: ${v}</span>`).join('');
  const totalBanco=dentro.reduce((a,d)=>a+d.banco,0);
  const bsg=totalBanco<0?'-':'+', ba=Math.abs(totalBanco);
  return card(`<div class="p-5 mb-4 border-2 border-blue-200">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="file-text" class="w-4 h-4 text-blue-600"></i>Prévia da leitura ${imp.periodoTxt?`<span class="font-normal text-slate-400 text-sm">(${imp.periodoTxt})</span>`:''}</h3>
        <button onclick="cancelarImport()" class="text-slate-400 hover:text-slate-700"><i data-feather="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex flex-wrap items-center gap-3 mb-3 text-sm">
        <span class="text-slate-500">Funcionário:</span>
        <select onchange="setImportFunc(this.value)" class="px-2 py-1 border ${imp.funcId?'border-slate-200':'border-amber-300 bg-amber-50'} rounded text-sm"><option value="">— selecione —</option>${S.funcionarios.map(f=>`<option value="${f.id}" ${f.id===imp.funcId?'selected':''}>${f.nome}</option>`).join('')}</select>
        ${imp.funcId?'':'<span class="text-amber-600 text-xs">não identifiquei pelo PDF — escolha manualmente</span>'}
      </div>
      <div class="mb-3 text-sm flex items-center gap-2 flex-wrap"><span class="text-slate-500">No período (${dentro.length} dias):</span> ${chips||'<span class="text-slate-400">nenhum dia do PDF cai no período</span>'} ${dentro.length?`<span class="badge bg-indigo-100 text-indigo-700">Banco: ${bsg}${String(Math.floor(ba/60)).padStart(2,'0')}:${String(ba%60).padStart(2,'0')}</span>`:''}</div>
      <div class="overflow-x-auto max-h-72 overflow-y-auto border border-slate-100 rounded"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600 sticky top-0"><tr><th class="px-2 py-1.5 text-left">Data</th><th class="px-2 py-1.5">Dia</th><th class="px-2 py-1.5">Entrada</th><th class="px-2 py-1.5">Saída</th><th class="px-2 py-1.5">Horas</th><th class="px-2 py-1.5">Turno</th><th class="px-2 py-1.5">Banco</th><th class="px-2 py-1.5 text-left">Status</th></tr></thead><tbody>
        ${imp.dias.map((d,i)=>{ const noper = p && d.data>=p.data_inicio && d.data<=p.data_fim;
          return `<tr class="border-b border-slate-100 ${noper?'':'opacity-40'}">
            <td class="px-2 py-1 font-medium">${d.dataBR}</td><td class="px-2 py-1 text-center text-slate-500">${d.wd}</td>
            <td class="px-2 py-1 text-center ${d.ent?'':'text-slate-300'}">${d.ent||'—'}</td><td class="px-2 py-1 text-center ${d.sai?'':'text-slate-300'}">${d.sai||'—'}</td>
            <td class="px-2 py-1 text-center">${d.horas?d.horas.toFixed(2)+'h':'—'}</td><td class="px-2 py-1 text-center text-slate-500">${d.turno||'—'}</td>
            <td class="px-2 py-1 text-center ${d.sld.startsWith('+')?'text-green-600':d.sld.startsWith('-')?'text-red-500':'text-slate-300'}">${d.sld||'—'}</td>
            <td class="px-2 py-1"><select onchange="setImportStatus(${i},this.value)" class="px-1 py-0.5 border border-slate-200 rounded text-xs">${ST_PONTO.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></td>
          </tr>`;}).join('')}
      </tbody></table></div>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="cancelarImport()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded text-sm hover:bg-slate-100">Cancelar</button>
        <button onclick="aplicarImport()" class="px-4 py-2 bg-green-600 text-white rounded text-sm font-medium hover:bg-green-700 flex items-center gap-2"><i data-feather="check" class="w-4 h-4"></i>Aplicar à grade (${dentro.length} dias)</button>
      </div>
      <p class="text-[11px] text-slate-400 mt-2">Só os dias dentro do período selecionado serão aplicados. Linhas esmaecidas estão fora do período.</p>
    </div>`);
}
window.aplicarImport = async function(){
  const imp=pontoImport, p=S.periodoAtual;
  if(!imp.funcId){ alert('Escolha o funcionário.'); return; }
  if(!p){ alert('Selecione um período.'); return; }
  const dentro=imp.dias.filter(d=> d.data>=p.data_inicio && d.data<=p.data_fim);
  if(!dentro.length){ alert('Nenhum dia do PDF cai no período selecionado.'); return; }
  const fid=imp.funcId, nome=imp.funcNomePDF;
  await sb.from('controle_ponto').delete().eq('funcionario_id',fid).eq('periodo_id',p.id);
  const recs=dentro.map(d=>({ funcionario_id:fid, periodo_id:p.id, data:d.data, status:d.status,
    horas_trabalhadas:d.horas||0, banco_minutos:d.banco||0, turno:d.turno||null,
    entrada_1:d.ent||null, saida_1:d.sai||null, origem:'upload', validado:true }));
  const { error }=await sb.from('controle_ponto').insert(recs);
  if(error){ alert('Erro ao gravar: '+error.message); return; }
  pontoImport=null; await carregarPonto(); render();
  alert('Cartão importado: '+dentro.length+' dias aplicados.');
};
</script>
