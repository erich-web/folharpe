<script>
/* ===================== CONFIG SUPABASE ===================== */
const SUPABASE_URL = 'https://kzizdoydveqvxycekxla.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VTPAgxA-SpD21Fb9kHxVjg_bOkcFrXa';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================== ESTADO ===================== */
const S = {
  session:null, perfil:null,
  restaurante:null, config:null,
  setores:[], cargos:[], funcionarios:[], rateio:[], ranking:[], ciclos:[],
  loading:false, erro:null,
};
let current='dashboard';
let modalCad=null;

/* ===================== HELPERS ===================== */
const money = v => 'R$ '+ (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (v,d=2) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const setorNome = id => (S.setores.find(s=>s.id===id)||{}).nome || '—';
const cargoById = id => S.cargos.find(c=>c.id===id) || null;
function setorBadge(s){
  const c={'Salão':'bg-blue-100 text-blue-700','Cozinha':'bg-orange-100 text-orange-700','Bar':'bg-purple-100 text-purple-700','Porta':'bg-teal-100 text-teal-700','Escritório':'bg-slate-200 text-slate-700','Liderança':'bg-amber-100 text-amber-700','Outros':'bg-slate-100 text-slate-600'}[s]||'bg-slate-100 text-slate-600';
  return `<span class="badge ${c}">${s||'—'}</span>`;
}
function card(inner, cls=''){ return `<div class="bg-white rounded-lg border border-slate-200 ${cls}">${inner}</div>`; }
function pageHeader(t, s){ return `<div class="mb-6"><h1 class="text-3xl font-bold text-slate-900 mb-1">${t}</h1><p class="text-slate-500 text-sm">${s||''}</p></div>`; }

/* datas / ciclos */
const MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOWF=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function stripT(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function fmtData(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function fmtDM(d){ return `${String(d.getDate()).padStart(2,'0')}/${MES_ABR[d.getMonth()]}`; }
function nthBusinessDay(ano,mes,n){ let d=new Date(ano,mes-1,1),c=0; while(c<n){const w=d.getDay(); if(w!==0&&w!==6)c++; if(c<n)d.setDate(d.getDate()+1);} return d; }
function dataPagamento(c,ano,mes){ return c.pag_tipo==='util'?nthBusinessDay(ano,mes,c.pag_n):new Date(ano,mes-1,c.pag_dia); }
function janelaApur(c,ano,mes){ return {ini:new Date(ano,mes-1+c.apur_ini_off,c.apur_ini_dia), fim:new Date(ano,mes-1+c.apur_fim_off,c.apur_fim_dia)}; }
function proximoPagamento(hoje){
  const base=hoje.getFullYear()*12+hoje.getMonth(); const cands=[];
  for(let k=-1;k<=4;k++){const ym=base+k,ano=Math.floor(ym/12),mes=ym%12+1; S.ciclos.forEach(c=>cands.push({c,dp:dataPagamento(c,ano,mes),jan:janelaApur(c,ano,mes)}));}
  const h=stripT(hoje); return cands.filter(x=>stripT(x.dp)>=h).sort((a,b)=>a.dp-b.dp)[0];
}

/* ===================== AUTENTICAÇÃO ===================== */
async function carregarSessao(){
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if(S.session){ await carregarDados(); }
  render();
}
sb.auth.onAuthStateChange((_e, session)=>{ S.session=session; if(session){ carregarDados().then(render); } else { render(); } });

async function entrar(){
  S.erro=null;
  const email=val('login_email'), senha=val('login_senha');
  const { error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error){ S.erro=traduzErro(error.message); render(); }
}
async function cadastrarUsuario(){
  S.erro=null;
  const email=val('login_email'), senha=val('login_senha');
  const { error } = await sb.auth.signUp({ email, password:senha });
  if(error){ S.erro=traduzErro(error.message); } else { S.erro='Conta criada. Se pedir confirmação por e-mail, confirme e faça login (ou desative a confirmação no painel do Supabase).'; }
  render();
}
async function sair(){ await sb.auth.signOut(); S.restaurante=null; }
function traduzErro(m){
  if(/Invalid login/i.test(m)) return 'E-mail ou senha inválidos.';
  if(/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Confirme pelo link enviado ou desative a confirmação no painel do Supabase.';
  if(/already registered/i.test(m)) return 'Esse e-mail já tem conta. Faça login.';
  return m;
}

/* ===================== CARREGAR DADOS ===================== */
async function carregarDados(){
  S.loading=true; render();
  try{
    const r = await sb.from('restaurantes').select('*').order('id').limit(1).single();
    S.restaurante = r.data;
    const rid = S.restaurante?.id;
    const [cfg, set, car, fun, rat, rank, cic] = await Promise.all([
      sb.from('config_remuneracao').select('*').eq('restaurante_id',rid).single(),
      sb.from('setores').select('*').eq('restaurante_id',rid).order('ordem'),
      sb.from('cargos').select('*, setores(nome)').eq('restaurante_id',rid).order('pontos',{ascending:false}),
      sb.from('funcionarios').select('*, cargos(nome,pontos,setor_id,setores(nome))').eq('restaurante_id',rid).order('nome'),
      sb.from('config_rateio').select('*, setores(nome)').eq('restaurante_id',rid),
      sb.from('ranking_premio').select('*').eq('restaurante_id',rid).order('colocacao'),
      sb.from('ciclos_pagamento').select('*').eq('restaurante_id',rid).order('ordem'),
    ]);
    S.config=cfg.data; S.setores=set.data||[]; S.cargos=car.data||[]; S.funcionarios=fun.data||[];
    S.rateio=rat.data||[]; S.ranking=rank.data||[]; S.ciclos=cic.data||[];
    S.erro=null;
  }catch(e){ S.erro='Erro ao carregar dados: '+(e.message||e); }
  S.loading=false;
}

/* ===================== NAVEGAÇÃO ===================== */
const PAGES=[
  {id:'dashboard',label:'Dashboard',icon:'grid'},
  {id:'cadastro',label:'Cadastro',icon:'users'},
  {id:'config',label:'Configurações',icon:'sliders'},
  {id:'ponto',label:'Folha de Ponto',icon:'calendar'},
  {id:'extras',label:'Extras',icon:'user-plus'},

  {id:'ranking',label:'Ranking',icon:'award'},
  {id:'relatorios',label:'Relatórios',icon:'bar-chart-2'},
];
function go(id){ current=id; render(); }
function val(id){ return (document.getElementById(id)||{}).value; }

  return `<div class="min-h-screen flex items-center justify-center p-4">

        <p class="text-sm text-slate-500">Acesse com seu e-mail</p>
      </div>
      ${card(`<div class="p-6">
        ${S.erro?`<div class="mb-4 p-3 rounded text-sm ${/criada|confirme/i.test(S.erro)?'bg-amber-50 text-amber-700 border border-amber-200':'bg-red-50 text-red-700 border border-red-200'}">${S.erro}</div>`:''}
        <label class="text-xs font-medium text-slate-500 block mb-1">E-mail</label>
        <input id="login_email" type="email" class="w-full px-3 py-2 border border-slate-200 rounded text-sm mb-3" placeholder="voce@gruporpe.com.br">
        <label class="text-xs font-medium text-slate-500 block mb-1">Senha</label>
        <input id="login_senha" type="password" class="w-full px-3 py-2 border border-slate-200 rounded text-sm mb-4" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
        <button onclick="entrar()" class="w-full px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 mb-2">Entrar</button>
        <button onclick="cadastrarUsuario()" class="w-full px-4 py-2 border border-slate-200 text-slate-600 rounded text-sm hover:bg-slate-50">Criar conta</button>
      </div>`)}
      <p class="text-center text-xs text-slate-400 mt-4">Grupo RPE · Mercearia Amauri</p>

}

function viewDashboard(){
  const px = S.ciclos.length ? proximoPagamento(new Date()) : null;
  const dias = px ? Math.round((stripT(px.dp)-stripT(new Date()))/86400000) : 0;
  const proximo = px ? card(`<div class="p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white">
      <div class="flex items-start justify-between">
        <div><p class="text-xs font-semibold text-blue-100 mb-1 flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4"></i>PRÓXIMO PAGAMENTO · ${px.c.nome}</p>
          <p class="text-3xl font-bold">${fmtData(px.dp)}</p>
          <p class="text-sm text-blue-100 mt-1 capitalize">${DOWF[px.dp.getDay()]} · ${dias===0?'hoje':dias===1?'amanhã':'em '+dias+' dias'}</p></div>
        <div class="text-right"><p class="text-xs text-blue-100">Período de apuração</p><p class="text-lg font-bold">${fmtDM(px.jan.ini)} a ${fmtDM(px.jan.fim)}</p></div>
      </div></div>`,'mb-6 border-0 overflow-hidden') : '';
  const kpis=[
    ['COLABORADORES', S.funcionarios.length, 'cadastrados ativos','text-slate-900'],
    ['SETORES', S.setores.length, 'configurados','text-blue-600'],
    ['CARGOS', S.cargos.length, 'na tabela de pontos','text-slate-900'],
    ['CICLOS DE PAGAMENTO', S.ciclos.length, 'configurados','text-green-600'],
  ];
  return pageHeader('Dashboard', `Bem-vindo · ${S.restaurante?.nome||''}`)
    + proximo
    + `<div class="grid grid-cols-4 gap-4">${kpis.map(k=>card(`<div class="p-6"><p class="text-xs text-slate-500 font-semibold mb-2">${k[0]}</p><p class="text-2xl font-bold ${k[3]}">${k[1]}</p><p class="text-xs text-slate-400 mt-2">${k[2]}</p></div>`)).join('')}</div>`
    + `<div class="mt-4">${card(`<div class="p-6"><h3 class="font-bold mb-3 flex items-center gap-2"><i data-feather="info" class="w-4 h-4 text-blue-600"></i>Status do sistema</h3>
        <p class="text-sm text-slate-600">Banco de dados conectado ao Supabase. Cadastro e Configurações já gravam direto no banco. As telas de Ponto, Extras, Comissão e Ranking serão ligadas na sequência.</p></div>`)}</div>`;
}

function viewCadastro(){
  return pageHeader('Cadastro de Funcionários', `${S.funcionarios.length} colaboradores`)
  + `<div class="flex justify-between items-center mb-4">
      <div class="relative"><input id="buscaCad" placeholder="Buscar nome..." class="pl-9 pr-3 py-2 border border-slate-200 rounded text-sm w-72" oninput="filtrarCad(this.value)"><i data-feather="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i></div>
      <button onclick="abrirCadastro(null)" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-2"><i data-feather="plus" class="w-4 h-4"></i>Novo cadastro</button>
    </div>`
  + card(`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
      <tr><th class="px-4 py-3 text-left">Funcionário</th><th class="px-4 py-3 text-left">Cargo</th><th class="px-4 py-3 text-center">Pontos</th><th class="px-4 py-3 text-left">Setor</th><th class="px-4 py-3 text-right">Salário</th><th class="px-4 py-3 text-right">Mín.Gar.</th><th class="px-4 py-3 text-center">Status</th><th class="px-4 py-3"></th></tr></thead>
      <tbody id="cadBody">${S.funcionarios.map(f=>linhaCad(f)).join('')}</tbody></table></div>`);
}
function linhaCad(f){
  const cg=f.cargos||{}; const setor=cg.setores?.nome;
  return `<tr class="border-b border-slate-100 hover:bg-blue-50/40 cadrow" data-n="${(f.nome||'').toLowerCase()}">
    <td class="px-4 py-3 font-medium text-slate-900">${f.nome}</td>
    <td class="px-4 py-3 text-slate-600">${cg.nome||'—'}</td>
    <td class="px-4 py-3 text-center font-semibold">${num(cg.pontos||0,2)}</td>
    <td class="px-4 py-3">${setorBadge(setor)}</td>
    <td class="px-4 py-3 text-right">${money(f.salario)}</td>
    <td class="px-4 py-3 text-right ${f.minimo_garantido>0?'text-amber-600 font-semibold':'text-slate-300'}">${f.minimo_garantido>0?money(f.minimo_garantido):'—'}</td>
    <td class="px-4 py-3 text-center"><span class="badge ${f.status==='Normal'?'bg-green-100 text-green-700':'bg-slate-100 text-slate-600'}">${f.status||'—'}</span></td>
    <td class="px-4 py-3 text-right whitespace-nowrap"><button onclick="abrirCadastro(${f.id})" class="text-blue-600 hover:underline text-xs">Editar</button> <button onclick="excluirFuncionario(${f.id})" class="text-red-500 hover:underline text-xs ml-2">Excluir</button></td>
  </tr>`;
}
function filtrarCad(q){ q=(q||'').toLowerCase(); document.querySelectorAll('.cadrow').forEach(r=>{ r.style.display=r.dataset.n.includes(q)?'':'none'; }); }

function viewStub(titulo){
  return pageHeader(titulo,'Em construção')
    + card(`<div class="p-12 text-center text-slate-400"><i data-feather="tool" class="w-10 h-10 mx-auto mb-3"></i><p class="text-sm">Esta tela será conectada ao banco na próxima etapa.<br>O cálculo já está validado no protótipo; aqui vamos ligá-lo aos dados reais (períodos, ponto e extras).</p></div>`);
}

/* ===================== MODAL CADASTRO ===================== */
function abrirCadastro(id){
  if(id==null){ modalCad={id:null, nome:'', cargo_id:S.cargos[0]?.id, status:'Normal', regime:'CLT', salario:2059.95, minimo_garantido:0, adiantamento:true, beneficios:0}; }
  else { const f=S.funcionarios.find(x=>x.id===id); modalCad={id:f.id, nome:f.nome, cargo_id:f.cargo_id, status:f.status, regime:f.regime, salario:f.salario, minimo_garantido:f.minimo_garantido, adiantamento:f.adiantamento, beneficios:f.beneficios}; }
  render();
}
function fecharModal(){ modalCad=null; render(); }
async function salvarCadastro(){
  const d={ nome:val('cad_nome').trim(), cargo_id:+val('cad_cargo'), status:val('cad_status'), regime:val('cad_regime'),
    salario:+val('cad_salario')||0, minimo_garantido:+val('cad_minimo')||0, adiantamento:val('cad_adiantamento')==='sim', beneficios:+val('cad_beneficios')||0,
    restaurante_id:S.restaurante.id };
  if(!d.nome){ alert('Informe o nome.'); return; }
  let err;
  if(modalCad.id==null){ ({error:err}=await sb.from('funcionarios').insert(d)); }
  else { ({error:err}=await sb.from('funcionarios').update(d).eq('id',modalCad.id)); }
  if(err){ alert('Erro ao salvar: '+err.message); return; }
  modalCad=null; await carregarDados(); render();
}
async function excluirFuncionario(id){
  if(!confirm('Excluir este funcionário?')) return;
  const {error}=await sb.from('funcionarios').delete().eq('id',id);
  if(error){ alert('Erro ao excluir: '+error.message); return; }
  await carregarDados(); render();
}
function modalHTML(){
  if(!modalCad) return '';
  const m=modalCad, novo=m.id==null;
  const field=(lb,inner)=>`<div><label class="text-xs font-medium text-slate-500 block mb-1">${lb}</label>${inner}</div>`;
  const opt=(arr,v)=>arr.map(o=>`<option value="${o.value??o}" ${(o.value??o)===v?'selected':''}>${o.label??o}</option>`).join('');
  return `<div class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4 animate-fade" onclick="if(event.target===this)fecharModal()">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200"><h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-feather="${novo?'user-plus':'edit-2'}" class="w-5 h-5 text-blue-600"></i>${novo?'Novo cadastro':'Editar funcionário'}</h3><button onclick="fecharModal()" class="text-slate-400 hover:text-slate-700"><i data-feather="x" class="w-5 h-5"></i></button></div>
      <div class="p-6 grid grid-cols-2 gap-4">
        <div class="col-span-2">${field('Nome completo',`<input id="cad_nome" value="${(m.nome||'').replace(/"/g,'&quot;')}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">`)}</div>
        ${field('Cargo', `<select id="cad_cargo" onchange="previewCargo()" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">${opt(S.cargos.map(c=>({value:c.id,label:c.nome})), m.cargo_id)}</select>`)}
        ${field('Status', `<select id="cad_status" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">${opt(['Normal','Processo de Admissão','Extra','Processo de Desligamento'], m.status)}</select>`)}
        ${field('Regime', `<select id="cad_regime" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">${opt(['CLT','PJ','Contrato de Experiência','Sem Regime','Sócio'], m.regime)}</select>`)}
        ${field('Adiantamento', `<select id="cad_adiantamento" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">${opt([{value:'sim',label:'sim'},{value:'nao',label:'não'}], m.adiantamento?'sim':'nao')}</select>`)}
        ${field('Salário (R$)', `<input id="cad_salario" type="number" step="0.01" value="${m.salario}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">`)}
        ${field('Mínimo garantido (R$)', `<input id="cad_minimo" type="number" step="0.01" value="${m.minimo_garantido}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">`)}
        ${field('Benefícios (R$)', `<input id="cad_beneficios" type="number" step="0.01" value="${m.beneficios}" class="w-full px-3 py-2 border border-slate-200 rounded text-sm">`)}
        <div class="col-span-2 p-3 bg-slate-50 rounded text-sm" id="cargoPreview"></div>
      </div>
      <div class="flex justify-end gap-2 px-6 py-4 border-t border-slate-200"><button onclick="fecharModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded text-sm hover:bg-slate-100">Cancelar</button><button onclick="salvarCadastro()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700">${novo?'Cadastrar':'Salvar'}</button></div>
    </div></div>`;
}
function previewCargo(){
  const c=cargoById(+val('cad_cargo')); const el=document.getElementById('cargoPreview');
  if(el&&c) el.innerHTML=`<span class="text-slate-500">Pontos-base:</span> <strong>${num(c.pontos,2)}</strong> <span class="text-slate-300">•</span> <span class="text-slate-500">Setor:</span> ${setorBadge(c.setores?.nome)}`;
}

/* ===================== RENDER ===================== */
function render(){
  const root=document.getElementById('root');
  if(!S.session){ root.innerHTML=viewLogin(); document.getElementById('modalHost').innerHTML=''; feather.replace(); return; }
  if(S.loading && !S.restaurante){ root.innerHTML=`<div class="min-h-screen flex items-center justify-center text-slate-400">Carregando…</div>`; feather.replace(); return; }
  const views={dashboard:viewDashboard,cadastro:viewCadastro,config:()=>viewConfig(),ponto:()=>viewStub('Folha de Ponto'),extras:()=>viewStub('Extras'),comissao:()=>viewStub('Comissão Quinzenal'),ranking:()=>viewStub('Ranking'),relatorios:()=>viewStub('Relatórios')};
  const v=views[current]||viewDashboard;
  root.innerHTML=appShell(v());
  document.getElementById('modalHost').innerHTML=modalHTML();
  feather.replace();
  if(modalCad) previewCargo();
}

/* config view depende de S — definida em config.js inline abaixo */
function viewConfig(){ return (window._viewConfig?window._viewConfig():viewStub('Configurações')); }

carregarSessao();
</script>
<script>
/* ===================== CONFIGURAÇÕES (gravam no banco) ===================== */
window._viewConfig = function(){
  const cfg = S.config || {};
  const somaRateio = S.rateio.reduce((a,r)=>a+Number(r.percentual||0),0);
  const rateioSetor = s => { const r=S.rateio.find(x=>x.tipo==='setor'&&x.setores?.nome===s.nome); return r; };
  const rankingRow = S.rateio.find(x=>x.tipo==='ranking');
  const f=(lb,inner)=>`<div class="flex items-center justify-between mb-3"><span class="text-sm text-slate-600">${lb}</span>${inner}</div>`;
  const numInput=(id,v,suf='')=>`<div class="flex items-center gap-1"><input id="${id}" type="number" step="0.01" value="${v??0}" class="w-24 px-2 py-1 border border-slate-200 rounded text-sm text-right">${suf?`<span class="text-slate-400 text-sm">${suf}</span>`:''}</div>`;
  return pageHeader('Configurações','Regras, rateio, ranking e ciclos — gravam direto no banco')
  + `<div class="grid grid-cols-2 gap-4">`
  + card(`<div class="p-6"><h3 class="font-bold mb-4 flex items-center gap-2"><i data-feather="percent" class="w-4 h-4 text-blue-600"></i>Descontos de pontos (%)</h3>
      ${f('Falta', numInput('cf_falta', cfg.desconto_falta_pct,'%'))}
      ${f('Atraso', numInput('cf_atraso', cfg.desconto_atraso_pct,'%'))}
      ${f('Advertência', numInput('cf_adv', cfg.desconto_advertencia_pct,'%'))}
    </div>`)
  + card(`<div class="p-6"><h3 class="font-bold mb-4 flex items-center gap-2"><i data-feather="dollar-sign" class="w-4 h-4 text-green-600"></i>Valores e holerite</h3>
      ${f('Dobra (R$/turno)', numInput('cf_dobra', cfg.valor_dobra))}
      ${f('Diária de extra (R$)', numInput('cf_extra', cfg.valor_extra_diaria))}
      ${f('Retenção da casa', numInput('cf_retencao', cfg.retencao_casa_pct,'%'))}
      ${f('Comissão por dentro do holerite', numInput('cf_dentro', cfg.holerite_dentro_pct,'%'))}
      ${f('% extras descontado da taxa', numInput('cf_descextras', cfg.desc_extras_pct,'%'))}
      ${f('Limite de HE/dia (h)', numInput('cf_he', cfg.limite_he_dia_horas,'h'))}
    </div>`)
  + card(`<div class="p-6"><h3 class="font-bold mb-4 flex items-center gap-2"><i data-feather="pie-chart" class="w-4 h-4 text-blue-600"></i>Rateio por setor</h3>
      ${S.setores.map(s=>{const r=rateioSetor(s); return f(s.nome, numInput('cr_'+s.id, r?.percentual||0,'%'));}).join('')}
      ${f('Ranking', numInput('cr_ranking', rankingRow?.percentual||0,'%'))}
      <div class="mt-2 pt-2 border-t flex justify-between text-sm font-semibold ${Math.round(somaRateio)===100?'text-green-600':'text-red-600'}"><span>Soma</span><span>${num(somaRateio,0)}%</span></div>
    </div>`)
  + card(`<div class="p-6"><h3 class="font-bold mb-4 flex items-center gap-2"><i data-feather="award" class="w-4 h-4 text-amber-600"></i>Ranking — % por colocação</h3>
      ${S.ranking.map(r=>f(r.colocacao+'º lugar', numInput('rk_'+r.id, r.percentual,'%'))).join('')||'<p class="text-sm text-slate-400">Sem colocações.</p>'}
    </div>`)
  + `</div>`
  + `<div class="mt-4">${card(`<div class="p-6"><h3 class="font-bold mb-4 flex items-center gap-2"><i data-feather="repeat" class="w-4 h-4 text-blue-600"></i>Ciclos de pagamento</h3>
      <div class="space-y-2">${S.ciclos.map(c=>`<div class="p-3 border border-slate-200 rounded text-sm flex items-center justify-between">
        <div><strong>${c.nome}</strong> · apuração dia ${c.apur_ini_dia} (${c.apur_ini_off<0?'mês ant.':'mês corr.'}) ao ${c.apur_fim_dia} (${c.apur_fim_off<0?'mês ant.':'mês corr.'})</div>
        <div class="text-slate-500">pagamento: ${c.pag_tipo==='util'?c.pag_n+'º dia útil':'dia '+c.pag_dia}</div>
      </div>`).join('')}</div>
      <p class="text-[11px] text-slate-400 mt-3">Edição detalhada dos ciclos entra na próxima etapa.</p></div>`)}</div>`
  + `<div class="mt-4 flex justify-end"><button onclick="salvarConfig()" class="px-5 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-2"><i data-feather="save" class="w-4 h-4"></i>Salvar configurações</button></div>`;
};

window.salvarConfig = async function(){
  const v=id=>+(document.getElementById(id)||{}).value||0;
  // config_remuneracao
  const dentro=v('cf_dentro');
  const upd={ desconto_falta_pct:v('cf_falta'), desconto_atraso_pct:v('cf_atraso'), desconto_advertencia_pct:v('cf_adv'),
    valor_dobra:v('cf_dobra'), valor_extra_diaria:v('cf_extra'), retencao_casa_pct:v('cf_retencao'),
    holerite_dentro_pct:dentro, holerite_fora_pct:100-dentro, desc_extras_pct:v('cf_descextras'), limite_he_dia_horas:v('cf_he'), updated_at:new Date().toISOString() };
  let e1=(await sb.from('config_remuneracao').update(upd).eq('id',S.config.id)).error;
  // rateio por setor
  for(const s of S.setores){ const r=S.rateio.find(x=>x.tipo==='setor'&&x.setor_id===s.id); const pct=v('cr_'+s.id);
    if(r) await sb.from('config_rateio').update({percentual:pct}).eq('id',r.id);
    else await sb.from('config_rateio').insert({restaurante_id:S.restaurante.id,tipo:'setor',setor_id:s.id,percentual:pct}); }
  const rk=S.rateio.find(x=>x.tipo==='ranking'); const rkv=v('cr_ranking');
  if(rk) await sb.from('config_rateio').update({percentual:rkv}).eq('id',rk.id);
  else await sb.from('config_rateio').insert({restaurante_id:S.restaurante.id,tipo:'ranking',percentual:rkv});
  // ranking premio
  for(const r of S.ranking){ await sb.from('ranking_premio').update({percentual:v('rk_'+r.id)}).eq('id',r.id); }
  if(e1){ alert('Erro ao salvar config: '+e1.message); return; }
  await carregarDados(); render();
  alert('Configurações salvas.');
};
</script>
</body>
</html>
