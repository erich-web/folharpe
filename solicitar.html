<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Extras · Amauri</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:9999px;font-size:11px;font-weight:600}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px}.animate-fade{animation:f .2s ease}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="root"></div>
<script>
const SUPABASE_URL='https://kzizdoydveqvxycekxla.supabase.co';
const SUPABASE_KEY='sb_publishable_VTPAgxA-SpD21Fb9kHxVjg_bOkcFrXa';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PERIODO_LBL={almoco:'Almoço',jantar:'Jantar',ambos:'Almoço e Jantar'};
const DOWF=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const PWIN={almoco:[11,12,13,14,15,16],jantar:[18,19,20,21,22,23,0,1]};
const hoje=()=>new Date().toISOString().slice(0,10);
const S={session:null,perfil:null,setores:[],funcionarios:[],config:{},minhas:[],erro:null,loading:true,ok:null,
  selSetor:1, selData:hoje(), escala:[], meta:[], sol:[], cart:[],
  form:{tipo:'extra',periodo:'almoco',qtd:1,funcionario_id:null,valor:'',valorManual:false}};
const money=v=>'R$ '+(Number(v||0)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const val=id=>(document.getElementById(id)||{}).value;
const setorNome=id=>(S.setores.find(s=>s.id===id)||{}).nome||'—';
const periodosUnit=per=>per==='ambos'?2:1;
const valorPorPeriodo=tipo=>tipo==='dobra'?Number(S.config?.valor_dobra||0):Number(S.config?.valor_extra_diaria||0);
const valorDefault=(tipo,per)=>periodosUnit(per)*valorPorPeriodo(tipo);
const dow=d=>new Date(d+'T00:00:00').getDay();
const funcById=id=>S.funcionarios.find(f=>f.id===id);
const cargoFunc=id=>{const f=funcById(id);return f&&f.cargos?f.cargos.nome:'';};

async function boot(){ const {data:{session}}=await sb.auth.getSession(); S.session=session; if(session)await carregar(); S.loading=false; render(); }
sb.auth.onAuthStateChange((_e,session)=>{ S.session=session; });
async function entrar(){ S.erro=null; const {error}=await sb.auth.signInWithPassword({email:val('login_email'),password:val('login_senha')}); if(error){S.erro='E-mail ou senha inválidos.';render();return;} const {data:{session}}=await sb.auth.getSession(); S.session=session; S.loading=true; render(); await carregar(); S.loading=false; render(); }
async function sair(){ await sb.auth.signOut(); S.session=null; S.perfil=null; render(); }

async function carregar(){
  const uid=S.session.user.id;
  const [prof,set,fun,cfg]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).single(),
    sb.from('setores').select('id,nome').eq('restaurante_id',1).order('ordem'),
    sb.from('funcionarios').select('id,nome, cargos(nome,setor_id)').eq('restaurante_id',1).order('nome'),
    sb.from('config_remuneracao').select('valor_extra_diaria,valor_dobra').eq('restaurante_id',1).single(),
  ]);
  S.perfil=prof.data; S.setores=set.data||[]; S.funcionarios=fun.data||[]; S.config=cfg.data||{};
  await carregarSetor(); await carregarMinhas();
}
async function carregarSetor(){
  const [e,m,sol]=await Promise.all([
    sb.from('escala').select('data,cargo,status,periodo,funcionario_id,nome').eq('setor_id',S.selSetor),
    sb.from('escala_meta_hora').select('dow,hora,meta').eq('setor_id',S.selSetor),
    sb.from('solicitacoes_extra').select('data,periodo,quantidade,status_gg,status_rh,tipo').eq('setor_id',S.selSetor),
  ]);
  S.escala=e.data||[]; S.meta=m.data||[]; S.sol=sol.data||[];
}
async function carregarMinhas(){ const {data}=await sb.from('solicitacoes_extra').select('*, setores(nome), funcionarios(nome)').eq('solicitante_uid',S.session.user.id).order('data',{ascending:false}).limit(40); S.minhas=data||[]; }
function podeSolicitar(){ return ['lider','rh','admin','gerente'].includes(S.perfil?.papel); }

function metaHora(dw,h){ const m=(S.meta||[]).find(x=>x.dow===dw&&x.hora===h); return m?Number(m.meta):0; }
function recomendado(dw,per){ return Math.max(0,...PWIN[per].map(h=>metaHora(dw,h))); }
function escalados(data,per){ return (S.escala||[]).filter(r=>r.data===data&&r.status==='trabalha'&&(r.periodo===per||r.periodo==='ambos')).length; }
function cargosDia(data,per){ const m={}; (S.escala||[]).filter(r=>r.data===data&&r.status==='trabalha'&&(r.periodo===per||r.periodo==='ambos')).forEach(r=>{const c=(r.cargo||'—').toUpperCase();m[c]=(m[c]||0)+1;}); return m; }
function extrasPedidos(data,per){ // já solicitados (não reprovados) + no carrinho
  let n=(S.sol||[]).filter(s=>s.data===data&&(s.periodo===per||s.periodo==='ambos')&&s.status_gg!=='reprovado'&&s.status_rh!=='reprovado').reduce((a,s)=>a+(Number(s.quantidade)||1),0);
  n+=S.cart.filter(c=>c.setor_id===S.selSetor&&c.data===data&&(c.periodo===per||c.periodo==='ambos')).reduce((a,c)=>a+(c.tipo==='extra'?c.qtd:1),0);
  return n;
}

/* ---- form em lote ---- */
window.setSetor=async function(v){ S.selSetor=+v; await carregarSetor(); render(); };
window.setData=function(v){ S.selData=v; render(); };
window.navData=function(delta){ const d=new Date(S.selData+'T00:00:00'); d.setDate(d.getDate()+delta); S.selData=d.toISOString().slice(0,10); render(); };
window.fTipo=function(v){ S.form.tipo=v; S.form.funcionario_id=null; if(!S.form.valorManual)S.form.valor=''; render(); };
window.fPeriodo=function(v){ S.form.periodo=v; if(!S.form.valorManual)S.form.valor=''; render(); };
window.fFunc=function(v){ S.form.funcionario_id=+v||null; render(); };
window.fQtd=function(v){ S.form.qtd=Math.max(1,+v||1); };
window.fValor=function(v){ S.form.valor=v; S.form.valorManual=true; };

window.addItem=function(){
  const f=S.form; const data=S.selData, per=f.periodo, tipo=f.tipo;
  if(tipo==='dobra' && !f.funcionario_id){ alert('Escolha o funcionário da dobra.'); return; }
  const qtd = tipo==='extra'? Math.max(1,+f.qtd||1) : 1;
  const valor = f.valorManual&&f.valor!==''? Number(f.valor) : valorDefault(tipo,per);
  // alerta de excesso
  const pers = per==='ambos'?['almoco','jantar']:[per];
  for(const p of pers){
    const rec=recomendado(dow(data),p); if(rec<=0) continue;
    const proj=escalados(data,p)+extrasPedidos(data,p)+qtd;
    if(proj>rec){ if(!confirm(`Número excede o recomendado em ${setorNome(S.selSetor)} · ${DOWF[dow(data)]} ${data.slice(8,10)}/${data.slice(5,7)} (${PERIODO_LBL[p]}): ${proj} de ${rec} recomendados. Deseja continuar?`)) return; break; }
  }
  S.cart.push({ setor_id:S.selSetor, data, periodo:per, tipo, qtd,
    funcionario_id: tipo==='dobra'?f.funcionario_id:null,
    funcNome: tipo==='dobra'?(funcById(f.funcionario_id)||{}).nome:null,
    cargo: tipo==='dobra'?cargoFunc(f.funcionario_id):null, valor });
  S.form={tipo:f.tipo,periodo:f.periodo,qtd:1,funcionario_id:null,valor:'',valorManual:false};
  render();
};
window.delItem=function(i){ S.cart.splice(i,1); render(); };
window.enviar=async function(btn){
  if(!S.cart.length){ alert('Adicione ao menos um extra/dobra à lista.'); return; }
  const lider=val('sol_lider')||S.perfil?.nome||S.session.user.email;
  const rows=[];
  S.cart.forEach(c=>{ const n=c.tipo==='extra'?c.qtd:1; for(let i=0;i<n;i++) rows.push({
    restaurante_id:1, tipo:c.tipo, setor_id:c.setor_id, data:c.data, quantidade:1, periodo:c.periodo,
    tipo_pessoa:c.tipo==='dobra'?'funcionario':null, funcionario_id:c.funcionario_id||null, valor:c.valor,
    solicitante:lider, solicitante_uid:S.session.user.id }); });
  if(btn){btn.disabled=true;btn.textContent='Enviando…';}
  const {error}=await sb.from('solicitacoes_extra').insert(rows);
  if(error){ alert('Erro: '+error.message); render(); return; }
  S.cart=[]; S.ok=`${rows.length} solicitação(ões) enviada(s)! Aguardando Gerente Geral e RH.`;
  await carregarSetor(); await carregarMinhas(); render(); setTimeout(()=>{S.ok=null;},6000);
};

function ggBadge(s){ return s.status_gg==='aprovado'?'<span class="badge bg-green-100 text-green-700">GG ✓</span>':s.status_gg==='reprovado'?'<span class="badge bg-rose-100 text-rose-700">GG ✗</span>':'<span class="badge bg-slate-100 text-slate-500">GG pend.</span>'; }
function rhBadge(s){ return s.status_rh==='aprovado'?'<span class="badge bg-green-100 text-green-700">RH ✓</span>':s.status_rh==='reprovado'?'<span class="badge bg-rose-100 text-rose-700">RH ✗</span>':'<span class="badge bg-slate-100 text-slate-500">RH pend.</span>'; }
function tipoBadge(t){ return t==='dobra'?'<span class="badge bg-purple-100 text-purple-700">Dobra</span>':'<span class="badge bg-blue-100 text-blue-700">Extra</span>'; }
function finalBadge(s){ if(s.status_gg==='reprovado'||s.status_rh==='reprovado')return '<span class="badge bg-rose-100 text-rose-700">Reprovado</span>'; if(s.provisionado)return '<span class="badge bg-emerald-100 text-emerald-700">Provisionado</span>'; return '<span class="badge bg-amber-100 text-amber-700">Pendente</span>'; }

function viewLogin(){
  return `<div class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6"><div class="w-14 h-14 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center mb-3"><i data-feather="user-plus" class="text-white w-7 h-7"></i></div>
      <h1 class="text-xl font-bold">Solicitar Extras</h1><p class="text-sm text-slate-500">Mercearia Amauri · acesso do líder</p></div>
    <div class="card p-6">${S.erro?`<div class="mb-4 p-3 rounded text-sm bg-red-50 text-red-700 border border-red-200">${S.erro}</div>`:''}
      <label class="text-xs font-medium text-slate-500 block mb-1">E-mail</label>
      <input id="login_email" type="email" class="w-full px-3 py-2 border border-slate-200 rounded text-sm mb-3" placeholder="voce@gruporpe.com.br">
      <label class="text-xs font-medium text-slate-500 block mb-1">Senha</label>
      <input id="login_senha" type="password" class="w-full px-3 py-2 border border-slate-200 rounded text-sm mb-4" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
      <button onclick="entrar()" class="w-full px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700">Entrar</button>
    </div><p class="text-center text-xs text-slate-400 mt-4">Grupo RPE</p></div></div>`;
}

function periodoCard(per){
  const data=S.selData, dw=dow(data);
  const cs=cargosDia(data,per); const esc=escalados(data,per); const ex=extrasPedidos(data,per); const rec=recomendado(dw,per);
  const total=esc+ex; const over=rec>0&&total>rec;
  const cargos=Object.entries(cs).sort((a,b)=>b[1]-a[1]);
  return `<div class="rounded-lg border ${over?'border-amber-300 bg-amber-50/40':'border-slate-200'} p-3">
    <div class="flex items-center justify-between mb-2"><span class="font-semibold text-sm ${per==='almoco'?'text-sky-700':'text-purple-700'}">${PERIODO_LBL[per]}</span>
      <span class="text-xs ${over?'text-amber-700 font-semibold':'text-slate-500'}">${esc} escal.${ex?` +${ex} extra`:''}${rec>0?` / meta ${rec}`:''}</span></div>
    ${cargos.length?`<div class="flex flex-wrap gap-1">${cargos.map(([c,n])=>`<span class="badge bg-slate-100 text-slate-600">${c} ${n}</span>`).join('')}</div>`:'<p class="text-xs text-slate-400">Sem escala neste período.</p>'}
    ${over?'<p class="text-[11px] text-amber-700 mt-1">Acima do recomendado.</p>':''}</div>`;
}

function viewForm(){
  const f=S.form; const setorSel=`<select onchange="setSetor(this.value)" class="px-2 py-1.5 border border-slate-200 rounded text-sm">${S.setores.map(s=>`<option value="${s.id}" ${s.id===S.selSetor?'selected':''}>${s.nome}</option>`).join('')}</select>`;
  const dw=dow(S.selData);
  const escalaCard=`<div class="card p-5">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
      <h3 class="font-bold flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-blue-600"></i>Escala do dia</h3>
      <div class="flex items-center gap-2">${setorSel}
        <div class="flex items-center gap-1"><button onclick="navData(-1)" class="p-1.5 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-left" class="w-4 h-4"></i></button>
        <input type="date" value="${S.selData}" onchange="setData(this.value)" class="px-2 py-1.5 border border-slate-200 rounded text-sm">
        <button onclick="navData(1)" class="p-1.5 border border-slate-200 rounded hover:bg-slate-100"><i data-feather="chevron-right" class="w-4 h-4"></i></button></div>
      </div>
    </div>
    <p class="text-xs text-slate-500 mb-3">${DOWF[dw]} · ${S.selData.slice(8,10)}/${S.selData.slice(5,7)} · ${setorNome(S.selSetor)} — pessoas por cargo em cada período (verde = ok, âmbar = acima do recomendado).</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${periodoCard('almoco')}${periodoCard('jantar')}</div>
  </div>`;

  const isDobra=f.tipo==='dobra';
  const valDef=valorDefault(f.tipo,f.periodo);
  const valVal = f.valorManual&&f.valor!==''? f.valor : valDef;
  const formCard=`<div class="card p-5">
    <h3 class="font-bold mb-1 flex items-center gap-2"><i data-feather="plus-circle" class="w-4 h-4 text-blue-600"></i>Adicionar extra / dobra</h3>
    <p class="text-xs text-slate-500 mb-3">Para <strong>${S.selData.slice(8,10)}/${S.selData.slice(5,7)}</strong> · <strong>${setorNome(S.selSetor)}</strong> (mude no topo). Monte a lista e envie tudo de uma vez.</p>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-slate-500 block mb-1">Tipo</label><select onchange="fTipo(this.value)" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"><option value="extra" ${!isDobra?'selected':''}>Extra</option><option value="dobra" ${isDobra?'selected':''}>Dobra</option></select></div>
      <div><label class="text-xs text-slate-500 block mb-1">Período</label><select onchange="fPeriodo(this.value)" class="w-full px-2 py-2 border border-slate-200 rounded text-sm">${['almoco','jantar','ambos'].map(p=>`<option value="${p}" ${f.periodo===p?'selected':''}>${PERIODO_LBL[p]}</option>`).join('')}</select></div>
      ${isDobra
        ? `<div class="col-span-2"><label class="text-xs text-slate-500 block mb-1">Funcionário (dobra)</label><select onchange="fFunc(this.value)" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"><option value="">— escolher —</option>${S.funcionarios.map(fu=>`<option value="${fu.id}" ${f.funcionario_id===fu.id?'selected':''}>${fu.nome}</option>`).join('')}</select>${f.funcionario_id?`<p class="text-[11px] text-slate-500 mt-1">Cargo: <strong>${cargoFunc(f.funcionario_id)||'—'}</strong></p>`:''}</div>`
        : `<div><label class="text-xs text-slate-500 block mb-1">Quantidade</label><input type="number" min="1" value="${f.qtd}" oninput="fQtd(this.value)" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>`}
      <div><label class="text-xs text-slate-500 block mb-1">Valor (R$)${!f.valorManual?` <span class="text-slate-400">padrão</span>`:''}</label><input type="number" step="0.01" value="${valVal}" oninput="fValor(this.value)" class="w-full px-2 py-2 border border-slate-200 rounded text-sm"></div>
    </div>
    <button onclick="addItem()" class="mt-3 w-full px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 flex items-center justify-center gap-2"><i data-feather="plus" class="w-4 h-4"></i>Adicionar à lista</button>
  </div>`;

  const total=S.cart.reduce((a,c)=>a+(c.tipo==='extra'?c.qtd:1)*c.valor,0);
  const cartCard=`<div class="card p-5">
    <div class="flex items-center justify-between mb-1"><h3 class="font-bold flex items-center gap-2"><i data-feather="shopping-cart" class="w-4 h-4 text-blue-600"></i>Lista a enviar (${S.cart.reduce((a,c)=>a+(c.tipo==='extra'?c.qtd:1),0)})</h3><span class="text-sm font-semibold text-slate-700">${money(total)}</span></div>
    <div class="mb-2"><label class="text-xs text-slate-500 block mb-1">Solicitante</label><input id="sol_lider" value="${(S.perfil?.nome||S.session.user.email||'').replace(/"/g,'&quot;')}" class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm"></div>
    ${S.cart.length?`<div class="overflow-x-auto"><table class="w-full text-xs mb-3"><thead class="bg-slate-50 text-slate-600"><tr><th class="px-2 py-1.5 text-left">Dia</th><th class="px-2 py-1.5 text-left">Setor</th><th class="px-2 py-1.5 text-left">Período</th><th class="px-2 py-1.5 text-left">Tipo</th><th class="px-2 py-1.5 text-left">Pessoa/Cargo</th><th class="px-2 py-1.5 text-center">Qtd</th><th class="px-2 py-1.5 text-right">Valor</th><th></th></tr></thead><tbody>
      ${S.cart.map((c,i)=>`<tr class="border-b border-slate-100"><td class="px-2 py-1.5 font-medium">${c.data.slice(8,10)}/${c.data.slice(5,7)}</td><td class="px-2 py-1.5">${setorNome(c.setor_id)}</td><td class="px-2 py-1.5"><span class="badge bg-slate-100 text-slate-600">${PERIODO_LBL[c.periodo]}</span></td><td class="px-2 py-1.5">${tipoBadge(c.tipo)}</td><td class="px-2 py-1.5 text-slate-600">${c.tipo==='dobra'?`${c.funcNome} <span class="text-slate-400">(${c.cargo||'—'})</span>`:'—'}</td><td class="px-2 py-1.5 text-center">${c.tipo==='extra'?c.qtd:1}</td><td class="px-2 py-1.5 text-right">${money(c.valor)}</td><td class="px-2 py-1.5 text-center"><button onclick="delItem(${i})" class="text-red-400 hover:text-red-600"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button></td></tr>`).join('')}
      </tbody></table></div>
      <button onclick="enviar(this)" class="w-full px-4 py-2 bg-emerald-600 text-white rounded text-sm font-medium hover:bg-emerald-700 flex items-center justify-center gap-2"><i data-feather="send" class="w-4 h-4"></i>Enviar todas (${S.cart.length})</button>`
    :'<p class="text-sm text-slate-400 py-4 text-center">Lista vazia. Adicione extras/dobras acima.</p>'}
  </div>`;

  const minhas=`<div class="card p-5"><h3 class="font-bold mb-3 flex items-center gap-2"><i data-feather="list" class="w-4 h-4 text-blue-600"></i>Minhas solicitações</h3>
    <div class="overflow-x-auto max-h-72 overflow-y-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-600 sticky top-0"><tr><th class="px-2 py-2 text-left">Data</th><th class="px-2 py-2 text-left">Tipo</th><th class="px-2 py-2 text-left">Período</th><th class="px-2 py-2 text-left">Setor</th><th class="px-2 py-2 text-left">Pessoa</th><th class="px-2 py-2 text-center">GG</th><th class="px-2 py-2 text-center">RH</th><th class="px-2 py-2 text-center">Status</th></tr></thead><tbody>
    ${S.minhas.length?S.minhas.map(s=>`<tr class="border-b border-slate-100"><td class="px-2 py-1.5 font-medium">${s.data.slice(8,10)}/${s.data.slice(5,7)}</td><td class="px-2 py-1.5">${tipoBadge(s.tipo)}</td><td class="px-2 py-1.5"><span class="badge bg-slate-100 text-slate-600">${PERIODO_LBL[s.periodo]||s.periodo}</span></td><td class="px-2 py-1.5">${s.setores?.nome||'—'}</td><td class="px-2 py-1.5 text-slate-600">${s.tipo_pessoa==='funcionario'?(s.funcionarios?.nome||'Func.'):s.tipo_pessoa==='freelancer'?(s.nome_freelancer||'Freela'):'—'}</td><td class="px-2 py-1.5 text-center">${ggBadge(s)}</td><td class="px-2 py-1.5 text-center">${rhBadge(s)}</td><td class="px-2 py-1.5 text-center">${finalBadge(s)}</td></tr>`).join(''):'<tr><td colspan="8" class="text-center text-slate-400 py-6">Nenhuma solicitação ainda.</td></tr>'}
    </tbody></table></div></div>`;

  return `<div class="max-w-5xl mx-auto p-4 md:p-8 animate-fade">
    <div class="flex items-center justify-between mb-5"><div><h1 class="text-2xl font-bold">Solicitar Extras</h1><p class="text-sm text-slate-500">Olá, ${S.perfil?.nome||S.session.user.email}</p></div>
      <button onclick="sair()" class="text-slate-500 hover:text-red-600 flex items-center gap-1 text-sm"><i data-feather="log-out" class="w-4 h-4"></i>Sair</button></div>
    ${S.ok?`<div class="mb-4 p-3 rounded text-sm bg-emerald-50 text-emerald-700 border border-emerald-200">${S.ok}</div>`:''}
    ${podeSolicitar()?`${escalaCard}<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">${formCard}${cartCard}</div><div class="mt-4">${minhas}</div>`:'<div class="card p-6 text-center text-slate-500">Seu usuário não tem permissão para solicitar extras. Fale com o RH.</div>'}
  </div>`;
}

function render(){ const root=document.getElementById('root'); if(S.loading){ root.innerHTML='<div class="min-h-screen flex items-center justify-center text-slate-400">Carregando…</div>'; return; } root.innerHTML=S.session?viewForm():viewLogin(); feather.replace(); }
boot();
</script>
</body>
</html>
